# BigBlueButton container stack: configuration contract.
#
# Status: draft. This file is the public configuration API of the
# container images: every environment variable an admin may set is declared here. Generated
# from it (docker/contract/generate.sh): .env.sample (Tier 1) and
# docs/docs/administration/docker-configuration.md (all tiers). docker/contract/validate.sh
# checks this file against the schema in docker/contract/README.md; docker/contract/drift-check.sh
# compares it with what the compose file and the image entrypoints use.
#
# Sources cite upstream as `path:line @ sha`. Pins: bigbluebutton 35cad46a9f,
# bbb-webrtc-sfu 88cb1a9a1c, bbb-webhooks 9787aea975, bbb-webrtc-recorder f660264cf4,
# bbb-install 2547823185, livekit-server 8d11efdfcd.

version: 1

meta:
  status: draft
  upstream: 3b24349d9ab95ccf26f6f54b598f037271443c1d

# --------------------------------------------------------------------------------------------
# variables: what an admin may set. Tier 1 = .env essentials, Tier 2 = optional with defaults.
# --------------------------------------------------------------------------------------------
variables:
  # ------------------------------------------------------------------------------- Tier 1
  - name: BBB_DOMAIN
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?'
    setup: ask
    description: >-
      Public hostname of the server (fully qualified, no scheme, no port). All public URLs, the
      TLS certificate, the TURN realm and the TURN URIs handed to clients are derived from it.
    consumers: [bbb-web, akka-apps, haproxy, certbot, coturn, bbb-webrtc-sfu, recording, webhooks, setup, preflight]
    example: bbb.example.com
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:398,407,411,414,520,550 @ 35cad46a9f — serverURL and the URLs defaulting to it
      - akka-bbb-apps/src/universal/conf/application.conf:69 @ 35cad46a9f — services.bbbWebAPI
      - record-and-playback/core/scripts/bigbluebutton.yml:69 @ 35cad46a9f — playback_host
      - build/packages-template/bbb-webhooks/after-install.sh:12,16 @ 35cad46a9f — bbb.serverDomain
      - config/default.example.yml:539-542 @ 88cb1a9a1c — SFU livekit.bbbDomain (env LIVEKIT_BBB_DOMAIN)
      - docs/docs/administration/turn-server.md:184 @ 35cad46a9f — coturn realm
      - bbb-install.sh:1864-1872 @ 2547823185 — TURN URIs use the host name
      - bbb-install.sh:1604-1605 @ 2547823185 — certificate for the host name

  - name: BBB_PUBLIC_IPV4
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
    setup: detect
    description: >-
      Public IPv4 address of the server. Left empty in .env, the setup container detects it and
      writes it. LiveKit announces it as node_ip (its public ICE candidate). coturn does not use
      it: it relays on its bridge address (see coturn_config).
    consumers: [livekit, setup, preflight]
    example: 203.0.113.10
    status: draft
    notes: >-
      Tested with a public address on the server's interface. A server behind 1:1 NAT
      (floating IP) is untested.
    sources:
      - pkg/routing/node.go:51-53 @ 8d11efdfcd — livekit fails without node_ip (ErrIPNotSet)
      - cmd/server/main.go:44-99 @ 8d11efdfcd — livekit env NODE_IP
      - bbb-install.sh:869-875 @ 2547823185 — upstream TURN_IP from the host address

  - name: BBB_PUBLIC_IPV6
    tier: 1
    required: false
    secret: false
    default: null
    pattern: '([0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}'
    setup: detect
    description: >-
      Public IPv6 address of the server, optional. Empty means IPv4 only. Used by preflight to
      check the AAAA record.
    consumers: [preflight]
    example: '2001:db8::10'
    status: draft
    notes: >-
      The pattern checks the shape only (hex groups and colons), not full IPv6 syntax. Upstream
      binds haproxy on IPv6 but configures no IPv6 address in LiveKit or coturn; public IPv6 in
      containers is untested (UNVERIFIED).
    sources:
      - bbb-install.sh:568-575 @ 2547823185 — bbb-install requires IPv6 support
      - bbb-install.sh:920 @ 2547823185 — haproxy binds :::443

  - name: BBB_SHARED_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      API shared secret (securitySalt). Signs API calls, recording callbacks and webhooks.
      Generated by setup; the known upstream placeholder is rejected.
    consumers: [bbb-web, akka-apps, recording, webhooks]
    example: fixturebbbsharedsecretnotreal0000000000000000000
    status: draft
    notes: >-
      bbb-web cannot take it from env directly (environment variables do not override
      properties keys): its properties file references it as `${BBB_SHARED_SECRET}`, which
      bbb-web resolves from the environment. Recording reads the properties file itself, so the
      recording image needs the real value in /etc/bigbluebutton/bbb-web.properties.
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:448 @ 35cad46a9f — securitySalt
      - build/packages-template/bbb-web/after-install.sh:26-31 @ 35cad46a9f — upstream generates alphanumerics
      - akka-bbb-apps/src/universal/conf/application.conf:70 @ 35cad46a9f — services.sharedSecret
      - record-and-playback/core/scripts/post_publish/post_publish_recording_ready_callback.rb:72-80 @ 35cad46a9f — recording reads securitySalt from the file
      - config/custom-environment-variables.yml:1-4 @ 9787aea975 — webhooks env SHARED_SECRET

  - name: LIVEKIT_API_KEY
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '[A-Za-z0-9]{8,64}'
    setup: generate
    description: >-
      LiveKit API key (identifier of the key pair). Shared by livekit-server, bbb-webrtc-sfu and
      bbb-webrtc-recorder. Generated by setup; the SFU placeholder LIVEKIT_KEY and livekit-sip's
      devkey are rejected.
    consumers: [livekit, bbb-webrtc-sfu, bbb-webrtc-recorder]
    example: fixturelivekitapikey
    status: draft
    sources:
      - build/packages-template/bbb-livekit/after-install.sh:3-17 @ 35cad46a9f — key pair and webhook.api_key
      - build/packages-template/bbb-webrtc-sfu/after-install.sh:60-71 @ 35cad46a9f — SFU livekit.key
      - build/packages-template/bbb-webrtc-recorder/after-install.sh:15-32 @ 35cad46a9f — BBBRECORDER_LIVEKIT_APIKEY
      - config/default.example.yml:539-542 @ 88cb1a9a1c — SFU placeholder values

  - name: LIVEKIT_API_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      LiveKit API secret belonging to LIVEKIT_API_KEY. At least 32 characters: livekit-server
      only logs an error for shorter secrets, so the entrypoints enforce it.
    consumers: [livekit, bbb-webrtc-sfu, bbb-webrtc-recorder]
    example: fixturelivekitapisecretnotreal000000000000000000
    status: draft
    sources:
      - pkg/config/config.go:778-812 @ 8d11efdfcd — secrets under 32 characters are only logged
      - build/packages-template/bbb-livekit/after-install.sh:3-17 @ 35cad46a9f — generated key pair
      - build/packages-template/bbb-webrtc-recorder/after-install.sh:15-32 @ 35cad46a9f — BBBRECORDER_LIVEKIT_APISECRET

  - name: TURN_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9+/=]{32,}'
    setup: generate
    description: >-
      Shared secret for TURN REST credentials. coturn uses it as static-auth-secret, bbb-web to
      hand time-limited TURN credentials to clients. LiveKit gets no TURN configuration.
    consumers: [coturn, bbb-web]
    example: fixtureturnsecretnotreal000000000000000000000000
    status: draft
    notes: >-
      The pattern admits base64 because bbb-install generates the coturn secret with
      `openssl rand -base64 32`; a secret migrated from bare metal keeps working.
    sources:
      - bigbluebutton-web/grails-app/conf/spring/turn-stun-servers.xml:27-28,43-47 @ 35cad46a9f — TurnServer secret argument
      - docs/docs/administration/turn-server.md:181-184 @ 35cad46a9f — coturn static-auth-secret
      - bbb-install.sh:1908-1923 @ 2547823185 — upstream generates it as base64

  - name: POSTGRES_PASSWORD
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      Password of the PostgreSQL superuser. Used by postgres and by the db-init job that
      (re)creates the BBB databases and roles. Application roles have their own passwords
      (POSTGRES_BBB_CORE_PASSWORD, POSTGRES_HASURA_APP_PASSWORD, POSTGRES_BBB_HASURA_PASSWORD,
      POSTGRES_BLOCKNOTE_PASSWORD).
    consumers: [postgres, db-init]
    example: fixturepostgrespasswordnotreal000000000000000000
    status: draft
    notes: Bare metal uses peer authentication for the superuser; containers need a password.
    sources:
      - build/packages-template/bbb-graphql-server/after-install.sh:11-14 @ 35cad46a9f — database init as the postgres superuser

  - name: HASURA_ADMIN_SECRET
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: >-
      Hasura admin secret (HASURA_GRAPHQL_ADMIN_SECRET). Only graphql-server and its metadata
      apply step use it.
    consumers: [graphql-server]
    example: fixturehasuraadminsecretnotreal00000000000000000
    status: draft
    sources:
      - build/packages-template/bbb-graphql-server/after-install.sh:44-57 @ 35cad46a9f — generated, written to admin-pass and config.yaml
      - bbb-graphql-server/config.yaml:3 @ 35cad46a9f — admin_secret for the hasura CLI

  - name: POSTGRES_BBB_CORE_PASSWORD
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: Password of the PostgreSQL role bbb_core (akka-apps).
    consumers: [db-init, akka-apps]
    example: null
    status: draft
    notes: >-
      Generated by setup and applied by db-init when it (re)creates the role. The images require it: "generated" means the admin does not choose it, not that it may be missing — setup (until it exists: the admin, e.g. `openssl rand -hex 24`) writes it to .env.
    sources:
      - akka-bbb-apps/src/universal/conf/application.conf:49-53 @ 35cad46a9f — postgres properties
      - build/packages-template/bbb-graphql-server/after-install.sh:24-26 @ 35cad46a9f — role created with a fixed value

  - name: POSTGRES_HASURA_APP_PASSWORD
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: Password of the PostgreSQL role hasura_app (Hasura metadata database).
    consumers: [db-init, graphql-server]
    example: null
    status: draft
    notes: >-
      Generated by setup and applied by db-init when it (re)creates the role. The images require it: "generated" means the admin does not choose it, not that it may be missing — setup (until it exists: the admin, e.g. `openssl rand -hex 24`) writes it to .env.
    sources:
      - build/packages-template/bbb-graphql-server/hasura-config.env:1 @ 35cad46a9f — HASURA_GRAPHQL_DATABASE_URL
      - build/packages-template/bbb-graphql-server/after-install.sh:16-22 @ 35cad46a9f — role created with a fixed value

  - name: POSTGRES_BBB_HASURA_PASSWORD
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: Password of the PostgreSQL role bbb_hasura (BBB data source of Hasura).
    consumers: [db-init, graphql-server]
    example: null
    status: draft
    notes: >-
      Generated by setup and applied by db-init. The DSN is a literal in the Hasura metadata (no
      from_env); the graphql-server image rewrites it before metadata apply.
      The images require it: "generated" means the admin does not choose it, not that it may be missing — setup (until it exists: the admin, e.g. `openssl rand -hex 24`) writes it to .env.
    sources:
      - bbb-graphql-server/metadata/databases/databases.yaml:19 @ 35cad46a9f — literal DSN
      - build/packages-template/bbb-graphql-server/after-install.sh:33-35 @ 35cad46a9f — role created with a fixed value

  - name: POSTGRES_BLOCKNOTE_PASSWORD
    tier: 1
    required: true
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: generate
    description: Password of the PostgreSQL role blocknote_app (shared notes).
    consumers: [db-init, shared-notes]
    example: null
    status: draft
    notes: >-
      Generated by setup and applied by db-init when it (re)creates the role. The images require it: "generated" means the admin does not choose it, not that it may be missing — setup (until it exists: the admin, e.g. `openssl rand -hex 24`) writes it to .env.
    sources:
      - bbb-shared-notes-server/config/default.yml:39-44 @ 35cad46a9f — postgres.password
      - build/packages-template/bbb-shared-notes-server/after-install.sh:12-20 @ 35cad46a9f — role created with a fixed value

  # Later: phone dial-in (optional `dialin` profile). Not part of this contract version; kept as
  # a reminder of what the profile will need. No FreeSWITCH variables before that phase.
  #
  # - name: DIALIN_SIP_...           SIP gateway address / trunk settings (FreeSWITCH as gateway)
  #   sources: docs/docs/administration/customize.md:940-1006 @ 35cad46a9f
  # - livekit-sip reuses LIVEKIT_API_KEY / LIVEKIT_API_SECRET and must reject its `devkey`
  #   placeholder (build/packages-template/bbb-livekit/livekit-sip.yaml:3-5 @ 35cad46a9f).
  # - FreeSWITCH ESL password: the upstream default `ClueCon` is a known placeholder.

  - name: ACME_EMAIL
    tier: 1
    required: true
    secret: false
    default: null
    pattern: '[A-Za-z0-9._%+-]+@([A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?\.)+[A-Za-z]{2,}'
    setup: ask
    description: >-
      Contact e-mail for the Let's Encrypt account of the TLS certificate. Not needed with the
      external-proxy feature.
    consumers: [certbot]
    example: admin@example.com
    status: draft
    notes: >-
      bbb-install refuses the address used in its docs; the certificate service should refuse
      known example addresses too.
    sources:
      - bbb-install.sh:172-177 @ 2547823185 — -e option, docs address refused
      - bbb-install.sh:1604-1605 @ 2547823185 — certbot --email

  - name: BBB_FEATURES
    tier: 1
    required: false
    secret: false
    default: null
    pattern: '((recording|greenlight|webhooks|monitoring|external-proxy)(,(recording|greenlight|webhooks|monitoring|external-proxy))*)?'
    setup: ask
    description: >-
      Optional features, comma-separated without spaces: recording, greenlight, webhooks,
      monitoring, external-proxy. COMPOSE_PROFILES is derived from it in .env; images read it
      so their configuration matches the running services.
    consumers: [compose, bbb-web, nginx, bbb-webrtc-sfu]
    example: recording
    status: draft
    notes: >-
      What each feature starts and which settings the images derive from it is listed in
      `features`. Set it in .env: Docker Compose then keeps profiles and image configuration
      consistent.
      Unset or empty (`BBB_FEATURES=`) means no optional feature. The default is empty while the
      recording services are not part of the stack; `recording` becomes the default again
      when they are added, as recording is part of the default bare-metal install.
    sources:
      - build/packages-template/bigbluebutton/build.sh:16-33 @ 35cad46a9f — recording is part of the default install, webhooks is not
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:319 @ 35cad46a9f — disableRecordingDefault, set from the recording feature

  # ------------------------------------------------------------------------------- Tier 2
  - name: BBB_UID
    tier: 2
    required: false
    secret: false
    default: '998'
    pattern: '[1-9][0-9]{0,9}'
    setup: null
    description: >-
      User id of every container that writes the shared data volume (/var/bigbluebutton) and the
      recorder volume. Set it to the bigbluebutton user id of an existing bare-metal tree or NFS
      export to keep its ownership.
    consumers: [bbb-web, export-annotations, recording, bbb-webrtc-recorder, bbb-webrtc-sfu]
    example: '998'
    status: draft
    notes: Bare metal assigns the id per host; 998 is the id of the upstream recorder image.
    sources:
      - build/deb-helper.sh:136-152 @ 35cad46a9f — system user created without a fixed uid
      - Dockerfile:26-37 @ f660264cf4 — upstream recorder image user 998

  - name: BBB_GID
    tier: 2
    required: false
    secret: false
    default: '998'
    pattern: '[1-9][0-9]{0,9}'
    setup: null
    description: Group id belonging to BBB_UID.
    consumers: [bbb-web, export-annotations, recording, bbb-webrtc-recorder, bbb-webrtc-sfu]
    example: '998'
    status: draft
    sources:
      - build/deb-helper.sh:136-152 @ 35cad46a9f — system group created without a fixed gid
      - Dockerfile:26-37 @ f660264cf4 — upstream recorder image group 998

  - name: BBB_IMAGE_REGISTRY
    tier: 2
    required: false
    secret: false
    default: ghcr.io/bigbluebutton/bigbluebutton
    pattern: '[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/[a-z0-9]([a-z0-9._-]*[a-z0-9])?)*'
    setup: null
    description: >-
      Registry and namespace of the BBB images (the repository's own namespace, so they never collide
      with the images the component repositories publish, e.g. ghcr.io/bigbluebutton/bbb-webrtc-sfu); compose uses
      `${BBB_IMAGE_REGISTRY}/bbb-<image>:${BBB_IMAGE_TAG}`. Set `localhost` to run images built
      locally with `docker buildx bake`, which tags them the same way.
    consumers: [compose]
    example: ghcr.io/bigbluebutton/bigbluebutton
    status: draft
    notes: One registry and one tag for all BBB images.
    sources:
      - .env.example:1 @ 4e63aa2ff3 — the PR's IMAGE_REPO

  - name: BBB_IMAGE_TAG
    tier: 2
    required: false
    secret: false
    default: '4.0.1'
    pattern: '[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}'
    setup: null
    description: >-
      Tag of all BBB images (third-party images such as redis and postgres are pinned in the
      compose file). The default is the release the compose file belongs to; never `latest`.
    consumers: [compose]
    example: '4.0.1'
    status: draft
    notes: The default follows the release file of the same commit.
    sources:
      - bigbluebutton-config/bigbluebutton-release:1 @ 35cad46a9f — BIGBLUEBUTTON_RELEASE=4.0.1

  - name: BBB_WEB_CONVERSION_URL
    tier: 2
    required: false
    secret: false
    default: 'http://conversion:9980/cool/convert-to'
    pattern: 'https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?'
    setup: null
    description: >-
      Base URL of the Collabora Online convert-to API that bbb-web calls for office documents;
      bbb-web appends the target format (`<URL>/pdf`). The compose default is the
      stack's own `conversion` service (collabora/code); another Collabora Online server
      (`https://<host>:9980/cool/convert-to`) works as well. Empty: office document conversion
      is disabled (PDF and images still work). The bbb-web image itself has no default: on
      Kubernetes or with plain `docker run`, set it explicitly.
    consumers: [bbb-web]
    example: 'https://collabora.example.com:9980/cool/convert-to'
    status: draft
    notes: >-
      docker-compose.yml passes `${BBB_WEB_CONVERSION_URL-<default>}` (no colon), so an empty
      value in .env reaches bbb-web as empty. bbb-web selects convert-remote.sh with
      presOfficeConversionExec when the value is non-empty, and limits each conversion to
      officeToPdfConversionTimeout (60 s) and uploads to maxFileSizeUpload (30000000 bytes).
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:44 @ 35cad46a9f — presOfficeConversionExec
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:63,184 @ 35cad46a9f — maxFileSizeUpload, officeToPdfConversionTimeout
      - bbb-libreoffice/assets/convert-cool.sh:9,49 @ 35cad46a9f — collabora/code, /cool/convert-to/<format>, field data, port 9980
      - bbb-libreoffice/assets/convert-remote.sh:30 @ 35cad46a9f — upstream HTTP sample with a hard-coded endpoint

  - name: BBB_WEB_PAGE_TOKEN_SECRET
    tier: 2
    required: false
    secret: true
    default: null
    pattern: '[A-Za-z0-9]{32,}'
    setup: null
    description: >-
      HMAC key for presentation page tokens (pageTokenSecret). Unset means BBB_SHARED_SECRET,
      as upstream.
    consumers: [bbb-web]
    example: null
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:450-452 @ 35cad46a9f — pageTokenSecret defaults to securitySalt
      - bbb-common-web/src/main/scala/org/bigbluebutton/api2/MsgBuilder.scala:105-106 @ 35cad46a9f — token use

  - name: BBB_WEB_MAX_HEAP_SIZE
    tier: 2
    required: false
    secret: false
    default: 384m
    pattern: '[1-9][0-9]*[kKmMgG]'
    setup: null
    description: Java heap size of bbb-web (initial and maximum), JVM size syntax.
    consumers: [bbb-web]
    example: 1g
    status: draft
    sources:
      - build/packages-template/bbb-web/bbb-web.env:4-5 @ 35cad46a9f — INITIAL_HEAP_SIZE / MAX_HEAP_SIZE

  - name: RECORDING_RAW_RETENTION_DAYS
    tier: 2
    required: false
    secret: false
    default: '14'
    pattern: '[0-9]{1,5}'
    setup: null
    description: >-
      Deletes the raw recording data of recordings published more than N days ago (upstream
