# --------------------------------------------------------------------------------------------
# features: what each BBB_FEATURES entry starts (compose profile) and which settings the images
# derive from it (decision features-mapping below).
# --------------------------------------------------------------------------------------------
features:
  - name: recording
    services: [bbb-webrtc-recorder, recording (rap starter, workers, caption inbox), recording cleanup]
    settings:
      - 'bbb-web: disableRecordingDefault=false with the feature, true without it (record=true in the API is then ignored)'
      - 'nginx: playback and recording locations only with the feature'
    description: >-
      Records meetings and processes them into the presentation format. Off by default until
      the recording services are part of the stack (on bare metal it is part of the default
      install).
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/bigbluebutton.properties:317-319 @ 35cad46a9f — disableRecordingDefault semantics
      - build/packages-template/bbb-playback-presentation/build.sh:24-34 @ 35cad46a9f — presentation.nginx location
      - build/packages-template/bigbluebutton/build.sh:16-33 @ 35cad46a9f — recording is in the default package set

  - name: webhooks
    services: [webhooks]
    settings:
      - 'nginx: location /bigbluebutton/api/hooks only with the feature'
    description: bbb-webhooks, optional as on bare metal.
    status: draft
    sources:
      - build/packages-template/bbb-webhooks/webhooks.nginx:2-3 @ 35cad46a9f — nginx route
      - build/packages-template/bigbluebutton/build.sh:16-33 @ 35cad46a9f — not in the default package set

  - name: greenlight
    services: [greenlight, its database]
    settings: []
    description: >-
      Greenlight front end. No BBB image changes its configuration; greenlight reaches the API
      at server_url with BBB_SHARED_SECRET.
    status: draft
    sources: []

  - name: monitoring
    services: [prometheus exporter]
    settings: []
    description: Metrics exporter. No BBB image changes its configuration.
    status: draft
    sources: []

  - name: external-proxy
    services: [haproxy and certbot are not started]
    settings: []
    description: >-
      For an existing reverse proxy: nginx is published on a local port instead of haproxy on
      443; certbot does not run and ACME_EMAIL is not used. TURN over 443 then needs the existing proxy.
    status: draft
    sources: []

# --------------------------------------------------------------------------------------------
# decided: questions of the draft and how they were decided (2026-10-17).
# --------------------------------------------------------------------------------------------
decided:
  - id: postgres-role-passwords
    date: '2026-10-17'
    choice: b
    decision: >-
      One generated Tier 2 secret per PostgreSQL role; setup generates them, db-init applies
      them; the graphql-server image rewrites the Hasura metadata DSN.
    affects: [POSTGRES_BBB_CORE_PASSWORD, POSTGRES_HASURA_APP_PASSWORD, POSTGRES_BBB_HASURA_PASSWORD, POSTGRES_BLOCKNOTE_PASSWORD]

  - id: recording-retention
    date: '2026-10-17'
    choice: a
    decision: >-
      Upstream semantics (raw data of published recordings) under the name
      RECORDING_RAW_RETENTION_DAYS, default 14; deleting published recordings stays manual.
    affects: [RECORDING_RAW_RETENTION_DAYS]

  - id: features-mapping
    date: '2026-10-17'
    choice: b
    decision: >-
      Images map BBB_FEATURES to settings as listed in features; images read BBB_FEATURES, set
      in .env (Docker Compose keeps profiles and image env consistent).
    affects: [BBB_FEATURES]

  - id: value-patterns
    date: '2026-10-17'
    choice: a
    decision: >-
      Every entrypoint enforces the contract pattern with bbb_require_match; setup and
      preflight use the same patterns.
    affects: [BBB_DOMAIN, BBB_PUBLIC_IPV4, BBB_SHARED_SECRET, TURN_SECRET, ACME_EMAIL, BBB_FEATURES]

  - id: env-vs-override-precedence
    date: '2026-10-17'
    choice: a
    decision: >-
      Upstream behaviour: for node-config services env beats Tier 3 files; documented per
      component (env_precedence of the override).
    affects: [WEBHOOKS_BEARER_AUTH]

# decisions_needed: questions still open. None at present.
decisions_needed: []
