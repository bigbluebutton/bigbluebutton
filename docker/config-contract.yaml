# --------------------------------------------------------------------------------------------
# overrides: Tier 3 files, mounted at the bare-metal path so existing docs apply.
# --------------------------------------------------------------------------------------------
overrides:
  - component: bbb-web
    path: /etc/bigbluebutton/bbb-web.properties
    format: properties
    merge: >-
      Key by key over the image's classpath bigbluebutton.properties (later file wins). The
      image keeps its `${VAR}` references in the classpath file, so this path stays free
      for the admin.
    support: supported
    status: draft
    sources:
      - bigbluebutton-web/grails-app/conf/application.groovy:13-16 @ 35cad46a9f
      - bigbluebutton-web/grails-app/conf/spring/doc-conversion.xml:26-34 @ 35cad46a9f

