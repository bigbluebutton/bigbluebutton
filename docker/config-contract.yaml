    sources:
      - bigbluebutton-config/cron.daily/bigbluebutton:29,94-123 @ 35cad46a9f — published_days
      - docs/docs/administration/customize.md:64 @ 35cad46a9f — documented setting

  - name: RECORDING_WORKERS
    tier: 2
    required: false
    secret: false
    default: '1'
    pattern: '[1-9][0-9]{0,2}'
    setup: null
    description: Number of parallel recording processing workers (resque COUNT).
    consumers: [recording]
    example: '2'
    status: draft
    sources:
      - record-and-playback/core/systemd/bbb-rap-resque-worker.service:11-12 @ 35cad46a9f — COUNT=1 upstream

  - name: WEBHOOKS_BEARER_AUTH
    tier: 2
    required: false
    secret: false
    default: 'true'
    pattern: 'true|false'
    setup: null
    description: >-
      Webhooks send the shared secret as a Bearer token (true) or as a checksum in the URL
      (false). docker-compose.yml writes the value into NODE_CONFIG as the JSON boolean
      bbb.auth2_0 (upstream's image, unchanged); it must be exactly true or false, else
      node-config ignores all of NODE_CONFIG and the service's healthcheck fails.
    consumers: [webhooks]
    example: 'false'
    status: draft
    notes: >-
      bbb-webhooks treats any non-empty BEARER_AUTH, including "false", as enabled (it maps
      the variable as a string and tests its truthiness), so the value goes through NODE_CONFIG
      instead of BEARER_AUTH.
    sources:
      - config/custom-environment-variables.yml:4 @ 9787aea975 — BEARER_AUTH without __format
      - src/out/webhooks/callback-emitter.js:70-71 @ 9787aea975 — truthiness test
      - build/packages-template/bbb-webhooks/after-install.sh:6-19 @ 35cad46a9f — upstream sets auth2_0 true

  - name: LIVEKIT_RTC_UDP_PORT
    tier: 2
    required: false
    secret: false
    default: '7882'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: >-
      LiveKit WebRTC media port (one multiplexed UDP port for all clients), published 1:1. The
      LiveKit image also sets port_range_start/end to 0, otherwise LiveKit ignores it. There is
      no ICE-TCP; clients without UDP use TURN over 443.
    consumers: [livekit, compose]
    example: '7882'
    status: draft
    notes: Upstream uses the range 16384-32768 on the host network instead.
    sources:
      - config-sample.yaml:78-86 @ 8d11efdfcd — rtc.udp_port; port_range_start and end must not be set
      - build/packages-template/bbb-livekit/livekit.yaml:3-13 @ 35cad46a9f — packaged port range

  - name: TURN_RELAY_PORT_MIN
    tier: 2
    required: false
    secret: false
    default: '49160'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: >-
      First port of the coturn relay range (min-port). The range is used on the internal
      network only and is not published.
    consumers: [coturn]
    example: '49160'
    status: draft
    notes: Upstream uses 32769-65535 on the host network.
    sources:
      - bbb-install.sh:1916-1917 @ 2547823185 — min-port/max-port 32769-65535 upstream

  - name: TURN_RELAY_PORT_MAX
    tier: 2
    required: false
    secret: false
    default: '49199'
    pattern: '[1-9][0-9]{0,4}'
    setup: null
    description: Last port of the coturn relay range (max-port); internal only, not published.
    consumers: [coturn]
    example: '49199'
    status: draft
    sources:
      - bbb-install.sh:1916-1917 @ 2547823185 — min-port/max-port 32769-65535 upstream

  - name: BBB_NETWORK_SUBNET
    tier: 2
    required: false
    secret: false
    default: '172.30.82.0/24'
    pattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(1[6-9]|2[0-8])'
    setup: null
    description: >-
      Fixed IPv4 subnet of the internal `bbb` network. Fixed so that LiveKit has a stable address
      coturn may relay to (BBB_LIVEKIT_IP). Change it if it collides with a network on the host.
      nginx trusts PROXY-protocol client addresses only from this subnet (`set_real_ip_from`),
      where bare metal trusts 127.0.0.1.
    consumers: [compose, nginx]
    example: '172.30.82.0/24'
    status: draft
    sources:
      - bbb-install.sh:1937-1941 @ 2547823185 — upstream restricts relay peers to one address
      - bbb-install.sh:1642 @ 2547823185 — set_real_ip_from 127.0.0.1 (haproxy on the same host)

  - name: BBB_LIVEKIT_IP
    tier: 2
    required: false
    secret: false
    default: '172.30.82.20'
    pattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
    setup: null
    description: >-
      Fixed address of LiveKit in BBB_NETWORK_SUBNET; the only peer coturn relays to. Must lie
      inside BBB_NETWORK_SUBNET and outside BBB_NETWORK_IP_RANGE (checked by preflight).
    consumers: [compose, coturn]
    example: '172.30.82.20'
    status: draft
    sources:
      - bbb-install.sh:1937-1941 @ 2547823185 — denied-peer-ip all, allowed-peer-ip one address

  - name: BBB_REDIS_IP
    tier: 2
    required: false
    secret: false
    default: '172.30.82.21'
    pattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])'
    setup: null
    description: >-
      Fixed address of redis in BBB_NETWORK_SUBNET. akka-apps and bbb-web (lettuce/netty) cache the
      resolved redis address for the DNS record's TTL (600 s from Docker's embedded DNS) and have no
      setting to shorten it, so a recreated redis with a new address would break joins for up to
      10 minutes. Must lie inside BBB_NETWORK_SUBNET and outside BBB_NETWORK_IP_RANGE.
    consumers: [compose]
    example: '172.30.82.21'
    status: draft
    notes: >-
      Bare metal reaches redis at 127.0.0.1, Kubernetes Services have stable addresses. A client-side
      DNS TTL bound needs an upstream code change (lettuce ClientResources in RedisClientProvider).
    sources:
      - bbb-common-message/src/main/scala/org/bigbluebutton/common2/redis/RedisClientProvider.scala:20-24 @ 35cad46a9f — RedisClient.create(redisUri) with default ClientResources (netty DNS resolver, record TTL)

  - name: BBB_NETWORK_IP_RANGE
    tier: 2
    required: false
    secret: false
    default: '172.30.82.128/25'
    pattern: '((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/(1[6-9]|2[0-9]|3[0-2])'
    setup: null
    description: >-
      Part of BBB_NETWORK_SUBNET from which Docker assigns dynamic addresses (compose `ip_range`).
      The fixed addresses (BBB_LIVEKIT_IP, BBB_REDIS_IP) lie outside it, so a container started while
      LiveKit or redis restarts cannot take their address. Must lie inside BBB_NETWORK_SUBNET.
    consumers: [compose]
    example: '172.30.82.128/25'
    status: draft
    notes: >-
      Without a range, Docker could give a container that starts while LiveKit or redis is
      restarting their fixed address.
    sources:
      - docker-compose.yml:370 @ 25ae961825 — LiveKit's fixed address without an ip_range (collision risk)

