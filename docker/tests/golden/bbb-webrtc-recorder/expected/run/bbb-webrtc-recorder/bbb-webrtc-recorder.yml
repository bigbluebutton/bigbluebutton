log:
  level: INFO
recorder:
  directory: /var/lib/bbb-webrtc-recorder
  dirFileMode: 0700
  fileMode: 0600
  writeToDevNull: false
  # Write a stats file for each recording
  writeStatsFile: false
  # Write a copy of the recorded video in IVF format. Used for debugging and
  # test environments.
  writeIVFCopy: false
  videoPacketQueueSize: 256
  audioPacketQueueSize: 32
  useCustomSampler: true
pubsub:
  channels:
    subscribe: to-bbb-webrtc-recorder
    publish: from-bbb-webrtc-recorder
  adapter: redis
  adapters:
    redis:
      address: redis:6379
      network: tcp
      #password: foobared
webrtc:
  rtcMinPort: 24577
  rtcMaxPort: 32768
  jitterBuffer: 256
  jitterBufferPktTimeout: 200
  iceServers:
    - urls: []
# Example turn server
#    - urls:
#        - turn:turnserver.example.org:1234
#      username: webrtc
#      credential: turnpassword

# HTTP server for testing
# (should be disabled in production)
http:
  port: 8080
  enable: false
prometheus:
  enable: false
  listenAddress: 127.0.0.1:3200
livekit:
  host: ws://livekit:7880
  apiKey: ""
  apiSecret: ""
  # Write a raw RTP dump (in rtpdump format) for recorded tracks. Used for
  # debugging and test environments.
  writeRTPDump: false
  # Write a read trace (internal/corpus format v1) per recorded track, as
  # <recording>.<trackID>.trace.ndjson.gz: each packet read, read timeout and
  # keyframe request, timed from the session start. Used for debugging and
  # for replay tests. Each captured track holds about 800 KB of gzip state.
  # Skipped when the recording goes to /dev/null. Environment variables:
  # BBBRECORDER_LIVEKIT_TRACECAPTURE_ENABLED, _PAYLOAD, _MAXBYTESPERTRACK.
  traceCapture:
    enabled: false
    # header: VP8 descriptor and frame header, or Opus TOC byte (whole
    # payloads of up to 3 bytes, such as DTX frames), no media.
    # full: whole payloads, so the trace carries the media.
    payload: header
    # Compressed size cap per trace, in bytes; past it, the trace ends with
    # an eof record whose reason is "truncated". 0 means no cap; a negative
    # value means the default. A trace whose writer fell behind and dropped
    # records ends with the reason "dropped" instead.
    maxBytesPerTrack: 16777216
  healthCheck:
    enable: false
    interval: 1m
    abortBootOnFailure: false
constraints:
  # Caps the video quality of LiveKit captures while the recordings
  # filesystem is low on free space.
  diskPressure:
    enable: false
    # Filesystem to watch; empty means recorder.directory
    path: ""
    checkInterval: 15s
    # Engage when free space is below EITHER level; 0 disables a criterion.
    # Levels are whole numbers: MiB, and percents of the filesystem size.
    engageFreeMiB: 20480
    engageFreePercent: 10
    # Release when free space is at or above EVERY enabled release level
    releaseFreeMiB: 25600
    releaseFreePercent: 15
    # LOW | MEDIUM | HIGH
    videoQuality: LOW
    # LiveKit track sources to cap: camera, screen_share
    sources: [camera]
