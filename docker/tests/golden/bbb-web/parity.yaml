# Parity of the rendered bbb-web configuration with the bare-metal reference (docker/tests/parity/).
#
# Bare metal edits the classpath bigbluebutton.properties in place (after-install.sh: serverURL
# with the IP, generated securitySalt) and bbb-conf --setip / bbb-install write
# /etc/bigbluebutton/bbb-web.properties (serverURL with the host name, securitySalt). The
# container renders only the classpath file and leaves /etc/bigbluebutton/bbb-web.properties
# to the admin (contract overrides), so that reference file has no rendered counterpart.
# The TURN XML is rendered from bbb-install's text and matches the reference byte for byte.
reference: ../../parity/reference/bbb-web
files:
  - rendered: usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
    reference: usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
  - rendered: usr/share/bbb-web/WEB-INF/classes/spring/turn-stun-servers.xml
    reference: usr/share/bbb-web/WEB-INF/classes/spring/turn-stun-servers.xml
allowed:
  - file: usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
    line: '^bigbluebutton\.web\.serverURL=https://(203\.0\.113\.10|bbb\.example\.com)$'
    reason: "contract derived server_url: https://BBB_DOMAIN in the classpath file, the value bare metal writes into /etc/bigbluebutton/bbb-web.properties (bbb-conf --setip); the classpath file has the IP from after-install.sh"
  - file: usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
    line: '^securitySalt=(fixturebbbsharedsecretnotreal0+|\$\{BBB_SHARED_SECRET\})$'
    reason: "contract BBB_SHARED_SECRET notes: the classpath file references the secret, bbb-web resolves it from the environment; no secret value in the image's files"
  - file: usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
    line: '^redisHost=(127\.0\.0\.1|redis)$'
    reason: "service names of docker-compose.yml: redis is its own service on the bbb network, not on localhost"
  - file: usr/share/bbb-web/WEB-INF/classes/bigbluebutton.properties
    line: '^fetchUrlAllowedLocalHosts=(bbb\.example\.com)?$'
    reason: "docker-compose.yml haproxy network alias: inside the stack BBB_DOMAIN resolves to the TLS edge's private address, which bbb-web's URL fetch checks reject unless the host is listed; bare metal resolves it to the server's public address"
