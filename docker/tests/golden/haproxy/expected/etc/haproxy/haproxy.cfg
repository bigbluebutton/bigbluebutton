# haproxy for the BigBlueButton containers: the TLS edge on 443. Same frontend as
# bbb-install's install_haproxy; the differences and their reasons are listed in
# docker/tests/golden/haproxy/parity.yaml.
global
	log stdout format raw local0
	stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
	stats timeout 30s

	# Default SSL material locations
	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private

	# Default ciphers to use on SSL-enabled listening sockets.
	# For more information, see ciphers(1SSL). This list is from:
	#  https://hynek.me/articles/hardening-your-web-servers-ssl-ciphers/
	# An alternative list with additional directives can be obtained from
	#  https://mozilla.github.io/server-side-tls/ssl-config-generator/?server=haproxy
	ssl-default-bind-ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
	ssl-default-bind-options ssl-min-ver TLSv1.2
	tune.ssl.default-dh-param 2048

# nginx and coturn are resolved at runtime with the container's resolver (Docker's DNS, or the
# cluster DNS on Kubernetes): haproxy starts before them and follows their new addresses when
# they are recreated.
resolvers dns
	parse-resolv-conf
	hold valid 10s

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http
	default-server init-addr last,libc,none resolvers dns


frontend nginx_or_turn
  # HTTP/2 is not offered: nginx has no HTTP/2 listener behind haproxy.
  bind *:443,:::443 ssl crt /etc/haproxy/certbundle.pem ssl-min-ver TLSv1.2 alpn http/1.1,stun.turn
  mode tcp
  option tcplog
  tcp-request content capture req.payload(0,1) len 1
  log-format "%ci:%cp [%t] %ft %b/%s %Tw/%Tc/%Tt %B %ts %ac/%fc/%bc/%sc/%rc %sq/%bq captured_user:%{+X}[capture.req.hdr(0)]"
  tcp-request inspect-delay 30s
  # We terminate SSL on haproxy. haproxy has to decide which protocol is spoken.
  # This is negotiated by ALPN: http/1.1 goes to nginx, stun.turn to coturn.
  #
  # If no ALPN value is set, the first byte is inspected: an ASCII letter (an HTTP
  # request) goes to nginx, anything else to coturn. Browsers send TURN over TLS
  # without ALPN, so this rule carries it.
  use_backend nginx if { ssl_fc_alpn http/1.1 }
  use_backend turn if { ssl_fc_alpn stun.turn }
  use_backend %[capture.req.hdr(0),map_str(/etc/haproxy/protocolmap,turn)]
  default_backend turn

backend turn
  mode tcp
  server coturn coturn:3478

backend nginx
  mode tcp
  server nginx nginx:81 send-proxy check

backend nginx-http2
  disabled
  mode tcp
  server localhost 127.0.0.1:82 send-proxy check
