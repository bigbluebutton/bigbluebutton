listening-port=3478

min-port=49160
max-port=49199
verbose

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=fixtureturnsecretnotreal000000000000000000000000
realm=bbb.example.com

keep-address-family

no-cli
no-tlsv1
no-tlsv1_1

# Block connections to IP ranges which shouldn't be reachable
no-loopback-peers
no-multicast-peers
no-tcp-relay


# Relay only to LiveKit's fixed address on the bbb network.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=172.30.82.20

