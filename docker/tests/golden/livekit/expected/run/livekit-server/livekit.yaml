port: 7880
log_level: info
rtc:
  port_range_start: 0
  port_range_end: 0
  use_external_ip: false
  tcp_port: 0
  allow_tcp_fallback: false
  interfaces:
    excludes:
      - docker0
  udp_port: 7882
  advertise_internal_ip: true
redis:
  address: redis:6379
webhook:
  urls:
    - http://bbb-webrtc-sfu:3040/livekit-webhook
  api_key: fixturelivekitapikey
audio:
  active_level: 50
  min_percentile: 10
  update_interval: 500
  smooth_intervals: 0
room:
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp8
    - mime: video/rtx
  enable_remote_unmute: true
