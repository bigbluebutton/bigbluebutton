# Server of the playback image: serves the presentation player on port 8080 with upstream's
# location (playback.nginx, which the bare-metal site includes from
# /usr/share/bigbluebutton/nginx/). The edge nginx (docker/nginx) proxies
# /playback/presentation/2.3 here unchanged.

# Temporary files below /tmp: the only writable path for an arbitrary UID.
client_body_temp_path /tmp/nginx-client_temp;
proxy_temp_path /tmp/nginx-proxy_temp;
fastcgi_temp_path /tmp/nginx-fastcgi_temp;
uwsgi_temp_path /tmp/nginx-uwsgi_temp;
scgi_temp_path /tmp/nginx-scgi_temp;

server {
  listen 8080 default_server;
  server_name _;

  # Behind the edge nginx: redirects stay relative, so they do not name this container's host
  # and port.
  absolute_redirect off;

  include /usr/share/bigbluebutton/nginx/playback.nginx;
}
