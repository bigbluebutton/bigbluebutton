# ./bbb-dev enable dashboard: the learning dashboard from the webpack dev server, live from
# bbb-learning-dashboard/ (npm start, on the image's port 8080). nginx passes the dev server's
# websocket for hot reload, as learning-dashboard-dev.nginx does on a package install.
services:
  learning-dashboard:
    image: node:24.22.3@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    working_dir: /app
    # npm ci into the volume on the first start, or when package-lock.json changed
    command:
      - sh
      - -ec
      - npm ls --depth=0 >/dev/null 2>&1 || npm ci; exec npx webpack serve --mode development --port 8080
    volumes:
      - ./bbb-learning-dashboard:/app:ro
      - dashboard-node-modules:/app/node_modules
  nginx:
    configs:
      - source: learning-dashboard-dev.nginx
        target: /usr/share/bigbluebutton/nginx/learning-dashboard.nginx

volumes:
  dashboard-node-modules:

configs:
  # docker/nginx/learning-dashboard.nginx with the websocket
  learning-dashboard-dev.nginx:
    content: |
      location ~ ^/learning-analytics-dashboard/([^/]+)/([^/]+)/learning_dashboard_data\.json$$ {
        alias /var/bigbluebutton/learning-dashboard/$$1/$$2/learning_dashboard_data.json;
      }
      location /learning-analytics-dashboard/ws {
        proxy_pass http://bbb-learning-dashboard/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $$http_upgrade;
        proxy_set_header Connection "Upgrade";
      }
      location /learning-analytics-dashboard/ {
        proxy_pass http://bbb-learning-dashboard;
      }
