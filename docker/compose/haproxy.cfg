# The TLS edge bbb-install sets up: TLS on 443, then HTTP to nginx and TURN to coturn.
global
	log stdout format raw local0
	ssl-default-bind-ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:RSA+AESGCM:RSA+AES:!aNULL:!MD5:!DSS
	ssl-default-bind-options ssl-min-ver TLSv1.2
	tune.ssl.default-dh-param 2048

# Docker's DNS: nginx and coturn may start later or get a new address
resolvers docker
	nameserver dns 127.0.0.11:53

defaults
	log	global
	mode	tcp
	option	tcplog
	timeout connect 5000
	timeout client  50000
	timeout server  50000
	# start even if nginx or coturn cannot be resolved yet
	default-server init-addr libc,none resolvers docker

frontend nginx_or_turn
	bind :8443 ssl crt /etc/letsencrypt/certbundle.pem alpn http/1.1,stun.turn
	tcp-request inspect-delay 30s
	tcp-request content accept if { req.len gt 0 }
	# ALPN http/1.1, or no ALPN and a request that starts with a letter, is HTTP; the rest is TURN
	use_backend nginx if { ssl_fc_alpn http/1.1 } || { req.payload(0,1) -m reg ^[A-Za-z] }
	default_backend turn

backend turn
	server coturn coturn:3478

backend nginx
	server nginx nginx:8081 send-proxy
