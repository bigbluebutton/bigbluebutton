listening-port=3478

min-port=${TURN_RELAY_PORT_MIN}
max-port=${TURN_RELAY_PORT_MAX}
verbose

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=${TURN_SECRET}
realm=${BBB_DOMAIN}

keep-address-family

no-cli
no-tlsv1
no-tlsv1_1

# Block connections to IP ranges which shouldn't be reachable
no-loopback-peers
no-multicast-peers
no-tcp-relay


# Relay only to LiveKit's fixed address on the bbb network.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
allowed-peer-ip=${BBB_LIVEKIT_IP}

