# certbot configuration for the BigBlueButton certificate (TLS edge: haproxy). The options are those
# bbb-install passes to certbot (--webroot, --non-interactive, --email, --agree-tos,
# --rsa-key-size 4096, -w, -d); the rest keeps certbot's state in /etc/letsencrypt (the
# letsencrypt volume) and its scratch files in /tmp.
email = ${ACME_EMAIL}
agree-tos = true
non-interactive = true
rsa-key-size = 4096
authenticator = webroot
webroot-path = /var/www/bigbluebutton-default/assets
domains = ${BBB_DOMAIN}
cert-name = ${BBB_DOMAIN}
keep-until-expiring = true
deploy-hook = /usr/local/bin/bbb-certbot-deploy-hook
config-dir = /etc/letsencrypt
work-dir = /tmp/certbot/work
logs-dir = /tmp/certbot/logs
max-log-backups = 10
