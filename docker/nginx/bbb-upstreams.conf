# The services nginx proxies to, by their compose service names and upstream's ports. On bare
# metal they all listen on 127.0.0.1; here each is a container whose address changes when it is
# restarted or recreated. `resolve` (open-source nginx since 1.27.3) makes nginx look the names
# up again while it runs, so it follows a new address without a restart, and it starts even if
# a service is not up yet (its locations answer 502 until it is). The groups must be in shared
# memory (`zone`) for that.
#
# 127.0.0.11 is Docker's embedded DNS server on user-defined networks. Its answers carry a TTL of
# 600 s; `valid` re-resolves sooner. The `bbb` network is IPv4 only.
#
# The groups of optional features (webhooks) are not here: the entrypoint adds them with their
# locations, only when the feature is enabled, in /etc/nginx/sites-enabled/bbb-feature-upstreams.
#
# On Kubernetes, mount a file at this path that names the cluster DNS server and the Services by
# their fully qualified names (nginx's resolver does not use the DNS search domains).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream bbb-web {
    zone bbb-web 64k;
    server bbb-web:8090 resolve;
}

upstream shared-notes {
    zone shared-notes 64k;
    server shared-notes:8787 resolve;
}

upstream graphql-middleware {
    zone graphql-middleware 64k;
    server graphql-middleware:8378 resolve;
}

upstream graphql-server {
    zone graphql-server 64k;
    server graphql-server:8085 resolve;
}

upstream livekit {
    zone livekit 64k;
    server livekit:7880 resolve;
}

upstream bbb-webrtc-sfu {
    zone bbb-webrtc-sfu 64k;
    server bbb-webrtc-sfu:3008 resolve;
}

upstream html5 {
    zone html5 64k;
    server html5:8080 resolve;
}

upstream learning-dashboard {
    zone learning-dashboard 64k;
    server learning-dashboard:8080 resolve;
}
