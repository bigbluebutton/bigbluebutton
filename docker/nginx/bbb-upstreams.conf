# The backends and the static-app images by their default service names; deployments mount their
# own file here. "resolve" looks the names up again through the container's DNS server (every 30 s,
# bbb-resolver.conf), so a service recreated with a new address is found without reloading nginx.
# livekit has a fixed address in the compose network.
upstream bbb-web {
    zone bbb-web 64k;
    server web:8090 resolve;
}
upstream bbb-graphql-middleware {
    zone bbb-graphql-middleware 64k;
    server graphql-middleware:8378 resolve;
}
upstream bbb-livekit {
    server livekit:7880;
}
upstream bbb-webrtc-sfu {
    zone bbb-webrtc-sfu 64k;
    server webrtc-sfu:3008 resolve;
}
upstream bbb-shared-notes-server {
    zone bbb-shared-notes-server 64k;
    server shared-notes-server:8787 resolve;
}
upstream bbb-html5-client {
    zone bbb-html5-client 64k;
    server html5-client:8080 resolve;
}
upstream bbb-learning-dashboard {
    zone bbb-learning-dashboard 64k;
    server learning-dashboard:8080 resolve;
}
