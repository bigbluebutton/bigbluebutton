# The backends by their default service names; deployments mount their own file here.
upstream bbb-web {
    server web:8090;
}
upstream bbb-graphql-middleware {
    server graphql-middleware:8378;
}
upstream bbb-livekit {
    server livekit:7880;
}
upstream bbb-webrtc-sfu {
    server webrtc-sfu:3008;
}
upstream bbb-shared-notes-server {
    server shared-notes-server:8787;
}
