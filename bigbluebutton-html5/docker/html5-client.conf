# Server of the html5 client image: serves the client on port 8080 with upstream's locations
# (bbb-html5.nginx, which includes bbb-html5.nginx.static, as the bare-metal site does through
# /etc/bigbluebutton/nginx/). The edge nginx (docker/nginx) proxies /html5client here unchanged.

# Temporary files below /tmp: the only writable path for an arbitrary UID.
client_body_temp_path /tmp/nginx-client_temp;
proxy_temp_path /tmp/nginx-proxy_temp;
fastcgi_temp_path /tmp/nginx-fastcgi_temp;
uwsgi_temp_path /tmp/nginx-uwsgi_temp;
scgi_temp_path /tmp/nginx-scgi_temp;

server {
  listen 8080 default_server;
  server_name _;

  # Behind the edge nginx: redirects (/html5client -> /html5client/) stay relative, so they
  # do not name this container's host and port.
  absolute_redirect off;

  # The edge proxies with HTTP/1.0 (nginx's proxy_http_version default); gzip_static serves the
  # precompressed .gz files only to requests of at least gzip_http_version (default 1.1).
  gzip_http_version 1.0;

  include /usr/share/bigbluebutton/nginx/bbb-html5.nginx;
}
