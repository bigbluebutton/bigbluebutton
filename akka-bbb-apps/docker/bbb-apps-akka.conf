// Default /etc/bigbluebutton/bbb-apps-akka.conf of the image; a mounted file replaces it.
// Same format as on bare metal: upstream's defaults, then overrides (here: from the environment).
include "/usr/share/bbb-apps-akka/conf/application.conf"

services.sharedSecret = ${?SHARED_SECRET}
services.bbbWebAPI = ${?BBB_WEB_API}
services.graphqlMiddlewareAPI = ${?GRAPHQL_MIDDLEWARE_API}
redis.host = ${?REDIS_HOST}
postgres.properties.serverName = ${?POSTGRES_HOST}
postgres.properties.password = ${?POSTGRES_PASSWORD}
