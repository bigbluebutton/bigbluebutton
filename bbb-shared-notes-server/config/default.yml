expressServer:
  host: 127.0.0.1 # or SERVER_HOST from the environment
  port: 8787
  maxContentLength: 1500
  maxConnectionsPerSessionToken: 3

hocuspocusServer:
  host: 127.0.0.1
  port: 9001

commandExecution:
  workDir: /tmp/shared-notes-dropbox/
  # Socket of bbb-shared-notes-conversion.socket, which converts HTML to PDF
  conversionSocket: /run/bbb-shared-notes-conversion.sock
  # Seconds. The conversion service has its own limit (RuntimeMaxSec=30): raise both,
  # the other with `systemctl edit bbb-shared-notes-conversion@.service`
  timeout: 30

bbbWeb:
  # host and port: or BBB_WEB_URL from the environment, bbb-web's base URL (http://web:8090)
  host: 127.0.0.1
  port: 8090
  presentationEndpoint: /bigbluebutton/presentation
  checkAuthorizationEndpoint: /bigbluebutton/connection/checkGraphqlAuthorization

log:
  level: info

redis:
  host: 127.0.0.1 # or REDIS_HOST from the environment
  port: 6379 # or REDIS_PORT from the environment
  password: null # or REDIS_PASSWORD from the environment
  channels:
    publish:
      - to-akka-apps-redis-channel
    subscribe:
      - from-akka-apps-redis-channel

rateLimit:
  maxRequestsPerWindow: 60
  windowInSeconds: 60

postgres:
  host: 127.0.0.1 # or POSTGRES_HOST from the environment
  port: 5432
  database: blocknote_app
  user: blocknote_app
  password: blocknote_app # NOSONAR; or POSTGRES_PASSWORD from the environment
  documentExpireMinutesAfterMeetingEnd: 60
