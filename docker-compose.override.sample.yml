# Sample docker-compose.override.yml for development. Copy it to docker-compose.override.yml,
# which compose reads next to docker-compose.yml, and uncomment "services:" and what you need.
#
# To run your own build of a component, build its image with bake, e.g. for bbb-web:
#   BBB_IMAGE_REGISTRY=localhost BBB_IMAGE_TAG=dev docker buildx bake -f docker-bake.hcl --load --set '*.platform=linux/amd64' web
# set its image in .env (BBB_WEB_IMAGE=localhost/bbb-web:dev; all names: "Run another version of
# one component" in the docs), uncomment its service below, then run `docker compose up -d web`.
# The bake target is the image name without "bbb-". The image in .env is enough to run it;
# pull_policy: never below lets `docker compose pull` skip the local image.
#
# For the HTML5 client, docker/compose/dev/html5.yml runs the webpack dev server instead of an
# image (see "Develop with Docker Compose" in the development guide). With COMPOSE_FILE set in
# .env, compose reads this file only when COMPOSE_FILE lists it.

