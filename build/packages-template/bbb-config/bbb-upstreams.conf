# Addresses of the BigBlueButton services that the locations in
# /usr/share/bigbluebutton/nginx/ proxy to.
upstream bbb-web {
    server 127.0.0.1:8090;
}
upstream bbb-graphql-middleware {
    server 127.0.0.1:8378;
}
upstream bbb-livekit {
    server 127.0.0.1:7880;
}
upstream bbb-webrtc-sfu {
    server 127.0.0.1:3008;
}
upstream bbb-shared-notes-server {
    server localhost:8787;
}
upstream bbb-webhooks {
    server 127.0.0.1:3005;
}
upstream bbb-file-upload {
    server 127.0.0.1:8094;
}
