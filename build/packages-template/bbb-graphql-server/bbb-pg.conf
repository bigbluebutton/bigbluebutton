# support up to 300 connections (because Hasura might use 100)
max_connections = 300

# BBB tables are UNLOGGED and small enough to stay in shared buffers / page cache, so a
# random read costs about the same as a sequential one. With the default (4, tuned for
# spinning disks) the generic plans used by Hasura prefer sequential scans over existing
# indexes, e.g. pres_annotation_history_curr_stream scans the whole annotation history
# once per subscriber on every poll instead of using (pageId, updatedAt).
random_page_cost = 1.1
