name: "Presentation conversion - weekly"
# Scheduled workflows only run from the repository's default branch (v4.0.x-develop today). This
# dispatcher starts "Automated tests" with jobs=presentation-conversion on each active line, which
# builds that line's packages, installs them and runs that line's presentation-conversion suite
# against that line's goldens. A line without the suite is skipped with a notice. The dispatcher
# waits for each run it started and fails when that run does not succeed.
on:
  schedule:
    - cron: "0 3 * * 0"   # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      refs:
        description: "Branches to test, comma-separated"
        default: "v4.0.x-develop,v4.1.x-develop"
permissions:
  actions: write
  contents: read
concurrency:
  group: presentation-conversion-weekly
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name != 'schedule' || github.repository == 'bigbluebutton/bigbluebutton'
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-24.04' }}
    outputs:
      refs: ${{ steps.refs.outputs.json }}
    steps:
      - id: refs
        env:
          REFS: ${{ inputs.refs || 'v4.0.x-develop,v4.1.x-develop' }}
        run: echo "json=$(jq -cn --arg s "$REFS" '$s | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')" >> "$GITHUB_OUTPUT"
  dispatch:
    needs: plan
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - name: Run "Automated tests" on ${{ matrix.ref }}
        uses: actions/github-script@v8
        env:
          REF: ${{ matrix.ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = process.env.REF;
            const skip = async (why) => {
              core.notice(`${ref}: skipped, ${why}`);
              await core.summary.addRaw(`- ${ref}: skipped (${why})\n`).write();
            };
            try {
              await github.rest.repos.getContent({ owner, repo, ref, path: 'bigbluebutton-tests/presentation-conversion/package.json' });
            } catch (e) {
              if (e.status === 404) return skip('the suite is not on this branch yet');
              throw e;
            }
            let started;
            try {
              started = await github.rest.actions.createWorkflowDispatch({ owner, repo, ref, workflow_id: 'automated-tests.yml', inputs: { jobs: 'presentation-conversion' }, return_run_details: true });
            } catch (e) {
              if (e.status === 422) return skip(`automated-tests.yml on this branch does not accept the dispatch: ${e.message}`);
              throw e;
            }
            const run = started.data || {};
            if (!run.workflow_run_id) {
              await core.summary.addRaw(`- ${ref}: dispatched, result unknown\n`).write();
              return core.setFailed(`${ref}: the dispatch did not return its run, so its result is unknown`);
            }
            core.info(`${ref}: started ${run.html_url}`);
            const deadline = Date.now() + 5 * 60 * 60 * 1000;
            let result = 'still running after 5 hours';
            while (Date.now() < deadline) {
              await new Promise((r) => setTimeout(r, 60000));
              let data;
              try {
                ({ data } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.workflow_run_id }));
              } catch (e) {
                if (!(e.status >= 500)) throw e;
                core.warning(`${ref}: could not read run ${run.workflow_run_id} (${e.status}), trying again`);
                continue;
              }
              if (data.status === 'completed') { result = data.conclusion; break; }
            }
            await core.summary.addRaw(`- ${ref}: [run ${run.workflow_run_id}](${run.html_url}) ${result}\n`).write();
            if (result !== 'success') core.setFailed(`${ref}: run ${run.workflow_run_id} ${result}, see ${run.html_url}`);
