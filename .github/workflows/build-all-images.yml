name: Build docker images

# Pull requests: build every image for amd64, without pushing.
# Release branches and tags: build amd64 and arm64 on native runners and push to GHCR (forks only build).
on:
  pull_request:
    branches: ["v[4-9].*.x-develop", "v[4-9].*.x-release"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "bigbluebutton-html5/public/locales/*.json"
  push:
    branches: ["v[4-9].*.x-develop", "v[4-9].*.x-release"]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BBB_IMAGE_REGISTRY: ghcr.io/bigbluebutton/bigbluebutton
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
  PUSH: ${{ github.event_name != 'pull_request' && github.repository == 'bigbluebutton/bigbluebutton' }}

jobs:
  targets:
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-24.04' }}
    outputs:
      targets: ${{ steps.list.outputs.targets }}
      client-build: ${{ steps.version.outputs.client-build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # -f: without it bake also reads docker-compose.yml, whose required variables are not set here
      - name: List the images of the default bake group
        id: list
        run: |
          targets=$(docker buildx bake -f docker-bake.hcl --print default | jq -c .group.default.targets)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      # The HTML5 client build id as build/setup.sh sets it: the commit date in UTC.
      # The image version adds it and the commit to the tag, e.g. v4.1.x-develop-20261026T105204-2a1b3c4
      - name: Set the HTML5 client build id and the image version
        id: version
        run: |
          CLIENT_BUILD=$(TZ=UTC0 git log -n1 --pretty=format:%cd --date=format-local:%Y%m%dT%H%M%S)
          echo "client-build=$CLIENT_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$TAG-$CLIENT_BUILD-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    name: ${{ matrix.target }} (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || vars.CI_HEAVY_RUNNER || 'ubuntu-24.04' }}
    env:
      CLIENT_BUILD: ${{ needs.targets.outputs.client-build }}
      VERSION: ${{ needs.targets.outputs.version }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform is pushed under <commit>-<platform>; the merge job joins the images of this commit
      # only under $TAG, $TAG-<commit> and $VERSION, so a re-run can never mix commits.
      # The cache is written only by pushes, pull requests read it; mode=min keeps 15 x 2 scopes in the 10 GB limit.
      - uses: docker/bake-action@v7
        env:
          BBB_IMAGE_TAG: ${{ github.sha }}-${{ matrix.platform }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          set: |
            *.platform=linux/${{ matrix.platform }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.labels.org.opencontainers.image.version=${{ env.VERSION }}
            *.labels.org.opencontainers.image.title=bbb-${{ matrix.target }}
            *.labels.org.opencontainers.image.url=https://github.com/bigbluebutton/bigbluebutton
            *.cache-from=type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
            ${{ env.PUSH == 'true' && format('*.cache-to=type=gha,mode=min,scope={0}-{1}', matrix.target, matrix.platform) || '' }}

  merge:
    needs: [targets, build]
    if: github.event_name != 'pull_request' && github.repository == 'bigbluebutton/bigbluebutton'
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-24.04' }}
    env:
      VERSION: ${{ needs.targets.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag vX.Y.Z is also pushed as vX.Y, but only if it is the newest vX.Y.Z, so a re-run
      # of an older release does not move vX.Y back. Pre-releases (vX.Y.Z-rc.1) are not.
      - name: Check whether the tag is the newest release of its minor version
        id: minor
        if: github.ref_type == 'tag'
        run: |
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            newest=$(git ls-remote --tags --refs origin "${TAG%.*}.*" | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            if [ "$newest" = "$TAG" ]; then echo "minor=${TAG%.*}" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Join the amd64 and arm64 images under the branch tag, the commit, the version and the minor version
        env:
          TARGETS: ${{ join(fromJSON(needs.targets.outputs.targets), ' ') }}
          MINOR: ${{ steps.minor.outputs.minor }}
        run: |
          for t in $TARGETS; do
            image="$BBB_IMAGE_REGISTRY/bbb-$t:$TAG"
            sources=()
            for p in $(docker buildx bake -f docker-bake.hcl --print "$t" | jq -r ".target[\"$t\"].platforms[] | ltrimstr(\"linux/\")"); do
              sources+=("$BBB_IMAGE_REGISTRY/bbb-$t:$GITHUB_SHA-$p")
            done
            tags=(-t "$image" -t "$image-${GITHUB_SHA::7}" -t "$BBB_IMAGE_REGISTRY/bbb-$t:$VERSION")
            if [ -n "$MINOR" ]; then tags+=(-t "$BBB_IMAGE_REGISTRY/bbb-$t:$MINOR"); fi
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done
