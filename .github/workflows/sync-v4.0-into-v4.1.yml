name: "Sync v4.0 into v4.1"
# Ports every pull request merged into v4.0.x-develop to v4.1.x-develop: one sync pull request per
# merged pull request, cherry-picked onto a sync/v4.1/pr-<N> branch. The job ends once the pull
# request is open; the pull request starts its own checks, and a maintainer merges it once they
# pass. The optional "Sync v4.0 into v4.1: merge green ports" workflow, off by default, can merge the
# green ones instead (repository variable SYNC_V41_AUTO_MERGE=true). A port with conflicts opens as a
# draft with the "sync: needs maintainer" label. Pull requests with the "no-sync-4.1" label, and the
# merges of whole lines or releases, are not ported.
#
# pull_request_target takes the workflow file and github.sha from the default branch, which is
# v4.0.x-develop here: this file has to stay on the default branch to run. The logic is in
# .github/scripts/sync-pr-to-v4.1.sh, run from that same commit (the script does not exist on
# v4.1.x-develop). Nothing from the merged pull request is checked out or run: its title, branch and
# labels reach the script only through env.
#
# Configuration:
# - SYNC_TOKEN secret: a personal access token (PAT). It pushes the sync branches (including changes
#   under .github/workflows/) and opens the pull requests, which then start their own checks.
#   Fine-grained, on this repository: Contents, Pull requests and Workflows read and write; Actions
#   and Commit statuses read (used only by the optional merge workflow); Metadata read comes with
#   it. Classic: the repo and workflow scopes (public_repo instead of repo on a public repository).
#   Check runs are not in GitHub's list of fine-grained PAT permissions; on a public repository
#   they, the workflow runs and the commit statuses can be read with any token. A GitHub App
#   installation token expires after an hour, so it cannot be stored as this secret; using an App
#   would mean generating the token in each job (actions/create-github-app-token), which these
#   workflows do not do.
# - Public repositories: from 2026-12-02 GitHub blocks pull_request_target unless an Actions event
#   policy allows it (as for check-merge-conflict.yml, playwright-reports-cleanup.yml, welcome.yml).
# - It runs in bigbluebutton/bigbluebutton, and in a fork only with the repository variable
#   SYNC_V41_ENABLED=true.
# - The sync branches are deleted only by the optional merge workflow. With a manual merge they stay,
#   unless the repository setting "Automatically delete head branches" is on.
on:
  pull_request_target:
    types: [closed]
    branches: [v4.0.x-develop]
permissions: {}
jobs:
  sync:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'v4.0.x-develop' &&
      (github.repository == 'bigbluebutton/bigbluebutton' || vars.SYNC_V41_ENABLED == 'true')
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: sync-v4.1-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Require the SYNC_TOKEN secret
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::The SYNC_TOKEN secret is not set; see the Configuration notes in this workflow."
            exit 1
          fi
      - name: Check out the sync script from the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: sync-tool
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check out v4.1.x-develop
        uses: actions/checkout@v5
        with:
          ref: v4.1.x-develop
          path: work
          fetch-depth: 1
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Port the pull request to v4.1.x-develop
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_AUTHOR: ${{ github.event.pull_request.user.login }}
          SOURCE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          WORK_DIR: ${{ github.workspace }}/work
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash sync-tool/.github/scripts/sync-pr-to-v4.1.sh
