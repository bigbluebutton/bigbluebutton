name: "Sync v4.0 into v4.1"
# Ports every pull request merged into v4.0.x-develop to v4.1.x-develop: one sync pull request per
# merged pull request, cherry-picked onto a sync/v4.1/pr-<N> branch. The sync pull request is merged
# automatically when the automated tests pass on it and it is mergeable; otherwise it stays open for
# a maintainer, with the reason in a comment and the "sync: needs maintainer" label. Pull requests
# with the "no-sync-4.1" label, and the merges of whole lines or releases, are not ported.
#
# pull_request_target takes the workflow file and github.sha from the default branch, which is
# v4.0.x-develop here: this file has to stay on the default branch to run. The logic is in
# .github/scripts/sync-pr-to-v4.1.sh, run from that same commit (the script does not exist on
# v4.1.x-develop). Nothing from the merged pull request is checked out or run: its title, branch and
# labels reach the script only through env.
#
# It runs in bigbluebutton/bigbluebutton, and in a fork only with the repository variable
# SYNC_V41_ENABLED=true. Without a SYNC_TOKEN secret it uses the GITHUB_TOKEN, which needs the
# repository setting "Allow GitHub Actions to create and approve pull requests" (Settings > Actions
# > General) to open the sync pull requests. With the GITHUB_TOKEN, a change to .github/workflows/
# cannot be pushed and the pull requests it opens start no workflow, so the script starts the
# automated tests itself; a SYNC_TOKEN secret (GitHub App or PAT with the workflows permission)
# lifts the first limit and does not depend on that setting.
on:
  pull_request_target:
    types: [closed]
    branches: [v4.0.x-develop]
permissions: {}
jobs:
  sync:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'v4.0.x-develop' &&
      (github.repository == 'bigbluebutton/bigbluebutton' || vars.SYNC_V41_ENABLED == 'true')
    # It mostly waits for the automated tests, so it stays off the CI_LIGHT_RUNNER pool that those
    # tests need, as the nightly schedule does.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    concurrency:
      group: sync-v4.1-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check out the sync script from the default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: sync-tool
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check out v4.1.x-develop
        uses: actions/checkout@v5
        with:
          ref: v4.1.x-develop
          path: work
          fetch-depth: 1
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Port the pull request to v4.1.x-develop
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          TOKEN_KIND: ${{ secrets.SYNC_TOKEN != '' && 'sync' || 'github' }}
          REPO: ${{ github.repository }}
          SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_PR_TITLE: ${{ github.event.pull_request.title }}
          SOURCE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SOURCE_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_AUTHOR: ${{ github.event.pull_request.user.login }}
          SOURCE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          WORK_DIR: ${{ github.workspace }}/work
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash sync-tool/.github/scripts/sync-pr-to-v4.1.sh
