name: html5 - unit tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "bigbluebutton-html5/**"
permissions:
  contents: read
jobs:
  html5-unit-tests:
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Checkout PR's source merged into its target branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.number }}/merge
      - name: Checkout commit/branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bigbluebutton-html5/package-lock.json
      - name: run npm ci
        working-directory: bigbluebutton-html5
        run: npm ci
      - name: run unit tests
        working-directory: bigbluebutton-html5
        run: npm run test:unit
