name: "Sync v4.0 into v4.1: merge green ports"
# Merges the sync pull requests opened by "Sync v4.0 into v4.1" once they are green: a passed
# Automated tests run on the head commit, every other check and commit status green, and mergeable.
# Nothing waits for the tests: this runs when Automated tests or Build docker images finish on a sync
# branch, and every 30 minutes (a chosen default) to catch anything those events missed. The logic is
# in .github/scripts/sync-merge-green-port.sh; it only uses the GitHub API and never checks out the
# code of a pull request.
#
# The merges are made with the SYNC_TOKEN secret, so they start the push workflows of
# v4.1.x-develop (packages and images) like a merge made by a person. Schedule and workflow_run take
# this file from the default branch (v4.0.x-develop here). It runs in bigbluebutton/bigbluebutton,
# and in a fork only with the repository variable SYNC_V41_ENABLED=true.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_run:
    workflows: ["Automated tests", "Build docker images"]
    types: [completed]
    branches: ["sync/v4.1/**"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: sync-v4.1-merge-green-ports
  cancel-in-progress: false
jobs:
  merge:
    if: github.repository == 'bigbluebutton/bigbluebutton' || vars.SYNC_V41_ENABLED == 'true'
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require the SYNC_TOKEN secret
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::The SYNC_TOKEN secret is not set; see the Configuration notes in sync-v4.0-into-v4.1.yml."
            exit 1
          fi
      - name: Check out the merge script from the default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Merge the green sync pull requests
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/sync-merge-green-port.sh
