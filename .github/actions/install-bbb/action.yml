name: "Install BBB"
description: "Install BigBlueButton"
inputs:
  artifacts-run-id:
    description: "Workflow run whose all-bbb-artifacts packages to install (default: the current run)"
    required: false
    default: ""
  github-token:
    description: "Token that can read the artifacts of that run (needed with artifacts-run-id)"
    required: false
    default: ""
  bbb-web-properties:
    description: "Lines to append to /etc/bigbluebutton/bbb-web.properties before the services restart (default: none)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Git config - disable warnings
      shell: bash
      run: |
        git config --global advice.defaultBranchName false
        git config --global advice.detachedHead false
    - run: ./build/get_external_dependencies.sh
      shell: bash
    - name: Download all BBB artifacts
      uses: actions/download-artifact@v7
      with:
        name: all-bbb-artifacts
        path: artifacts
        run-id: ${{ inputs.artifacts-run-id || github.run_id }}
        github-token: ${{ inputs.github-token }}
    - name: List downloaded artifacts
      shell: bash
      run: |
        set -e
        echo "----ls artifacts/----"
        ls artifacts/
    - name: LIBREOFFICE CACHE - Set cache-key vars
      shell: bash
      run: |
        echo "BBB_LIBREOFFICE_IMAGE_NAME=$(head -n 1 bbb-libreoffice/docker/Dockerfile | cut -d ' ' -f 2)" >> $GITHUB_ENV
    - name: LIBREOFFICE CACHE - Restore bbb-libreoffice.tar from cache
      id: libreoffice-cache
      uses: actions/cache@v5
      with:
        path: bbb-libreoffice.tar
        key: ${{ env.BBB_LIBREOFFICE_IMAGE_NAME }}
    - name: LIBREOFFICE CACHE - Load docker image from bbb-libreoffice.tar
      shell: bash
      if: steps.libreoffice-cache.outputs.cache-hit == 'true'
      run: docker load -i bbb-libreoffice.tar
    - name: APT CACHE - Prepare directory and permissions
      shell: bash
      run: |
        sudo mkdir -p /var/cache/apt/archives/partial
        sudo chown -R "$USER":"$USER" /var/cache/apt
        sudo chmod -R u+rwX /var/cache/apt
    - name: APT CACHE - Restore from cache (if exists)
      uses: actions/cache/restore@v5
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('bigbluebutton-config/bigbluebutton-release') }}
        restore-keys: |
              ${{ runner.os }}-apt-${{ hashFiles('bigbluebutton-config/bigbluebutton-release') }}
    - name: Generate CA
      shell: bash
      run: |
        sudo -i <<EOF
        set -e
        mkdir /root/bbb-ci-ssl/
        cd /root/bbb-ci-ssl/
        openssl rand -base64 48 > /root/bbb-ci-ssl/bbb-dev-ca.pass ;
        chmod 600 /root/bbb-ci-ssl/bbb-dev-ca.pass ;
        openssl genrsa -des3 -out bbb-dev-ca.key -passout file:/root/bbb-ci-ssl/bbb-dev-ca.pass 2048 ;
        openssl req -x509 -new -nodes -key bbb-dev-ca.key -sha256 -days 1460 -passin file:/root/bbb-ci-ssl/bbb-dev-ca.pass -out bbb-dev-ca.crt -subj "/C=CA/ST=BBB/L=BBB/O=BBB/OU=BBB/CN=BBB-DEV" ;
        EOF
    - name: Trust CA
      shell: bash
      run: |
        sudo -i <<EOF
        set -e
        sudo mkdir /usr/local/share/ca-certificates/bbb-dev/
        sudo cp /root/bbb-ci-ssl/bbb-dev-ca.crt /usr/local/share/ca-certificates/bbb-dev/
        sudo chmod 644 /usr/local/share/ca-certificates/bbb-dev/bbb-dev-ca.crt
        sudo update-ca-certificates
        EOF
    - name: Generate certificate
      shell: bash
      run: |
        sudo sh -c '
        cd /root/bbb-ci-ssl/
        echo "$(hostname -I | cut -d" " -f1) bbb-ci.test" >> /etc/hosts
        openssl genrsa -out bbb-ci.test.key 2048
        rm -f bbb-ci.test.csr bbb-ci.test.crt bbb-ci.test.key
        cat > bbb-ci.test.ext << EOF
        authorityKeyIdentifier=keyid,issuer
        basicConstraints=CA:FALSE
        keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
        subjectAltName = @alt_names
        [alt_names]
        DNS.1 = bbb-ci.test
        EOF
        openssl req -nodes -newkey rsa:2048 -keyout bbb-ci.test.key -out bbb-ci.test.csr -subj "/C=CA/ST=BBB/L=BBB/O=BBB/OU=BBB/CN=bbb-ci.test" -addext "subjectAltName = DNS:bbb-ci.test"
        openssl x509 -req -in bbb-ci.test.csr -CA bbb-dev-ca.crt -CAkey bbb-dev-ca.key -CAcreateserial -out bbb-ci.test.crt -days 825 -sha256 -passin file:/root/bbb-ci-ssl/bbb-dev-ca.pass -extfile bbb-ci.test.ext
        cd

        mkdir -p /local/certs/
        cp /root/bbb-ci-ssl/bbb-dev-ca.crt /local/certs/
        cat /root/bbb-ci-ssl/bbb-ci.test.crt > /local/certs/fullchain.pem
        cat /root/bbb-ci-ssl/bbb-dev-ca.crt >> /local/certs/fullchain.pem
        cat /root/bbb-ci-ssl/bbb-ci.test.key > /local/certs/privkey.pem
        '
    - name: Setup local repository
      shell: bash
      run: |
        sudo -i <<EOF
        set -e
        apt install -yq dpkg-dev
        cp -r "$GITHUB_WORKSPACE/artifacts/" /artifacts/
        cd /artifacts && dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
        echo "deb [trusted=yes] file:/artifacts/ ./" >> /etc/apt/sources.list
        EOF
    - name: Prepare for install
      shell: bash
      run: |
        sudo sh -c '
        apt --purge -y remove apache2-bin
        apt-mark hold firefox #hold ff as bbb-install frequently stuck at `Installing the firefox snap`

        #bbb-webrtc-sfu: removes the special scheduling policies
        mkdir -p /etc/systemd/system/bbb-webrtc-sfu.service.d/
        tee /etc/systemd/system/bbb-webrtc-sfu.service.d/override.conf > /dev/null <<EOL
        [Service]
        CPUSchedulingPolicy=other
        Nice=19
        EOL
        systemctl daemon-reload
        '
        # bbb-install.sh runs `apt-get dist-upgrade`, which also pulls the newest kernel and snapd
        # when the runner image is behind Ubuntu (300+ MB, mostly kernel, on a stale image). The
        # runner never reboots, so that download is wasted and, on a slow mirror, times the step out.
        # linux-libc-dev stays upgradable: new build dependencies may require a newer one.
        hold=$({ dpkg-query -W -f='${db:Status-Status} ${Package}\n' 'linux-*' snapd 2>/dev/null || true; } \
          | awk '$1 == "installed" && $2 != "linux-libc-dev" { print $2 }')
        if [ -n "$hold" ]; then
          # shellcheck disable=SC2086
          sudo apt-mark hold $hold
        fi
    # bbb-install.sh does not stop when apt can't reach the Ubuntu mirrors: apt-get update only
    # warns, and set -e is off inside main() (it runs as `main "$@" || exit 1`), so a failed
    # `apt-get install bigbluebutton` ends in an endless wait for bigbluebutton.properties until
    # the step times out. Runners do lose DNS for *.ubuntu.com for several minutes at a time,
    # so only start the install once the mirrors answer.
    - name: Wait for Ubuntu package mirrors
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null <<'EOL'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        EOL

        hosts=$({ grep -ohE 'https?://[^/[:space:]]+' /etc/apt/apt-mirrors.txt 2>/dev/null || true; } | sed -E 's|https?://||' | sort -u)
        hosts=${hosts:-archive.ubuntu.com}
        deadline=$((SECONDS + 20 * 60))
        attempt=1
        while :; do
          resolved=""
          unresolved=""
          for h in $hosts; do
            if getent ahosts "$h" > /dev/null; then resolved="$resolved $h"; else unresolved="$unresolved $h"; fi
          done
          if [ -n "$resolved" ]; then
            out=$(sudo apt-get update 2>&1) || true
            echo "$out"
            if ! grep -qE '^(W|E): Failed to fetch .*(ubuntu\.com|apt-mirrors\.txt)' <<<"$out"; then
              echo "Ubuntu mirrors OK (attempt $attempt)"
              break
            fi
            reason="apt-get update could not fetch the Ubuntu indexes"
          else
            reason="DNS failed for:$unresolved"
            # Tells apart the runner's resolver from the ubuntu.com DNS itself
            for h in $unresolved; do echo "$h via 1.1.1.1: $(dig +time=3 +tries=1 +short "$h" @1.1.1.1 2>&1 | tr '\n' ' ')"; done
          fi
          if (( SECONDS >= deadline )); then
            echo "::error::Ubuntu package mirrors unreachable for 20 minutes ($reason)"
            exit 1
          fi
          echo "::warning::Ubuntu mirrors not ready, attempt $attempt ($reason); retrying in 30s"
          attempt=$((attempt + 1))
          sleep 30
        done
    - name: Install BBB
      shell: bash
      env:
        NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/bbb-dev/bbb-dev-ca.crt
        ACTIONS_RUNNER_DEBUG: true
        BBB_WEB_PROPERTIES: ${{ inputs.bbb-web-properties }}
      run: |
        printf '%s\n' "$BBB_WEB_PROPERTIES" > /tmp/bbb-web-extra.properties
        sudo -i <<'EOF'
        set -e
        cd /root/
        wget -nv https://raw.githubusercontent.com/bigbluebutton/bbb-install/v4.0.x-release/bbb-install.sh -O bbb-install.sh
        sed -i "s|> /etc/apt/sources.list.d/bigbluebutton.list||g" bbb-install.sh
        # Retry the meta-package install and stop if it is still missing, instead of hanging
        # on the bigbluebutton.properties wait loop until the step times out (see above).
        cat > /tmp/bbb-ci-install-retry.sh <<'SNIPPET'
          for ci_try in 1 2 3; do
            need_pkg bigbluebutton
            [ "$(dpkg-query -W -f='${db:Status-Status}' bigbluebutton 2>/dev/null)" = installed ] && break
            echo "bigbluebutton not installed (attempt $ci_try/3), retrying in 60s"
            sleep 60
            dpkg --configure -a || true
            apt_update
          done
          [ "$(dpkg-query -W -f='${db:Status-Status}' bigbluebutton 2>/dev/null)" = installed ] || err "Failed to install the bigbluebutton package"
        SNIPPET
        awk -v snip=/tmp/bbb-ci-install-retry.sh '$0 == "  need_pkg bigbluebutton" { while ((getline l < snip) > 0) print l; next } 1' bbb-install.sh > bbb-install.sh.new
        mv bbb-install.sh.new bbb-install.sh
        grep -q 'ci_try' bbb-install.sh || echo "::warning::bbb-install.sh changed; install retry/fail-fast patch not applied"
        chmod +x bbb-install.sh

        ./bbb-install.sh -v noble-40-dev -s bbb-ci.test -r packages.bigbluebutton.org -j -d /certs/

        bbb-conf --salt bbbci
        sed -i "s/exports.DEBUG = false/exports.DEBUG = true/" /usr/local/bigbluebutton/bbb-graphql-actions/config.js
        sudo yq-go e -i '.log_level = "TRACE"' /usr/share/bbb-graphql-middleware/config.yml
        echo "HASURA_GRAPHQL_LOG_LEVEL=debug" | tee -a /etc/bigbluebutton/bbb-graphql-server.env
        # Tests provision per-meeting client settings via the clientSettingsOverride
        # create module (e.g. webcam/gridTileCount); the property defaults to false.
        echo "allowOverrideClientSettingsOnCreateCall=true" | tee -a /etc/bigbluebutton/bbb-web.properties
        # The meeting-ended callback test calls back bbb-ci.test, which resolves to a private address.
        echo "fetchUrlAllowedLocalHosts=bbb-ci.test" | tee -a /etc/bigbluebutton/bbb-web.properties
        # Settings the calling job asked for (input bbb-web-properties), e.g. for @setting-required tests
        sed '/^$/d' /tmp/bbb-web-extra.properties | tee -a /etc/bigbluebutton/bbb-web.properties
        cat > /etc/bigbluebutton/bbb-conf/apply-config.sh << HERE
        #!/bin/bash

        # Pull in the helper functions for configuring BigBlueButton
        source /etc/bigbluebutton/bbb-conf/apply-lib.sh

        # Available configuration options

        enableHTML5ClientLog
        #enableUFWRules

        HERE
        chmod +x /etc/bigbluebutton/bbb-conf/apply-config.sh
        bbb-conf --restart
        EOF
    - name: List systemctl services
      shell: bash
      run: |
        sudo -i <<EOF
        timeout 60 systemctl --type=service --state=running,exited,failed --all --no-pager --no-legend
        EOF
