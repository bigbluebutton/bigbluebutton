# Base images of the Dockerfiles, checked weekly; one pull request per base image across all
# directories, new major versions left out. Pins are image:<full version tag>@sha256:<digest>
# (node:24.22.2-alpine, not node:24-alpine) so a bump reads as a version change.
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /akka-bbb-apps
      - /bbb-common-message
      - /bbb-common-web
      - /bbb-export-annotations
      - /bbb-graphql-actions
      - /bbb-graphql-middleware
      - /bbb-graphql-server
      - /bbb-learning-dashboard
      - /bbb-libreoffice/docker
      - /bbb-shared-notes-server
      - /bigbluebutton-html5
      - /bigbluebutton-web
      - /docker/bbb-playback
      - /docker/bbb-webhooks
      - /docker/bbb-webrtc-recorder
      - /docker/bbb-webrtc-sfu
      - /docker/java-base
      - /docker/nginx
      - /record-and-playback
    target-branch: v4.1.x-develop
    schedule:
      interval: weekly
    groups:
      base-images:
        group-by: dependency-name
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Ubuntu's YY.MM tags parse as minor versions; 24.04 -> 24.10 would leave the LTS base.
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-minor
      # A new minor version of these is a new release line (nginx 1.30 stable -> 1.31 mainline,
      # Go 1.27 -> 1.28, Alpine 3.24 -> 3.25). Patch releases are still proposed.
      - dependency-name: nginxinc/nginx-unprivileged
        update-types:
          - version-update:semver-minor
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
      - dependency-name: alpine
        update-types:
          - version-update:semver-minor
      # The newest scala-sbt tag is a floating one (..._2.x, the sbt 2 image); refreshed by hand.
      - dependency-name: sbtscala/scala-sbt
