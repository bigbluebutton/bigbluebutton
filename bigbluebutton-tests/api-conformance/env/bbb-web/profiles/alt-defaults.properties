# Every meeting default create reads, set away from its shipped value, so
# that the create cases run under this profile show where each one goes:
# the create answer, getMeetingInfo or akka-apps' meeting props. Left out
# are those that show nowhere (maxNumPages,
# learningDashboardCleanupDelayInMinutes, presentationConversionCacheEnabled,
# allowRequestsWithoutSession) and those only breakout rooms read.
defaultMaxUsers=25
defaultMeetingDuration=45
defaultDialAccessNumber=613-555-0199
defaultNumDigitsForTelVoice=7
disableRecordingDefault=true
defaultWelcomeMessage=Alternative welcome to %%CONFNAME%%, dial %%DIALNUM%%.
defaultWelcomeMessageFooter=
defaultGuestPolicy=ASK_MODERATOR
defaultMeetingLayout=CUSTOM_LAYOUT
meetingExpireIfNoUserJoinedInMinutes=7
meetingExpireWhenLastUserLeftInMinutes=3
endWhenNoModeratorDelayInMinutes=4
autoStartRecording=true
allowStartStopRecording=false
webcamsOnlyForModerator=true
meetingCameraCap=4
userCameraCap=2
maxPinnedCameras=5
muteOnStart=false
allowModsToUnmuteUsers=true
defaultKeepEvents=true
notifyRecordingIsOn=true
bigbluebutton.web.logoutURL=https://logout.example/alt
useDefaultLogo=true
useDefaultDarkLogo=true
lockSettingsDisableCam=true
lockSettingsDisableMic=true
lockSettingsDisablePrivateChat=true
lockSettingsDisablePublicChat=true
lockSettingsDisableNotes=true
lockSettingsHideUserList=true
lockSettingsLockOnJoin=false
lockSettingsLockOnJoinConfigurable=true
lockSettingsHideViewersCursor=true
lockSettingsHideViewersAnnotation=true
lockSettingsPresenterPolicy=moderatorOnly
disabledFeatures=chat,polls
endWhenNoModerator=true
recordFullDurationMedia=true
requireUserConsentBeforeUnmuting=true
allowModsToEjectCameras=true
defaultAllowPromoteGuestToModerator=true
authenticatedGuest=false
maxUserConcurrentAccesses=5
waitingGuestUsersTimeout=31000
userInactivityInspectTimerInMinutes=7
userInactivityThresholdInMinutes=31
userActivitySignResponseDelayInMinutes=6
breakoutRoomsRecord=true
breakoutRoomsPrivateChatEnabled=false
cameraBridge=bbb-webrtc-sfu
screenShareBridge=bbb-webrtc-sfu
audioBridge=bbb-webrtc-sfu
