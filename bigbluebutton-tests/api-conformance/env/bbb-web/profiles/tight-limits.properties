# The presentation conversion suite's tight-limits profile, copied with the
# same values (bigbluebutton-tests/presentation-conversion/profiles), so the
# two suites' results line up; env/tier1/check-copies.sh warns when it
# changes there. Small file, page and image limits and short timeouts.
maxNumPages=5
maxFileSizeUpload=400000
maxBigPdfPageSize=50000
maxBigSvgSize=200000
svgConversionTimeout=3
pdfFontsTimeout=1
maxPageConversionTime=10
officeToPdfConversionTimeout=5
maxImageWidth=640
maxImageHeight=480
extractTimeoutInMs=2000
thumbnailCreationExecTimeout=2
textFileCreationExecTimeout=2
imageResizeWait=2
presDownloadReadTimeoutInMs=3000
