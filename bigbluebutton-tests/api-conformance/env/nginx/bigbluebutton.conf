# The stack's site: a packaged server's (bbb-install's sites-available/
# bigbluebutton), with nginx terminating TLS itself on 8443 rather than
# behind haproxy, and without the client's front-end location.
server_tokens off;

server {
  listen 8443 ssl;
  server_name localhost;

  ssl_certificate     /etc/bigbluebutton/conform/certs/server.crt;
  ssl_certificate_key /etc/bigbluebutton/conform/certs/server.key;

  # nginx does not know its external port/protocol behind haproxy, so use relative redirects.
  absolute_redirect off;

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  # This variable is used instead of $scheme by bigbluebutton nginx include
  # files, so $scheme can be overridden in reverse-proxy configurations.
  set $real_scheme "https";

  # BigBlueButton landing page, and the default presentation bbb-web fetches.
  location / {
    root   /var/www/bigbluebutton-default/assets;
    try_files $uri =404;
  }

  # The packages' locations: bbb-web's API and presentations.
  include /usr/share/bigbluebutton/nginx/*.nginx;
}
