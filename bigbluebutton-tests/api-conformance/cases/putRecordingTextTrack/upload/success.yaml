# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A track for a published recording is accepted: bbb-web leaves it in the
# captions inbox for record-and-playback, which T10b's fs cases look at,
# and answers with the record ID. lang only needs a locale's form, so a
# language no one speaks is accepted too. Serial, with the recording and
# its captions put back before and after, which also clears the inbox.
id: putRecordingTextTrack.upload.success
title: putRecordingTextTrack accepts a ${kind} track with lang ${lang}
endpoint: putRecordingTextTrack
class: contract
tags: [ci, serial]
defs:
  rec: &rec 52388302b3d61ff0ce98e0d6192952f38e0604aa-1700032400000
variants:
  - {id: en, vars: {kind: subtitles, lang: en, label: English}}
  - {id: underscore, vars: {kind: captions, lang: en_US, label: null}}
  - {id: dash, vars: {kind: subtitles, lang: fr-CA, label: Français}}
  - {id: unknown-language, vars: {kind: subtitles, lang: xx, label: null}}
steps:
  - restore: {recordings: [*rec]}
  - call: putRecordingTextTrack
    method: POST
    params: {recordID: *rec, kind: "${kind}", lang: "${lang}", label: "${label}"}
    body:
      multipart:
        files:
          - {field: file, filename: track.vtt, contentType: text/vtt, content: "WEBVTT\n\n00:00:01.000 --> 00:00:02.000\nHello.\n"}
    expect:
      format: json
      returncode: SUCCESS
      messageKey: upload_text_track_success
      message: Text track uploaded successfully
      jsonpath: {$.response.recordId: *rec}
teardown:
  - restore: {recordings: [*rec]}
