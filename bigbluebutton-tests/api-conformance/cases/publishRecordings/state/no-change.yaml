# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Publishing a published recording, or unpublishing an unpublished one,
# changes nothing and still answers SUCCESS. Serial, with the recordings
# put back before and after.
id: publishRecordings.state.no-change
title: publishRecordings ${case} answers SUCCESS and changes nothing
endpoint: publishRecordings
class: contract
tags: [ci, serial, triage]
variants:
  - id: publish-published
    vars: {case: on a published recording with publish=true, rid: 4d64ff980226cdc0de5d24362bf27a829e1a8ab2-1700025200000, publish: "true", state: published}
  - id: unpublish-unpublished
    vars: {case: on an unpublished recording with publish=false, rid: db0c52cbb08b78549a52cb6f29e4d8dc236977bd-1700021600000, publish: "false", state: unpublished}
steps:
  - restore: {recordings: ["${rid}"]}
  - call: publishRecordings
    params: {recordID: "${rid}", publish: "${publish}"}
    golden: document
    expect: {returncode: SUCCESS}
  - call: getRecordings
    params: {recordID: "${rid}"}
    golden: document
    expect:
      returncode: SUCCESS
      xpath: {/response/recordings/recording/state: "${state}"}
teardown:
  - restore: {recordings: ["${rid}"]}
