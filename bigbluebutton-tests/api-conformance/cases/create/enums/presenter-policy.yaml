# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# lockSettingsPresenterPolicy is stored as it was sent, in akka-apps' lock
# settings props: create doesn't check it or change its case.
id: create.enums.presenter-policy
title: create with lockSettingsPresenterPolicy=${value}
endpoint: create
class: compat
tags: [ci]
requires: [akka, bus]
variants:
  - {id: valid, vars: {param: lockSettingsPresenterPolicy, value: moderatorOnly}, class: contract}
  - {id: upper-case, vars: {param: lockSettingsPresenterPolicy, value: MODERATORONLY}}
  - {id: unknown, vars: {param: lockSettingsPresenterPolicy, value: noSuchPolicy}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Enums, "${param}": "${value}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.lockSettingsProps.presenterPolicy]
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
