# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# With learningDashboard disabled, the meeting has no access token and no
# learning-dashboard data is written for it (create.dashboard.written
# shows the file appearing within seconds otherwise).
id: create.dashboard.disabled
title: create with the learning dashboard disabled writes no dashboard data
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus, fs]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Dashboard, disabledFeatures: learningDashboard}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - fs: {path: "learning-dashboard/${intId}/*/learning_dashboard_data.json", within: 10s}
    expect: {absent: true}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
