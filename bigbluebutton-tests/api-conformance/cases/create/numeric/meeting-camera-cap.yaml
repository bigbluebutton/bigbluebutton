# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# meetingCameraCap sets the meeting's camera cap. Whatever value it is
# given, create answers SUCCESS, never an error: a value that isn't an int,
# such as letters or one over 2^31 - 1, or an empty one, means the default.
# A negative cap means the default. Its shipped default is 0, so the alt-
# defaults variants show that it is the default. What reaches akka-apps'
# meeting props is recorded.
id: create.numeric.meeting-camera-cap
title: create with meetingCameraCap=${value}${under}
endpoint: create
class: compat
tags: [ci]
requires: [akka, bus]
variants:
  - {id: valid, vars: {value: "7", under: ""}, class: contract}
  - {id: letters, vars: {value: "abc", under: ""}}
  - {id: negative, vars: {value: "-5", under: ""}}
  - {id: empty, vars: {value: "", under: ""}}
  - {id: too-large, vars: {value: "2147483648", under: ""}}
  - {id: letters-alt-defaults, vars: {value: "abc", under: " (alt-defaults)"}, profile: alt-defaults, tags: [disruptive]}
  - {id: negative-alt-defaults, vars: {value: "-5", under: " (alt-defaults)"}, profile: alt-defaults, tags: [disruptive]}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Numbers, meetingCameraCap: "${value}"}
    golden: off
    expect: {status: 200, returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.meetingProp.meetingCameraCap]
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
