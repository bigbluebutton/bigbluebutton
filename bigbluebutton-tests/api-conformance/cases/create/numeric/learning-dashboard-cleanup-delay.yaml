# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# learningDashboardCleanupDelayInMinutes sets when the learning dashboard's
# data is removed, which no answer or meeting prop shows. Whatever value it
# is given, create answers SUCCESS, never an error.
id: create.numeric.learning-dashboard-cleanup-delay
title: create with learningDashboardCleanupDelayInMinutes=${value}
endpoint: create
class: compat
tags: [ci]
requires: [akka]
variants:
  - {id: valid, vars: {value: "7"}, class: contract}
  - {id: letters, vars: {value: "abc"}}
  - {id: negative, vars: {value: "-5"}}
  - {id: empty, vars: {value: ""}}
  - {id: too-large, vars: {value: "2147483648"}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Numbers, learningDashboardCleanupDelayInMinutes: "${value}"}
    golden: off
    expect: {status: 200, returncode: SUCCESS}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
