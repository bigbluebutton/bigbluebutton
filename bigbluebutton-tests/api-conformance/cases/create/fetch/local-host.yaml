# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# bbb-web fetches from a local address (loopback, private, link-local)
# only when the URL's host is in fetchUrlAllowedLocalHosts. Tier 1 lists
# sink.test, the sink's name (create.client-settings.url fetches from it),
# so the sink at 127.0.0.1 and its own port is refused.
id: create.fetch.local-host
title: create refuses to fetch from a local address by a name it doesn't list
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus, callbacks]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Fetch rules, clientSettingsOverrideJsonUrl: 'https://127.0.0.1:${match(sinkUrl, ":([0-9]+)$")}/${uid}/fixtures/client-settings/override.json'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 30s}
    select: [$.core.body.props.overrideClientSettings]
    expect:
      jsonpath:
        $.core.body.props.overrideClientSettings: ""
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
