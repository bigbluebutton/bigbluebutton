# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# bbb-web follows a 301, 302 or 303 redirect, up to five in a row, and
# checks each new URL against the fetch rules; any other answer but 200
# is refused, a 307 included (create.fetch.redirect-to-http and
# create.fetch.redirect-to-local: to a URL the rules refuse). The redirects
# to the override are relative, so they stay under the case's sink key.
id: create.fetch.redirect
title: create ${what}
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus, callbacks]
variants:
  - {id: followed, vars: {what: follows a redirect, rest: "moved?_redirect=fixtures/client-settings/override.json", want: '^\{"public":'}}
  - {id: five, vars: {what: follows five redirects in a row, rest: "fixtures/client-settings/override.json?_redirect=self&_first=5", want: '^\{"public":'}}
  - {id: six, vars: {what: refuses a sixth redirect in a row, rest: "fixtures/client-settings/override.json?_redirect=self&_first=6", want: '^$'}}
  - {id: status-307, vars: {what: refuses a 307 redirect, rest: "moved?_status=307&_redirect=fixtures/client-settings/override.json", want: '^$'}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Fetch rules, clientSettingsOverrideJsonUrl: "${sinkUrl}/${uid}/${rest}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 30s}
    select: [$.core.body.props.overrideClientSettings]
    expect:
      jsonpath:
        $.core.body.props.overrideClientSettings: {regex: "${want}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
