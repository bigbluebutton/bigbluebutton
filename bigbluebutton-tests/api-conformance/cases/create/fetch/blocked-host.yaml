# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# bbb-web refuses to fetch from a host named in fetchUrlBlockedExternalHosts,
# even one fetchUrlAllowedLocalHosts lists: the fetch-blocked-host profile
# blocks sink.test, which Tier 1 otherwise fetches from
# (create.client-settings.url).
id: create.fetch.blocked-host
title: create refuses to fetch from a blocked host
endpoint: create
class: contract
tags: [ci, disruptive]
profile: fetch-blocked-host
requires: [akka, bus, callbacks]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Fetch rules, clientSettingsOverrideJsonUrl: "${sinkUrl}/${uid}/fixtures/client-settings/override.json"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 30s}
    select: [$.core.body.props.overrideClientSettings]
    expect:
      jsonpath:
        $.core.body.props.overrideClientSettings: ""
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
