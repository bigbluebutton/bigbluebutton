# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The sharedNotesInitialContentMarkdown param wins over the markdown in
# create's body; the body's JSON content, which has no param, is used.
id: create.shared-notes.body-and-param
title: The sharedNotesInitialContentMarkdown param wins over the body's markdown
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Shared notes, sharedNotesInitialContentMarkdown: "# Param notes"}
    body: {xml: '<modules><module name="sharedNotesInitialContentJson"><![CDATA[[{"insert":"Body notes\n"}]]]></module><module name="sharedNotesInitialContentMarkdown"><![CDATA[# Body notes]]></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 10s}
    select: [$.core.body.props.meetingProp.sharedNotesInitialContentJson, $.core.body.props.meetingProp.sharedNotesInitialContentMarkdown]
    expect:
      jsonpath:
        $.core.body.props.meetingProp.sharedNotesInitialContentJson[0].insert: "Body notes\n"
        $.core.body.props.meetingProp.sharedNotesInitialContentMarkdown: "# Param notes"
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
