# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Initial content fetched from sharedNotesInitialContentJsonUrl and
# sharedNotesInitialContentMarkdownUrl wins over the content in create's
# body (create.shared-notes.body).
id: create.shared-notes.body-and-urls
title: The shared notes' initial content from URLs wins over the body's
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus, callbacks]
steps:
  - call: create
    method: POST
    params:
      meetingID: "${uid}"
      name: Shared notes
      sharedNotesInitialContentJsonUrl: "${sinkUrl}/${uid}/fixtures/shared-notes/initial.json"
      sharedNotesInitialContentMarkdownUrl: "${sinkUrl}/${uid}/fixtures/shared-notes/initial.md"
    body: {xml: '<modules><module name="sharedNotesInitialContentJson"><![CDATA[[{"insert":"Body notes\n"}]]]></module><module name="sharedNotesInitialContentMarkdown"><![CDATA[# Body notes]]></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 10s}
    select: [$.core.body.props.meetingProp.sharedNotesInitialContentJson, $.core.body.props.meetingProp.sharedNotesInitialContentMarkdown]
    expect:
      jsonpath:
        $.core.body.props.meetingProp.sharedNotesInitialContentJson[0].insert: "Conform notes\n"
        $.core.body.props.meetingProp.sharedNotesInitialContentMarkdown: {regex: '^# Conform notes\n\nInitial \*markdown\* content\.\n?$'}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
