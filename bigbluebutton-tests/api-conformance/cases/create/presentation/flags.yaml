# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A document's current and removable attributes. The first document with
# current="true" moves to the front: it becomes the current and default
# presentation in the first document's place. removable="false" keeps
# presenters from removing it.
id: create.presentation.flags
title: create passes on a document's current and removable attributes
endpoint: create
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Presentations}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf" filename="first.pdf" removable="false"/><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf" filename="chosen.pdf" current="true"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "first.pdf"}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "chosen.pdf"}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
