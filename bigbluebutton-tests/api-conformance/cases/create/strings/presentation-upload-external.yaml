# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The external upload link and its description reach akka-apps' meeting
# props as they were given.
id: create.strings.presentation-upload-external
title: create with an external upload link
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Strings, presentationUploadExternalUrl: "https://uploads.example/upload", presentationUploadExternalDescription: Upload your slides there}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.meetingProp.presentationUploadExternalUrl, $.core.body.props.meetingProp.presentationUploadExternalDescription]
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
