# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The file names breakout rooms' captured slides and notes get reach
# akka-apps' breakout props as they were given, %%CONFNAME%% left as it is.
# Without them, both are %%CONFNAME%%.
id: create.strings.capture-filenames
title: create with breakout capture file names
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Strings, breakoutRoomsCaptureSlidesFilename: "Slides of %%CONFNAME%%", breakoutRoomsCaptureNotesFilename: "Notes of %%CONFNAME%%"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.breakoutProps.captureSlidesFilename, $.core.body.props.breakoutProps.captureNotesFilename]
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
