# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# With allowOverrideClientSettingsOnCreateCall (the client-settings-body
# profile), create hands the clientSettingsOverride module of its body, as
# it is, to akka-apps as the meeting's overrideClientSettings.
id: create.client-settings.body
title: create passes on a client settings override in its body when allowed
endpoint: create
class: contract
tags: [ci, disruptive]
profile: client-settings-body
requires: [akka, bus]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Client settings}
    body: {xml: '<modules><module name="clientSettingsOverride"><![CDATA[{"public":{"app":{"clientTitle":"Body client"}}}]]></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.overrideClientSettings]
    expect:
      jsonpath: {$.core.body.props.overrideClientSettings: '{"public":{"app":{"clientTitle":"Body client"}}}'}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
