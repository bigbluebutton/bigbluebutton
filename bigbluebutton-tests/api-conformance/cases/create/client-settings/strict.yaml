# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# With clientSettingsOverrideStrictValidation (the client-settings-strict
# profile; shipped false), bbb-web checks a fetched override against the
# client's settings.yml: one that names a setting the client doesn't have
# fails create with clientSettingsOverrideValidationError, and no meeting
# is created; one that only names known settings passes. Nightly only:
# akka-apps reads the setting too, so switching to the profile and back
# restarts it twice.
id: create.client-settings.strict
title: create with strict validation ${outcome}
endpoint: create
class: contract
tags: [slow, disruptive]
profile: client-settings-strict
requires: [akka, bus, callbacks]
variants:
  - {id: known, vars: {outcome: accepts an override of known settings, file: override.json, code: SUCCESS}}
  - {id: unknown, vars: {outcome: refuses an override of a setting the client doesn't have, file: unknown-key.json, code: FAILED}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Client settings, clientSettingsOverrideJsonUrl: "${sinkUrl}/${uid}/fixtures/client-settings/${file}"}
    expect: {returncode: "${code}"}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: "${code}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
