# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Once a meeting has ended and bbb-web has forgotten it, its meetingID
# creates a new meeting: a plain SUCCESS, not a duplicate. The end waits
# until akka-apps has created the meeting: an end that reaches it earlier
# is lost.
id: create.duplicates.after-end
title: create again after the meeting ended
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: First}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: end
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    eventually: {within: 5s, every: 100ms, until: {messageKey: notFound}}
    expect: {messageKey: notFound}
  - call: create
    params: {meetingID: "${uid}", name: Second}
    expect: {returncode: SUCCESS, messageKey: ""}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
