# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# meetingExpireWhenLastUserLeftInMinutes counts from when akka-apps removed
# the last user, at the first audit (every 10 seconds) more than 10 seconds
# after they left, not from the leave itself. With one minute, the meeting
# ends with the reason ENDED_WHEN_LAST_USER_LEFT 60 to 70 seconds after
# the removal. create.tsx says the meeting ends that many minutes "after
# last user left", which would be 10 to 20 seconds earlier, so this is
# compat.
id: create.expiry.last-user-left-delay
title: A meeting ends meetingExpireWhenLastUserLeftInMinutes after its last user is removed
endpoint: create
class: compat
tags: [slow, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Expiry, meetingExpireWhenLastUserLeftInMinutes: "1"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}}
    golden: off
    capture: {annId: $.userId}
  - presence: {action: leave, as: ann}
    golden: off
  # akka-apps removes Ann.
  - bus: {name: UserLeftMeetingEvtMsg, meetingId: "${intId}", within: 25s}
    golden: off
    expect: {jsonpath: {$.core.body.intId: "${annId}"}}
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 50s}
    expect: {absent: true}
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 35s}
    expect:
      jsonpath: {$.core.body.reason: ENDED_WHEN_LAST_USER_LEFT}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 200ms, until: {messageKey: notFound}}
    expect: {returncode: FAILED, messageKey: notFound}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
