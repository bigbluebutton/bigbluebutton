# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A meeting ends by itself once its duration, in minutes, has passed, with
# the reason ENDED_AFTER_EXCEEDING_DURATION. akka-apps checks every 10
# seconds. Nobody joins, but meetingExpireIfNoUserJoinedInMinutes is
# longer than the duration.
id: create.expiry.duration
title: A meeting ends once its duration has passed
endpoint: create
class: contract
tags: [slow]
requires: [akka]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Expiry, duration: "1", meetingExpireIfNoUserJoinedInMinutes: "5"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 90s}
    expect:
      jsonpath: {$.core.body.reason: ENDED_AFTER_EXCEEDING_DURATION}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 200ms, until: {messageKey: notFound}}
    expect: {returncode: FAILED, messageKey: notFound}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
