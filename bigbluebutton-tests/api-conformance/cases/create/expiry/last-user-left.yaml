# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A meeting ends once its last user is gone, with the reason
# ENDED_WHEN_LAST_USER_LEFT. With meetingExpireWhenLastUserLeftInMinutes 0
# or negative, akka-apps removes a user who left at its next audit (every
# 10 seconds) and ends the meeting at that same audit. A closed connection
# counts as leaving. last-user-left-delay.yaml has a delay of a minute.
id: create.expiry.last-user-left
title: "A meeting ends when its last user ${how}s (meetingExpireWhenLastUserLeftInMinutes=${minutes})"
endpoint: create
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - {id: zero, vars: {minutes: "0", how: leave}}
  - {id: negative, vars: {minutes: "-5", how: leave}, class: compat}
  - {id: disconnect, vars: {minutes: "0", how: disconnect}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Expiry, meetingExpireWhenLastUserLeftInMinutes: "${minutes}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}}
    golden: off
  - presence: {action: "${how}", as: ann}
    golden: off
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 25s}
    expect:
      jsonpath: {$.core.body.reason: ENDED_WHEN_LAST_USER_LEFT}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 200ms, until: {messageKey: notFound}}
    expect: {returncode: FAILED, messageKey: notFound}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
