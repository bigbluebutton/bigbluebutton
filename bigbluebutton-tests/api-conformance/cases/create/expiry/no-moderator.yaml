# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# With endWhenNoModerator, a meeting ends once no user in it is a moderator,
# with the reason ENDED_DUE_TO_NO_MODERATOR, even though a viewer is still
# there. A moderator who leaves counts as present until akka-apps removes
# them: its audit runs every 10 seconds and removes a user at the first
# audit more than 10 seconds after they left. With
# endWhenNoModeratorDelayInMinutes 0 or negative, the meeting ends at that
# same audit. no-moderator-delay.yaml has a delay of a minute.
id: create.expiry.no-moderator
title: "A meeting with endWhenNoModerator ends when its moderator is gone (delay ${delay})"
endpoint: create
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - {id: zero, vars: {delay: "0"}}
  - {id: negative, vars: {delay: "-2"}, class: compat}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Expiry, endWhenNoModerator: "true", endWhenNoModeratorDelayInMinutes: "${delay}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}}
    golden: off
    capture: {annId: $.userId}
  - presence: {action: join, as: vic, args: {meetingID: "${uid}", fullName: Vic, role: VIEWER}}
    golden: off
  - presence: {action: leave, as: ann}
    golden: off
  # akka-apps removes Ann.
  - bus: {name: UserLeftMeetingEvtMsg, meetingId: "${intId}", within: 25s}
    golden: off
    expect: {jsonpath: {$.core.body.intId: "${annId}"}}
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 10s}
    expect:
      jsonpath: {$.core.body.reason: ENDED_DUE_TO_NO_MODERATOR}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 200ms, until: {messageKey: notFound}}
    expect: {returncode: FAILED, messageKey: notFound}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
