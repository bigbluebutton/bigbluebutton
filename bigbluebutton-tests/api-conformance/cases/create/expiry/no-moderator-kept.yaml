# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A meeting keeps running without a moderator when endWhenNoModerator is
# off, its shipped default, and when no moderator has joined yet: the rule
# applies only once a moderator has been there. The delay is 0, so with
# the rule in force the meeting would end as soon as akka-apps removed the
# moderator who left (no-moderator.yaml); a meeting where no moderator
# ever joined would end at the first audit after the joins. A viewer stays
# throughout.
id: create.expiry.no-moderator-kept
title: "A meeting without a moderator keeps running: ${why}"
endpoint: create
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - {id: off, vars: {why: endWhenNoModerator is off by default, end: null, role: MODERATOR}}
  - {id: never-joined, vars: {why: no moderator ever joined, end: "true", role: VIEWER}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Expiry, endWhenNoModerator: "${end}", endWhenNoModeratorDelayInMinutes: "0"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: "${role}"}}
    golden: off
    capture: {annId: $.userId}
  - presence: {action: join, as: vic, args: {meetingID: "${uid}", fullName: Vic, role: VIEWER}}
    golden: off
  - presence: {action: leave, as: ann}
    golden: off
  # akka-apps removes Ann.
  - bus: {name: UserLeftMeetingEvtMsg, meetingId: "${intId}", within: 25s}
    golden: off
    expect: {jsonpath: {$.core.body.intId: "${annId}"}}
  # Past the next audit.
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 15s}
    expect: {absent: true}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
