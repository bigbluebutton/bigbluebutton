# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# disabledFeaturesExclude takes features off the disabled list, whether they
# came from the param or from the disabledFeatures setting (chat and polls
# under alt-defaults). The result is in akka-apps' meeting props.
id: create.features.disabled-features-exclude
title: create excluding ${exclude} from ${from}
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus]
variants:
  - {id: param, vars: {from: disabledFeatures, disabled: "chat,polls", exclude: polls}}
  - {id: setting, vars: {from: the setting, disabled: null, exclude: chat}, profile: alt-defaults, tags: [disruptive]}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Features, disabledFeatures: "${disabled}", disabledFeaturesExclude: "${exclude}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.meetingProp.disabledFeatures]
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
