# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# disabledFeaturesExclude is split on commas but, unlike disabledFeatures,
# not trimmed, so after "chat, polls" only chat is excluded. Whether a space
# after a comma should count is still to be decided (the triage tag).
id: create.features.disabled-features-exclude-spaces
title: create excluding "chat, polls"
endpoint: create
class: compat
tags: [triage]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Features, disabledFeatures: "chat,polls", disabledFeaturesExclude: "chat, polls"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.meetingProp.disabledFeatures]
    golden: document
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
