# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# What a breakout room that akka-apps asks for gets in its props, beyond
# what its request names:
# - multiUserWhiteboardEnabled is breakoutRoomsMultiUserWhiteboardDefaultOn
#   (shipped true; false under alt-defaults), the one setting only rooms
#   read;
# - its plugins are its parent's whose manifest sets
#   enabledForBreakoutRooms. bbb-web fetches nothing for a room: the sink
#   sees the parent's two manifests checked and fetched, once each.
# akka-apps wants at least two rooms.
id: create.breakout-rooms.props
title: A breakout room's whiteboard default and plugins${under}
endpoint: create
class: contract
tags: [ci, presence]
requires: [akka, presence, bus, callbacks]
variants:
  - {id: shipped, vars: {under: "", whiteboard: true}}
  - {id: alt-defaults, vars: {under: " under alt-defaults", whiteboard: false}, profile: alt-defaults, tags: [disruptive]}
steps:
  - call: create
    params:
      meetingID: "${uid}"
      name: Breakout props
      pluginManifests: '[{"url":"${sinkUrl}/${uid}/fixtures/plugins/basic.json"},{"url":"${sinkUrl}/${uid}/fixtures/plugins/breakout.json"}]'
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.pluginProp]
    expect:
      jsonpath:
        $.core.body.props.pluginProp.ConformBasic.manifest.content.name: ConformBasic
        $.core.body.props.pluginProp.ConformBreakout.manifest.content.enabledForBreakoutRooms: true
  - presence:
      action: join
      as: ann
      args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}
    golden: off
  - graphql:
      as: ann
      query: >-
        mutation CreateBreakouts($record: Boolean!, $notes: Boolean!, $slides: Boolean!, $duration: Int!,
        $invite: Boolean!, $lock: Boolean!, $rooms: [BreakoutRoom]!) {
        breakoutRoomCreate(record: $record, captureNotes: $notes, captureSlides: $slides, durationInSeconds: $duration,
        sendInviteToModerators: $invite, inheritLockSettings: $lock, rooms: $rooms) }
      variables:
        record: false
        notes: false
        slides: false
        duration: 600
        invite: false
        lock: false
        rooms:
          - {name: Room 1, shortName: Room 1, sequence: 1, isDefaultName: true, freeJoin: false, users: [], captureNotesFilename: "", captureSlidesFilename: "", allPages: true, presId: ""}
          - {name: Room 2, shortName: Room 2, sequence: 2, isDefaultName: true, freeJoin: false, users: [], captureNotesFilename: "", captureSlidesFilename: "", allPages: true, presId: ""}
    golden: off
  - bus: {name: BreakoutRoomStartedEvtMsg, meetingId: "${intId}", within: 15s}
    golden: off
    expect:
      jsonpath: {$.core.body.breakout.sequence: "1"}
    capture: {room1: $.core.body.breakout.breakoutId}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${room1}", within: 5s}
    select: [$.core.body.props.usersProp.multiUserWhiteboardEnabled, $.core.body.props.pluginProp]
    expect:
      jsonpath:
        $.core.body.props.usersProp.multiUserWhiteboardEnabled: ${whiteboard}
        $.core.body.props.pluginProp.ConformBreakout.manifest.content.name: ConformBreakout
        $.core.body.props.pluginProp.ConformBasic: {absent: true}
  - sink: {key: "${uid}", within: 3s}
    golden: off
    expect: {count: 4}
teardown:
  # Ending the parent ends its rooms. Again until bbb-web no longer knows
  # the meeting: an end that reaches akka-apps before the create does is
  # lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
