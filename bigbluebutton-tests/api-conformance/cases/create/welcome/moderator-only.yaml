# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# moderatorOnlyMessage, the welcome only moderators see, has its keywords
# replaced and its HTML cleaned like the welcome message, but gets no
# footer. Without it, it is empty.
id: create.welcome.moderator-only
title: create ${scenario} a moderator-only message
endpoint: create
class: contract
tags: [ci]
requires: [akka, bus]
variants:
  - {id: given, vars: {scenario: with, message: 'For %%CONFNAME%%: <a href="https://link.example/">notes</a><script>x()</script>'}}
  - {id: absent, vars: {scenario: without, message: null}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Moderators, moderatorOnlyMessage: "${message}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    select: [$.core.body.props.welcomeProp]
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
