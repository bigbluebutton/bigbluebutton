# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Documents in create's body replace the server's default presentation
# while preUploadedPresentationOverrideDefault is true (shipped). With the
# param set to false, the server's default presentation is uploaded too and,
# unless a document asks to be current, it goes first: it is the current,
# default presentation, and the body's documents are neither.
id: create.default-presentation.override
title: The documents in create's body and the default presentation, with preUploadedPresentationOverrideDefault ${override}
endpoint: create
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
variants:
  - {id: "true", vars: {override: "true", defaults: "0"}}
  - {id: "false", vars: {override: "false", defaults: "1"}}
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Default presentation, preUploadedPresentationOverrideDefault: "${override}"}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath:
        $.core.body.presentation.name: "two-pages.pdf"
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 10s}
    golden: off
    expect:
      count: {between: ["${defaults}", "${defaults}"]}
      jsonpath: {$.core.body.common.presentationName: default.pdf}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
