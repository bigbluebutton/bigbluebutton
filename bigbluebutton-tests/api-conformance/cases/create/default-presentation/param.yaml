# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The preUploadedPresentation param names a document by URL, without a
# body. It is uploaded as the current, default presentation in place of the
# server's, named by its URL's last path segment.
id: create.default-presentation.param
title: create uploads the document preUploadedPresentation names, by its URL's name
endpoint: create
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Default presentation, preUploadedPresentation: "${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "two-pages.pdf"}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 1s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: default.pdf}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
