# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A meeting created without documents starts with the server's default
# presentation: bbb-web fetches defaultUploadedPresentation
# (${serverURL}/default.pdf) and uploads it as the current, default
# presentation.
id: create.default-presentation.none
title: Without documents, create uploads the server's default presentation
endpoint: create
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Default presentation}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath:
        $.core.body.presentation.name: "default.pdf"
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
