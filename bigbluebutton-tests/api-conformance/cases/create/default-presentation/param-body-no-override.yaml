# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# preUploadedPresentation, documents in create's body and
# preUploadedPresentationOverrideDefault=false: the param's document is the
# current, default presentation, the body's documents follow, and the
# server's default presentation is uploaded last, neither current nor the
# default presentation.
id: create.default-presentation.param-body-no-override
title: With preUploadedPresentation, a body and the default presentation, the param's document is current
endpoint: create
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Default presentation, preUploadedPresentation: "${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf", preUploadedPresentationName: from-param.pdf, preUploadedPresentationOverrideDefault: "false"}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/image.png"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 180s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "from-param.pdf"}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 180s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "image.png"}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 180s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "default.pdf"}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
