# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Documents in create's body replace the server's default presentation
# while preUploadedPresentationOverrideDefault is true (shipped): the first
# document is the current, default presentation, and the server's default
# presentation isn't uploaded (create.default-presentation.override-false).
id: create.default-presentation.override-true
title: create's documents replace the default presentation with preUploadedPresentationOverrideDefault true
endpoint: create
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Default presentation, preUploadedPresentationOverrideDefault: "true"}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath:
        $.core.body.presentation.name: "two-pages.pdf"
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 10s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: default.pdf}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
