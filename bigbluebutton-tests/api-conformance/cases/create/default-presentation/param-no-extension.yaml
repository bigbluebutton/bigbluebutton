# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A preUploadedPresentation URL whose last path segment has no extension
# is taken, but not named by that segment: the document is called
# "untitled", with the extension its content gives, a PDF here (the sink
# redirects to the fixture).
id: create.default-presentation.param-no-extension
title: create takes a preUploadedPresentation URL without an extension, as untitled with its content's extension
endpoint: create
class: compat
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Default presentation, preUploadedPresentation: "${sinkUrl}/${uid}/document?_redirect=${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    select: [$.core.body.presentation.name, $.core.body.presentation.current, $.core.body.presentation.removable, $.core.body.presentation.defaultPresentation]
    expect:
      jsonpath: {$.core.body.presentation.name: "untitled.pdf"}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 1s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: default.pdf}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
