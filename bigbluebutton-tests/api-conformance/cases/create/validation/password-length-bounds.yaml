# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The shortest and the longest passwords create accepts come back in its
# answer.
id: create.validation.password-length-bounds
title: create accepts a ${len}-character ${param}
endpoint: create
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: attendee-shortest, vars: {param: attendeePW, len: 2}}
  - {id: attendee-longest, vars: {param: attendeePW, len: 64}}
  - {id: moderator-shortest, vars: {param: moderatorPW, len: 2}}
  - {id: moderator-longest, vars: {param: moderatorPW, len: 64}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Passwords, "${param}": '${repeat("p", len)}'}
    expect:
      returncode: SUCCESS
      xpath: {"/response/${param}": '${repeat("p", len)}'}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
