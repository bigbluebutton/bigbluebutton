# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The shortest meetingID create accepts. Two characters leave no room for the
# case's own ID, so the case runs alone.
id: create.validation.meeting-id-shortest
title: create accepts a 2-character meetingID
endpoint: create
class: contract
tags: [ci, serial]
requires: [akka]
steps:
  - call: create
    params: {meetingID: zz, name: Meeting ID}
    expect: {returncode: SUCCESS}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: zz}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
