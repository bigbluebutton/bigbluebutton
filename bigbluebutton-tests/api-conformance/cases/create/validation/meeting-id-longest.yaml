# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The longest meetingID create accepts: the case's own ID, padded to 256
# characters.
id: create.validation.meeting-id-longest
title: create accepts a 256-character meetingID
endpoint: create
class: contract
tags: [ci]
requires: [akka]
steps:
  - call: create
    params: {meetingID: '${uid}${repeat("z", 239)}', name: Meeting ID}
    expect: {returncode: SUCCESS}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: '${uid}${repeat("z", 239)}'}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
