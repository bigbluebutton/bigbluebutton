# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A password create is given must be 2 to 64 characters long; both share the
# invalidPassword error.
id: create.validation.password
title: create rejects a ${len}-character ${param}
endpoint: create
class: contract
tags: [ci]
variants:
  - {id: attendee-too-short, vars: {param: attendeePW, len: 1}}
  - {id: attendee-too-long, vars: {param: attendeePW, len: 65}}
  - {id: moderator-too-short, vars: {param: moderatorPW, len: 1}}
  - {id: moderator-too-long, vars: {param: moderatorPW, len: 65}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Passwords, "${param}": '${repeat("p", len)}'}
    expect: {returncode: FAILED, messageKey: invalidPassword}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
