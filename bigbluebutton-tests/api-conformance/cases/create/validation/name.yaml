# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A meeting name is required. Its length limits are in name-length.yaml.
id: create.validation.name
title: create without a meeting name
endpoint: create
class: contract
tags: [ci]
steps:
  - call: create
    params: {meetingID: "${uid}"}
    expect: {returncode: FAILED, messageKey: nullError}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
