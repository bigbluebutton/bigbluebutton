# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# An empty presentationUploadExternalUrl fails the URL check, unlike other
# optional params, where empty means not given. Whether it should is still
# to be decided (the triage tag); the expect allows either a SUCCESS or that
# validation error.
id: create.validation.presentation-upload-external-url-empty
title: create with an empty presentationUploadExternalUrl
endpoint: create
class: compat
tags: [triage]
steps:
  - call: create
    params: {meetingID: "${uid}", name: External upload, presentationUploadExternalUrl: ""}
    golden: document
    expect: {messageKey: {regex: '^(validationError)?$'}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
