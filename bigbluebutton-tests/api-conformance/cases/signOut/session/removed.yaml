# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# After signOut, bbb-web's session-token calls refuse the token.
id: signOut.session.removed
title: After signOut, the session token is refused
endpoint: signOut
class: contract
tags: [ci]
requires: [akka]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Signed out}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    capture: {annId: /response/user_id, annToken: /response/session_token}
  - call: signOut
    client: ann
    params: {sessionToken: "${annToken}"}
    ignoreResult: true
  - call: getJoinUrl
    client: ann
    params: {sessionToken: "${annToken}"}
    expect: {format: json, returncode: FAILED, message: Invalid session token}
  - call: stuns
    client: ann
    params: {sessionToken: "${annToken}"}
    expect:
      format: json
      returncode: FAILED
      message: Could not find conference.
      jsonpath: {$.logoutURL: {exists: true}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
