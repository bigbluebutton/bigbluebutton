# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The end callback says whether the meeting has recording marks: once
# recording has started, recordingmarks is true. With record and
# autoStartRecording, akka-apps starts recording when the first user
# joins. sent.yaml has a meeting without marks.
id: end.callbacks.recording-marks
title: The end callback of a meeting that was recorded has recordingmarks=true
endpoint: end
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Callback, record: "true", autoStartRecording: "true", meta_endCallbackUrl: "${sinkUrl}/${uid}/ended"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence:
      action: join
      as: ann
      args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}
    golden: off
  - bus: {name: RecordingStatusChangedEvtMsg, meetingId: "${intId}", within: 10s}
    expect:
      jsonpath: {$.core.body.recording: "true"}
  - call: end
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS}
  - sink: {key: "${uid}", within: 10s}
    expect:
      method: GET
      path: /${uid}/ended
      query: {meetingID: "${uid}", recordingmarks: "true"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
