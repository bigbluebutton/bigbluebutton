# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# An end callback that doesn't answer with a 2xx is tried again 30 seconds
# later: a 5xx, a 4xx and a redirect (which bbb-web doesn't follow) all
# count as failures. The sink answers the first attempt as the variant
# says and the second with a 200. api.md documents the callback, not its
# retries, so this is compat.
id: end.callbacks.retry
title: "An end callback answered with ${status} is tried again"
endpoint: end
class: compat
tags: [slow]
requires: [akka]
variants:
  - {id: status-500, vars: {status: "500"}}
  - {id: status-404, vars: {status: "404"}}
  - {id: status-302, vars: {status: "302"}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Callback, meta_endCallbackUrl: "${sinkUrl}/${uid}/ended?_status=${status}&_first=1"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: end
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS}
  - sink: {key: "${uid}", within: 10s}
    expect:
      method: GET
      path: /${uid}/ended
      query: {_status: "${status}", meetingID: "${uid}", recordingmarks: "false"}
  # Not at once: 30 seconds later, give or take 10.
  - sink: {key: "${uid}", within: 20s}
    golden: off
    expect: {count: 1}
  - sink: {key: "${uid}", within: 20s}
    golden: off
    expect: {count: 2}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
