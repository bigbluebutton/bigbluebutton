# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# end answers at once that it asked for the end. akka-apps then announces the
# meeting ending, with the reason ENDED_FROM_API, and ended; bbb-web forgets
# the meeting on the second. end waits until akka-apps has created the
# meeting: an end that reaches it earlier is lost.
id: end.lifecycle.ends
title: end ends the meeting
endpoint: end
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: End}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: end
    params: {meetingID: "${uid}"}
    expect:
      returncode: SUCCESS
      messageKey: sentEndMeetingRequest
      message: "A request to end the meeting was sent. Please wait a few seconds, and then use the getMeetingInfo or isMeetingRunning API calls to verify that it was ended."
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 5s}
    expect:
      jsonpath: {$.core.body.reason: ENDED_FROM_API}
  - bus: {name: MeetingEndedEvtMsg, meetingId: "${intId}", within: 5s}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 100ms, until: {messageKey: notFound}}
    expect: {returncode: FAILED, messageKey: notFound}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
