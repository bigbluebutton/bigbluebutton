# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# end removes the users in the meeting: api.md says it kicks all
# participants out. A user who had joined reads, in their own state, that
# they are logged out and no longer in the meeting, which ended from the
# API. About 2.5 seconds after the end, akka-apps tells every client to
# disconnect. akka-apps sends no UserLeftMeetingEvtMsg for them. The user
# reads their state as the HTML5 client's meeting-ended screen does, under
# the name getMeetingEndData: from a user who is out of the meeting,
# bbb-graphql-middleware answers only a few operations, named as the
# client names them.
id: end.lifecycle.users
title: end removes the users in the meeting
endpoint: end
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: End}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS, xpath: {/response/participantCount: "1"}}
  - call: end
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS, messageKey: sentEndMeetingRequest}
  # akka-apps logs the users out and marks the meeting ended in two
  # writes, users first: wait for both.
  - graphql: {as: ann, query: "query getMeetingEndData { user_current { currentlyInMeeting loggedOut meeting { ended endedReasonCode } } }"}
    eventually: {within: 5s, every: 300ms, until: {jsonpath: {"$.data.user_current[0].loggedOut": "true", "$.data.user_current[0].meeting.ended": "true"}}}
    expect:
      jsonpath:
        "$.data.user_current[0].currentlyInMeeting": "false"
        "$.data.user_current[0].loggedOut": "true"
        "$.data.user_current[0].meeting.ended": "true"
        "$.data.user_current[0].meeting.endedReasonCode": ENDED_FROM_API
  - bus: {name: DisconnectAllClientsSysMsg, meetingId: "${intId}", within: 5s}
    expect: {jsonpath: {$.core.body.reason: meeting-destroyed}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
