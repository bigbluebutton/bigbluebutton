# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A password, when given, has 2 to 64 characters. end rejects one outside
# that and doesn't end the meeting. The absence check waits until akka-apps
# has created the meeting, since an end that reaches it earlier is lost
# anyway.
id: end.validation.password-length
title: end rejects a password of ${len} characters
endpoint: end
class: contract
tags: [ci]
requires: [akka, bus]
variants:
  - {id: too-short, vars: {len: 1}}
  - {id: too-long, vars: {len: 65}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: End, moderatorPW: mp}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: end
    params: {meetingID: "${uid}", password: '${repeat("z", len)}'}
    expect: {returncode: FAILED, messageKey: invalidPassword}
  # As long as the other end cases wait for the meeting to end.
  - bus: {name: MeetingEndingEvtMsg, meetingId: "${intId}", within: 5s}
    expect: {absent: true}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
