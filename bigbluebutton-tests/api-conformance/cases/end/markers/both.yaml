# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A recorded meeting that also keeps its events leaves both markers when
# it ends: recording/status/recorded/ for its recording and
# recording/status/ended/ for its events.
id: end.markers.both
title: An ended recorded meeting that keeps its events leaves both markers
endpoint: end
class: contract
tags: [ci]
requires: [akka, bus, fs]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Markers, record: "true", meetingKeepEvents: "true"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  # An end that reaches akka-apps before it has the meeting is lost.
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    golden: off
  - fs: {path: "recording/status/recorded/${intId}.done", within: 10s}
    expect: {exists: true}
  - fs: {path: "recording/status/ended/${intId}.done", within: 2s}
    expect: {exists: true}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
