# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# getMeetings lists a meeting's breakout rooms as meetings of their own,
# with isBreakout, parentMeetingID and sequence, and the parent lists them
# under breakoutRooms. Recordings keep only the case's own meeting (the
# rooms' meetingIDs don't hold the case's), so the rooms are checked here.
id: getMeetings.breakout-rooms.listed
title: getMeetings lists breakout rooms and their parent's list
endpoint: getMeetings
class: contract
tags: [ci, presence]
requires: [akka, presence, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Breakout parent}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence:
      action: join
      as: ann
      args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}
    golden: off
  # Two rooms, as the client asks for them: akka-apps wants at least two.
  - graphql:
      as: ann
      query: >-
        mutation CreateBreakouts($record: Boolean!, $notes: Boolean!, $slides: Boolean!, $duration: Int!,
        $invite: Boolean!, $lock: Boolean!, $rooms: [BreakoutRoom]!) {
        breakoutRoomCreate(record: $record, captureNotes: $notes, captureSlides: $slides, durationInSeconds: $duration,
        sendInviteToModerators: $invite, inheritLockSettings: $lock, rooms: $rooms) }
      variables:
        record: false
        notes: false
        slides: false
        duration: 600
        invite: false
        lock: false
        rooms:
          - name: Room 1
            shortName: Room 1
            sequence: 1
            isDefaultName: true
            freeJoin: false
            users: []
            captureNotesFilename: ""
            captureSlidesFilename: ""
            allPages: true
            presId: ""
          - name: Room 2
            shortName: Room 2
            sequence: 2
            isDefaultName: true
            freeJoin: false
            users: []
            captureNotesFilename: ""
            captureSlidesFilename: ""
            allPages: true
            presId: ""
    golden: off
  - bus: {name: BreakoutRoomStartedEvtMsg, meetingId: "${intId}", within: 15s}
    golden: off
    expect:
      jsonpath: {$.core.body.breakout.sequence: "1"}
    capture: {r1int: $.core.body.breakout.breakoutId}
  - bus: {name: BreakoutRoomStartedEvtMsg, meetingId: "${intId}", within: 15s}
    golden: off
    expect:
      jsonpath: {$.core.body.breakout.sequence: "2"}
    capture: {r2int: $.core.body.breakout.breakoutId}
  # Each room's meetingID, as bbb-web gave it.
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${r1int}", within: 5s}
    golden: off
    capture: {r1ext: $.core.body.props.meetingProp.extId}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${r2int}", within: 5s}
    golden: off
    capture: {r2ext: $.core.body.props.meetingProp.extId}
  - call: getMeetings
    expect:
      returncode: SUCCESS
      xpath:
        count(/response/meetings/meeting[parentMeetingID = '${intId}']): "2"
        count(/response/meetings/meeting[parentMeetingID = '${intId}'][isBreakout = 'true']): "2"
        /response/meetings/meeting[meetingID = '${r1ext}']/sequence: "1"
        /response/meetings/meeting[meetingID = '${r2ext}']/sequence: "2"
        count(/response/meetings/meeting[meetingID = '${uid}']/breakoutRooms/breakout): "2"
teardown:
  # Ending the parent ends its rooms. Again until bbb-web no longer knows
  # the meeting: an end that reaches akka-apps before the create does is
  # lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
