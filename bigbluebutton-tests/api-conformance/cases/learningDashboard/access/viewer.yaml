# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Only a moderator gets the learning dashboard data.
id: learningDashboard.access.viewer
title: learningDashboard refuses a viewer
endpoint: learningDashboard
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Dashboard}
    golden: off
    expect: {returncode: SUCCESS}
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: viewer}}
    golden: off
    capture: {annToken: $.sessionToken}
  - call: learningDashboard
    client: ann
    params: {sessionToken: "${annToken}"}
    expect: {format: json, returncode: FAILED, message: Access denied}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
