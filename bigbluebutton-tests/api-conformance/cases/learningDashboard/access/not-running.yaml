# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# learningDashboard answers only while the meeting is running, that is
# while someone is in it. A join that only redirects puts nobody there.
id: learningDashboard.access.not-running
title: learningDashboard refuses a meeting nobody is in
endpoint: learningDashboard
class: contract
tags: [ci]
requires: [akka]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Dashboard}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    capture: {annId: /response/user_id, annToken: /response/session_token}
  - call: learningDashboard
    client: ann
    params: {sessionToken: "${annToken}"}
    expect: {format: json, returncode: FAILED, message: Meeting not found}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
