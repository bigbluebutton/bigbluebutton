# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A meeting's sessions go once akka-apps reports the meeting ended. end waits
# until akka-apps has created the meeting: an end that reaches akka-apps
# before the create does is lost.
id: getSessions.list.after-end
title: getSessions stops listing an ended meeting's sessions
endpoint: getSessions
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Sessions}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: end
    params: {meetingID: "${uid}"}
    golden: off
    expect: {returncode: SUCCESS}
  - call: getSessions
    eventually:
      within: 5s
      every: 100ms
      until:
        xpath: {"/response/sessions/meeting[meetingID='${intId}']": {count: 0}}
    expect:
      returncode: SUCCESS
      xpath: {"/response/sessions/meeting[meetingID='${intId}']": {count: 0}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
