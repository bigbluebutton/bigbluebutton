# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# bbb-web validates a session token with its control characters removed,
# then looks it up as sent. A token with a control character added must
# get an answer, not a server error. A defect: bbb-web answers 500
# (expectations/bbb-web.yaml).
id: stuns.session.control-character
title: stuns answers a session token with a control character without a server error
endpoint: stuns
class: defect
tags: [ci]
requires: [akka]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Control}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    capture: {annId: /response/user_id, annToken: /response/session_token}
  - call: stuns
    client: ann
    raw_query: 'sessionToken=${annToken}%01'
    expect: {status: 200, format: json}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
