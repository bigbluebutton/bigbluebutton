# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A document URL that isn't a well-formed URL is refused as
# invalidPresentationUrl. That check is on the URL's syntax only: which URLs
# bbb-web will fetch is decided later (insertDocument.success.refused-urls).
id: insertDocument.errors.invalid-url
title: insertDocument refuses a document URL that isn't well-formed (${case})
endpoint: insertDocument
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: space, vars: {case: a space, url: 'https://sink.test:8444/a b.pdf'}}
  - {id: bad-escape, vars: {case: a bad percent escape, url: 'https://sink.test:8444/a%zz.pdf'}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Insert document}
    golden: off
    expect: {returncode: SUCCESS}
  - call: insertDocument
    method: POST
    params: {meetingID: "${uid}"}
    body: {xml: '<modules><module name="presentation"><document url="${url}"/></module></modules>'}
    expect: {returncode: FAILED, messageKey: invalidPresentationUrl}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
