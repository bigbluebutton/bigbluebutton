# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A document bbb-web can't use is dropped once it has it, and only that
# document: one of a type it doesn't take (svg), one whose content doesn't
# match its extension (a PDF named .pptx), one over maxFileSizeUpload
# (30 MB; the sink makes it), and base64 that doesn't decode to a document.
# The control document beside them goes on to conversion. What else bbb-web reports
# about each is a conversion matter (the conversion cases). The answer
# doesn't say a document was dropped, so it is recorded but not compared.
id: insertDocument.success.dropped-documents
title: insertDocument drops a document it can't use, and takes the others
endpoint: insertDocument
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  # The meeting starts with a small image rather than the server's default
  # presentation, which takes longer to convert.
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Insert document}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}-start/fixtures/presentations/image.png" filename="start.png"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - call: insertDocument
    method: POST
    params: {meetingID: "${uid}"}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/drawing.svg"/><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf" filename="spoof.pptx"/><document url="${sinkUrl}/${uid}/fixtures/generated/large.pdf?_size=31000000"/><document name="garbled.pdf">!!not base64!!</document><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf" filename="control.pdf"/></module></modules>'}
    golden: document
    expect: {returncode: SUCCESS}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 180s}
    select: [$.core.body.common.presentationName]
    expect:
      jsonpath: {$.core.body.common.presentationName: "control.pdf"}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 5s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: "drawing.svg"}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 1s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: "spoof.pptx"}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 1s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: "large.pdf"}
  - bus: {name: PresentationConversionStartedSysPubMsg, meetingId: "${intId}", within: 1s}
    golden: off
    expect:
      absent: true
      jsonpath: {$.core.body.common.presentationName: "garbled.pdf"}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
