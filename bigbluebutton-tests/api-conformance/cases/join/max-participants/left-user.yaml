# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A user who left still holds their maxParticipants seat until bbb-web
# forgets them: usersTimeout (60 seconds as shipped) after akka-apps
# removed them, at bbb-web's next cleanup (every 15 seconds), so 60 to 75
# seconds. akka-apps removes a user 10 to 20 seconds after they leave.
# meetingExpireWhenLastUserLeftInMinutes is long enough that the empty
# meeting doesn't end first. left-user-short-timeout.yaml has a shorter
# usersTimeout. create.tsx's maxParticipants counts the users in the
# meeting "at the same time", and doesn't say a user who left keeps a
# seat, so this is compat.
id: join.max-participants.left-user
title: A user who left keeps their maxParticipants seat for usersTimeout
endpoint: join
class: compat
tags: [slow, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Max participants, maxParticipants: "1", meetingExpireWhenLastUserLeftInMinutes: "10"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}}
    golden: off
    capture: {annId: $.userId}
  # bbb-web learns of the join from akka-apps a moment later, seconds
  # after a restart.
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    eventually: {within: 10s, every: 200ms, until: {xpath: {/response/participantCount: "1"}}}
    expect: {xpath: {/response/participantCount: "1"}}
  - call: join
    params: {meetingID: "${uid}", fullName: Bob, role: viewer, redirect: "false"}
    expect: {returncode: FAILED, messageKey: maxParticipantsReached}
  - presence: {action: leave, as: ann}
    golden: off
  # akka-apps removes Ann, and tells bbb-web she left.
  - bus: {name: UserLeftMeetingEvtMsg, meetingId: "${intId}", within: 25s}
    golden: off
    expect: {jsonpath: {$.core.body.intId: "${annId}"}}
  - call: join
    params: {meetingID: "${uid}", fullName: Bob, role: viewer, redirect: "false"}
    golden: off
    expect: {returncode: FAILED, messageKey: maxParticipantsReached}
  # Well short of the earliest the seat can free.
  - wait: 50s
  - call: join
    params: {meetingID: "${uid}", fullName: Bob, role: viewer, redirect: "false"}
    golden: off
    expect: {returncode: FAILED, messageKey: maxParticipantsReached}
  - call: join
    params: {meetingID: "${uid}", fullName: Bob, role: viewer, redirect: "false"}
    eventually: {within: 30s, every: 1s, until: {returncode: SUCCESS}}
    expect: {returncode: SUCCESS, messageKey: successfullyJoined}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
