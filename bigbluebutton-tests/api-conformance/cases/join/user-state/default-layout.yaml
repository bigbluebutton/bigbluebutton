# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# join accepts defaultLayout, though nothing reads it any more: its only
# reader was the /enter endpoint, which 3.0 removed.
id: join.user-state.default-layout
title: join accepts defaultLayout
endpoint: join
class: compat
tags: [ci]
requires: [akka]
steps:
  - call: create
    params: {meetingID: "${uid}", name: User state}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, role: viewer, redirect: "false", defaultLayout: SMART_LAYOUT}
    expect: {returncode: SUCCESS, messageKey: successfullyJoined}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
