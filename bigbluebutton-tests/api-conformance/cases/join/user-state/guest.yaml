# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# join's guest and auth params, as the user in the meeting has them, under
# the shipped ALWAYS_ACCEPT policy. Without the guest param a user is
# authenticated; with it, guest=false included, they aren't, unless
# auth=true. auth=false makes any user unauthenticated.
id: join.user-state.guest
title: "A user who joins with ${params} has guest and authed as join set them"
endpoint: join
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - {id: guest, vars: {params: guest=true, guest: "true", auth: null, isGuest: "true", authed: "false"}}
  - {id: guest-auth, vars: {params: guest=true and auth=true, guest: "true", auth: "true", isGuest: "true", authed: "true"}}
  - {id: not-guest, vars: {params: guest=false, guest: "false", auth: null, isGuest: "false", authed: "false"}}
  - {id: auth-false, vars: {params: auth=false, guest: null, auth: "false", isGuest: "false", authed: "false"}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: User state}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: viewer, guest: "${guest}", auth: "${auth}"}}
    golden: off
  - graphql: {as: ann, query: "query Me { user_current { guest authed guestStatus } }"}
    expect:
      jsonpath:
        "$.data.user_current[0].guest": "${isGuest}"
        "$.data.user_current[0].authed": "${authed}"
        "$.data.user_current[0].guestStatus": ALLOW
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
