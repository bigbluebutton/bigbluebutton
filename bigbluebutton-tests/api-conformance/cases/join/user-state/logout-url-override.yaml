# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# join's logoutURL replaces create's for the user who joins with it.
id: join.user-state.logout-url-override
title: join's logoutURL replaces create's
endpoint: join
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: User state, logoutURL: "https://example.com/meeting"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator, logoutURL: "https://example.com/user"}}
    golden: off
  - graphql: {as: ann, query: "query Me { user_current { logoutUrl } }"}
    expect: {jsonpath: {"$.data.user_current[0].logoutUrl": "https://example.com/user"}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
