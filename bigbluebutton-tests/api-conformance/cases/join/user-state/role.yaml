# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# join's role param is case-insensitive: the user who enters has the role
# it names. join.role.param checks the registration on the bus; this
# checks the user in the meeting.
id: join.user-state.role
title: "A user who joins with role=${param} is a ${role} in the meeting"
endpoint: join
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - {id: moderator, vars: {param: Moderator, role: MODERATOR, mod: "true"}}
  - {id: viewer, vars: {param: vIeWeR, role: VIEWER, mod: "false"}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: User state}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: "${param}"}}
    expect: {jsonpath: {$.role: "${role}", $.isModerator: "${mod}"}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
