# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A password must be 2 to 64 characters long. One outside that range is a
# validation error, before it is compared with the meeting's passwords.
id: join.validation.password-length
title: join rejects a password of ${len} characters
endpoint: join
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: too-short, vars: {len: 1}}
  - {id: too-long, vars: {len: 65}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Join validation}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, password: '${repeat("p", len)}'}
    expect: {status: 302, redirect: {query: {errors: {contains: '"message":"Invalid password","key":"invalidPassword"'}}}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
