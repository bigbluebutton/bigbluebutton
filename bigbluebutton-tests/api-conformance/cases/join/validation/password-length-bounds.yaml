# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The shortest and the longest password join accepts (password-length.yaml has
# one character fewer and more), as the meeting's moderator password.
id: join.validation.password-length-bounds
title: join accepts a password of ${len} characters
endpoint: join
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: shortest, vars: {len: 2}}
  - {id: longest, vars: {len: 64}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Join validation, moderatorPW: '${repeat("p", len)}', attendeePW: ap}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, password: '${repeat("p", len)}', redirect: "false"}
    expect: {returncode: SUCCESS, messageKey: successfullyJoined}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
