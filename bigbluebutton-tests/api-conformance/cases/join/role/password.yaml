# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Without a role param, the password decides the role: the moderator password
# gives a moderator, the attendee password a viewer. When both passwords are
# the same, the user is a moderator.
id: join.role.password
title: join with the ${which} password registers a ${role}
endpoint: join
class: contract
tags: [ci]
requires: [akka, bus]
variants:
  - {id: moderator, vars: {which: moderator, moderatorPW: mp, attendeePW: ap, password: mp, role: MODERATOR}}
  - {id: attendee, vars: {which: attendee, moderatorPW: mp, attendeePW: ap, password: ap, role: VIEWER}}
  - {id: same, vars: {which: shared, moderatorPW: pw, attendeePW: pw, password: pw, role: MODERATOR}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Join role, moderatorPW: "${moderatorPW}", attendeePW: "${attendeePW}"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, password: "${password}", redirect: "false"}
    expect: {returncode: SUCCESS}
  - bus: {name: UserRegisteredRespMsg, meetingId: "${intId}", within: 5s}
    expect:
      jsonpath: {$.core.body.role: "${role}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
