# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Under ALWAYS_DENY only moderators are let in: every viewer is refused,
# guest or not.
# With authenticatedGuest on (the default), a moderator is always let in.
# A refusal (guestDeniedAccess) is checked by its expect only.
id: join.guest.always-deny
title: "join under ALWAYS_DENY: ${who}"
endpoint: join
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: guest-moderator, vars: {who: a guest moderator, role: moderator, guest: "true", auth: null, rc: SUCCESS, key: successfullyJoined, status: ALLOW, golden: compare}}
  - {id: guest, vars: {who: a guest viewer, role: viewer, guest: "true", auth: null, rc: FAILED, key: guestDeniedAccess, status: null, golden: off}}
  - {id: viewer, vars: {who: a viewer without the guest param, role: viewer, guest: null, auth: null, rc: FAILED, key: guestDeniedAccess, status: null, golden: off}}
  - {id: not-guest, vars: {who: a viewer with guest=false, role: viewer, guest: "false", auth: null, rc: FAILED, key: guestDeniedAccess, status: null, golden: off}}
  - {id: not-guest-auth, vars: {who: a viewer with guest=false and auth=true, role: viewer, guest: "false", auth: "true", rc: FAILED, key: guestDeniedAccess, status: null, golden: off}}
  - {id: guest-one, class: compat, tags: [triage], vars: {who: a viewer with guest=1, role: viewer, guest: "1", auth: null, rc: FAILED, key: guestDeniedAccess, status: null, golden: off}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Guest policy, guestPolicy: ALWAYS_DENY}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, role: "${role}", guest: "${guest}", auth: "${auth}", redirect: "false"}
    golden: "${golden}"
    expect:
      returncode: "${rc}"
      messageKey: "${key}"
      xpath: {/response/guestStatus: "${status}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
