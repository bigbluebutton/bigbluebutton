# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A joined user reads a page's SVG, thumbnail and text the way the client
# does: at the page URL bbb-web gave out, which carries the page's
# pageToken, with the user's sessionToken added and the session cookie
# join set. nginx serves these files from disk once checkAuthorization
# allows the request, with CORS headers. (PNGs: presentation.slides.png-missing.)
id: presentation.slides.served
title: A joined user reads a page's SVG, thumbnail and text with the page's token
endpoint: presentation
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Slides}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {annToken: /response/session_token}
  # The page URLs bbb-web hands akka-apps, which reach the client in its
  # presentation data: each carries the page's pageToken.
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 60s}
    golden: off
    expect:
      jsonpath: {$.core.body.presentation.name: two-pages.pdf}
    capture:
      presId: $.core.body.presentation.id
      page1: "$.core.body.presentation.pages[?@.num==1].svgUri"
      page2: "$.core.body.presentation.pages[?@.num==2].svgUri"
  - url: '${baseUrl}/bigbluebutton/presentation/${intId}/${intId}/${presId}/svg/1?pageToken=${match(page1, "pageToken=([0-9a-f]+)")}&sessionToken=${annToken}'
    client: ann
    golden: off
    expect:
      status: 200
      headers:
        Content-Type: image/svg+xml
        Access-Control-Allow-Origin: "*"
        Access-Control-Allow-Credentials: "true"
  - url: '${baseUrl}/bigbluebutton/presentation/${intId}/${intId}/${presId}/thumbnail/1?pageToken=${match(page1, "pageToken=([0-9a-f]+)")}&sessionToken=${annToken}'
    client: ann
    golden: off
    expect:
      status: 200
      headers:
        Content-Type: image/png
        Access-Control-Allow-Origin: "*"
        Access-Control-Allow-Credentials: "true"
  - url: '${baseUrl}/bigbluebutton/presentation/${intId}/${intId}/${presId}/textfiles/1?pageToken=${match(page1, "pageToken=([0-9a-f]+)")}&sessionToken=${annToken}'
    client: ann
    golden: off
    expect:
      status: 200
      headers:
        Content-Type: text/plain
        Access-Control-Allow-Origin: "*"
        Access-Control-Allow-Credentials: "true"
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
