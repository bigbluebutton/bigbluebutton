# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# bbb-web lists a presentation's pages for a joined user of its meeting:
# slides gives each page's number and names, in XML.
id: presentation.slides.list
title: A joined user lists a presentation's slides
endpoint: presentation
class: contract
tags: [ci, conversion]
requires: [akka, bus, callbacks, presentation-conversion]
steps:
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Slides}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/fixtures/presentations/two-pages.pdf"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {annToken: /response/session_token}
  # The page URLs bbb-web hands akka-apps, which reach the client in its
  # presentation data: each carries the page's pageToken.
  - bus: {name: PresentationConversionCompletedSysPubMsg, meetingId: "${intId}", within: 180s}
    golden: off
    expect:
      jsonpath: {$.core.body.presentation.name: two-pages.pdf}
    capture:
      presId: $.core.body.presentation.id
      page1: "$.core.body.presentation.pages[?@.num==1].svgUri"
      page2: "$.core.body.presentation.pages[?@.num==2].svgUri"
  - route: presentation-slides
    client: ann
    pathParams: {conference: "${intId}", room: "${intId}", presentationName: "${presId}"}
    params: {sessionToken: "${annToken}"}
    expect: {status: 200, xpath: {/conference/presentation/slides/@count: "2"}}
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
