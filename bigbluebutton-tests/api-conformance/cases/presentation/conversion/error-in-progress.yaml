# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A document whose conversion fails after bbb-web took it (too many pages,
# or LibreOffice can't convert it) keeps uploadInProgress true on the
# presenter's row, next to its error. A defect (#26795,
# expectations/bbb-web.yaml): this case expects the row to say the upload
# is over.
id: presentation.conversion.error-in-progress
title: A document that failed to convert isn't shown as in progress
endpoint: presentation
class: defect
tags: [ci, conversion, presence]
requires: [akka, bus, presence, callbacks, presentation-conversion]
steps:
  # A one-page image instead of the 15-page default presentation, so that
  # the suite's conversions stay short.
  - call: create
    method: POST
    params: {meetingID: "${uid}", name: Conversion}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}-start/fixtures/presentations/image.png" filename="start.png"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  # Only the presenter sees the presentation's rows.
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}}
    golden: off
  - call: insertDocument
    method: POST
    params: {meetingID: "${uid}"}
    body: {xml: '<modules><module name="presentation"><document url="${sinkUrl}/${uid}/conversion/pdf-201-pages" filename="long.pdf"/><document url="${sinkUrl}/${uid}/fixtures/presentations/no-content.docx" filename="broken.docx"/></module></modules>'}
    golden: off
    expect: {returncode: SUCCESS}
  - graphql:
      as: ann
      query: 'query Row($name: String!) { pres_presentation(where: {name: {_eq: $name}}) { name uploadErrorMsgKey uploadInProgress } }'
      variables: {name: long.pdf}
    golden: off
    eventually:
      within: 30s
      every: 500ms
      until:
        jsonpath:
          "$.data.pres_presentation[0].uploadErrorMsgKey": PAGE_COUNT_EXCEEDED
          "$.data.pres_presentation[0].uploadInProgress": false
    expect:
      jsonpath:
        "$.data.pres_presentation[0].uploadErrorMsgKey": PAGE_COUNT_EXCEEDED
        "$.data.pres_presentation[0].uploadInProgress": false
  - graphql:
      as: ann
      query: 'query Row($name: String!) { pres_presentation(where: {name: {_eq: $name}}) { name uploadErrorMsgKey uploadInProgress } }'
      variables: {name: broken.docx}
    golden: off
    eventually:
      within: 30s
      every: 500ms
      until:
        jsonpath:
          "$.data.pres_presentation[0].uploadErrorMsgKey": OFFICE_DOC_CONVERSION_FAILED
          "$.data.pres_presentation[0].uploadInProgress": false
    expect:
      jsonpath:
        "$.data.pres_presentation[0].uploadErrorMsgKey": OFFICE_DOC_CONVERSION_FAILED
        "$.data.pres_presentation[0].uploadInProgress": false
teardown:
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
