# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# What sendChatMessage posts must meet the limits it checks: a sender name
# of at most 255 characters, "System" when userName is blank. bbb-web
# checks userName with surrounding whitespace removed, so each one below
# passes the check. A defect: bbb-web posts userName as sent
# (expectations/bbb-web.yaml).
id: sendChatMessage.params.raw-user-name
title: sendChatMessage posts ${what} within the limits it checks
endpoint: sendChatMessage
class: defect
tags: [ci, presence]
requires: [akka, presence]
variants:
  - id: blank
    vars: {what: a blank userName as System, lead: "", count: 3, regex: '^System$'}
  - id: padded
    vars: {what: a userName padded with spaces, lead: u, count: 300, regex: '^.{1,255}$'}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Chat}
    golden: off
    expect: {returncode: SUCCESS}
  # sendChatMessage needs a running meeting: someone in it.
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
  # bbb-web learns of the join from akka-apps a moment later.
  - call: sendChatMessage
    raw_query: 'meetingID=${uid}&message=Hello&userName=${lead}${repeat("%20", count)}'
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    expect: {returncode: SUCCESS}
  - graphql: {as: ann, query: "query Chat { chat_message_public { message senderName messageType } }"}
    eventually: {within: 5s, every: 500ms, until: {jsonpath: {"$.data.chat_message_public[?(@.messageType == 'api')]": {exists: true}}}}
    expect:
      jsonpath:
        "$.data.chat_message_public[?(@.messageType == 'api')].senderName": {regex: "${regex}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
