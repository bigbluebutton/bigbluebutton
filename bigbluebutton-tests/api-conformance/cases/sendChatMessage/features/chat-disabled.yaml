# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# With chat in disabledFeatures, bbb-web still answers SUCCESS, and the
# message isn't posted: akka-apps drops it. Whether bbb-api should refuse
# instead is still to be decided, hence the triage tag.
id: sendChatMessage.features.chat-disabled
title: sendChatMessage to a meeting with chat disabled posts nothing
endpoint: sendChatMessage
class: compat
tags: [ci, presence, triage]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Chat, disabledFeatures: chat}
    golden: off
    expect: {returncode: SUCCESS}
  # sendChatMessage needs a running meeting: someone in it.
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
  # bbb-web learns of the join from akka-apps a moment later.
  - call: sendChatMessage
    params: {meetingID: "${uid}", message: Hello}
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    golden: document
    expect: {returncode: SUCCESS}
  # Long enough for a posted message to show (sendChatMessage.chat.stored
  # sees it well within this).
  - wait: 3s
  - graphql: {as: ann, query: "query Chat { chat_message_public { message senderName messageType } }"}
    golden: document
    expect:
      jsonpath:
        "$.data.chat_message_public[?(@.messageType == 'api')]": {absent: true}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
