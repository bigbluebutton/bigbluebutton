# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# getJoinUrl signs enforceLayout and sessionName when the request gives
# them, after bbb-web's own params. replaceSession is read as a boolean:
# anything but "true" adds nothing (getJoinUrl.options.replace-session has
# "true").
id: getJoinUrl.options.session
title: getJoinUrl signs ${what}
endpoint: getJoinUrl
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - id: enforce-layout
    vars: {signedRole: VIEWER, what: enforceLayout, query: '&enforceLayout=VIDEO_FOCUS', signed: '&enforceLayout=VIDEO_FOCUS'}
  - id: session-name
    vars: {signedRole: VIEWER, what: sessionName, query: '&sessionName=Phone', signed: '&sessionName=Phone'}
  - id: replace-session-false
    vars: {signedRole: VIEWER, what: nothing for replaceSession=false, query: '&replaceSession=false', signed: ''}
  - id: replace-session-other
    vars: {signedRole: VIEWER, what: nothing for replaceSession=yes, query: '&replaceSession=yes', signed: ''}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Userdata}
    golden: off
    expect: {returncode: SUCCESS}
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: "viewer"}}
    golden: off
    capture: {annId: $.userId, annToken: $.sessionToken}
  # bbb-web learns of the join from akka-apps a moment later.
  - call: getJoinUrl
    client: ann
    raw_query: 'sessionToken=${annToken}${query}'
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    expect:
      format: json
      returncode: SUCCESS
      jsonpath:
        $.response.url: {regex: '^\Q${baseUrl}\E/bigbluebutton/api/join\?&?fullName=Ann&meetingID=${uid}&role=${signedRole}&redirect=true&existingUserID=${annId}\Q${signed}\E&checksum=[0-9a-f]{128}$'}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
