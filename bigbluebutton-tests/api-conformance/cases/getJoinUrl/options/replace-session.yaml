# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# With replaceSession=true, getJoinUrl signs the caller's own session
# token as replaceSessionToken, right after bbb-web's own params, then
# sessionName and enforceLayout.
id: getJoinUrl.options.replace-session
title: getJoinUrl signs the caller's session token as replaceSessionToken
endpoint: getJoinUrl
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Userdata}
    golden: off
    expect: {returncode: SUCCESS}
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: "viewer"}}
    golden: off
    capture: {annId: $.userId, annToken: $.sessionToken}
  # bbb-web learns of the join from akka-apps a moment later.
  - call: getJoinUrl
    client: ann
    raw_query: 'sessionToken=${annToken}&enforceLayout=VIDEO_FOCUS&sessionName=Phone&replaceSession=true'
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    expect:
      format: json
      returncode: SUCCESS
      jsonpath:
        $.response.url: {regex: '^\Q${baseUrl}\E/bigbluebutton/api/join\?&?fullName=Ann&meetingID=${uid}&role=VIEWER&redirect=true&existingUserID=${annId}&replaceSessionToken=${annToken}&sessionName=Phone&enforceLayout=VIDEO_FOCUS&checksum=[0-9a-f]{128}$'}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
