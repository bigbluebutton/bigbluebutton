# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# "all" in getJoinUrlUserdataBlocklist, in any case and with spaces around
# it (the userdata-blocklist-all profile: "bbb_record_video, ALL "), drops
# every userdata param of a viewer, and none of a moderator's.
id: getJoinUrl.userdata.blocklist-all
title: getJoinUrl drops all of a viewer's userdata when the blocklist says all
endpoint: getJoinUrl
class: contract
tags: [presence, disruptive]
requires: [akka, presence]
profile: userdata-blocklist-all
variants:
  - id: viewer
    vars: {role: viewer, signedRole: VIEWER, signed: ''}
  - id: moderator
    vars: {role: moderator, signedRole: MODERATOR, signed: '&userdata-lang=fr&userdata-bbb_custom_style_url=https%3A%2F%2Fexample.com%2Fs.css'}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Userdata}
    golden: off
    expect: {returncode: SUCCESS}
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: "${role}"}}
    golden: off
    capture: {annId: $.userId, annToken: $.sessionToken}
  # bbb-web learns of the join from akka-apps a moment later.
  - call: getJoinUrl
    client: ann
    raw_query: 'sessionToken=${annToken}&userdata-lang=fr&userdata-bbb_custom_style_url=https%3A%2F%2Fexample.com%2Fs.css'
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    expect:
      format: json
      returncode: SUCCESS
      jsonpath:
        $.response.url: {regex: '^\Q${baseUrl}\E/bigbluebutton/api/join\?&?fullName=Ann&meetingID=${uid}&role=${signedRole}&redirect=true&existingUserID=${annId}\Q${signed}\E&checksum=[0-9a-f]{128}$'}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
