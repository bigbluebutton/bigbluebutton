# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Which userdata params getJoinUrl signs into the join URL, as
# GetJoinUrlSpec's tables have them. A name must be made of [A-Za-z0-9_.]
# after "userdata-", for every role: a trailing '-', '&', '=', ':' or an
# empty name drop the param. getJoinUrlUserdataBlocklist (by default
# bbb_record_permission, bbb_record_video, bbb_transparent_listen_only,
# bbb_multi_user_pen_only, bbb_presenter_tools, bbb_multi_user_tools) drops
# a viewer's params whatever the case of the name, and doesn't apply to a
# moderator, whose three spellings of bbb_record_video all stay. Kept params
# follow bbb-web's own, in the order the request sent them, with the value
# encoded once.
id: getJoinUrl.userdata.gate
title: getJoinUrl signs a ${role}'s well-named userdata params that the blocklist allows
endpoint: getJoinUrl
class: contract
tags: [ci, presence]
requires: [akka, presence]
variants:
  - id: viewer
    vars:
      role: viewer
      signedRole: VIEWER
      signed: '&userdata-lang=fr&userdata-bbb_custom_style_url=https%3A%2F%2Fexample.com%2Fs.css'
  - id: moderator
    vars:
      role: moderator
      signedRole: MODERATOR
      signed: '&userdata-lang=fr&userdata-bbb_custom_style_url=https%3A%2F%2Fexample.com%2Fs.css&userdata-bbb_record_video=false&userdata-BBB_RECORD_VIDEO=false&userdata-Bbb_record_video=false'
steps:
  - call: create
    params: {meetingID: "${uid}", name: Userdata}
    golden: off
    expect: {returncode: SUCCESS}
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: "${role}"}}
    golden: off
    capture: {annId: $.userId, annToken: $.sessionToken}
  # bbb-web learns of the join from akka-apps a moment later.
  - call: getJoinUrl
    client: ann
    raw_query: 'sessionToken=${annToken}&userdata-lang=fr&userdata-bbb_custom_style_url=https%3A%2F%2Fexample.com%2Fs.css&userdata-bbb_record_video=false&userdata-BBB_RECORD_VIDEO=false&userdata-Bbb_record_video=false&userdata-bbb_record_video-=false&userdata-bbb_record_video---=false&userdata-a%26b%3Dc%26d=1&userdata-a%3Db=1&userdata-=1&userdata-my%3Atheme=1'
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    expect:
      format: json
      returncode: SUCCESS
      jsonpath:
        $.response.url: {regex: '^\Q${baseUrl}\E/bigbluebutton/api/join\?&?fullName=Ann&meetingID=${uid}&role=${signedRole}&redirect=true&existingUserID=${annId}\Q${signed}\E&checksum=[0-9a-f]{128}$'}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
