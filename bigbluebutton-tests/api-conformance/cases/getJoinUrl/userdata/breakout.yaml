# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A moderator's userdata params skip getJoinUrlUserdataBlocklist, except in
# a breakout room: there the blocklist drops bbb_record_video as it would a
# viewer's, and lang stays. The rooms are made the way the client makes
# them (breakoutRoomCreate); akka-apps wants at least two.
id: getJoinUrl.userdata.breakout
title: getJoinUrl holds a moderator in a breakout room to the userdata blocklist
endpoint: getJoinUrl
class: contract
tags: [ci, presence]
requires: [akka, presence, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Breakouts}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: MODERATOR}}
    golden: off
  - graphql:
      as: ann
      query: >-
        mutation CreateBreakouts($record: Boolean!, $notes: Boolean!, $slides: Boolean!, $duration: Int!,
        $invite: Boolean!, $lock: Boolean!, $rooms: [BreakoutRoom]!) {
        breakoutRoomCreate(record: $record, captureNotes: $notes, captureSlides: $slides, durationInSeconds: $duration,
        sendInviteToModerators: $invite, inheritLockSettings: $lock, rooms: $rooms) }
      variables:
        record: false
        notes: false
        slides: false
        duration: 600
        invite: false
        lock: false
        rooms:
          - {name: Room 1, shortName: Room 1, sequence: 1, isDefaultName: true, freeJoin: false, users: [], captureNotesFilename: "", captureSlidesFilename: "", allPages: true, presId: ""}
          - {name: Room 2, shortName: Room 2, sequence: 2, isDefaultName: true, freeJoin: false, users: [], captureNotesFilename: "", captureSlidesFilename: "", allPages: true, presId: ""}
    golden: off
  - bus: {name: BreakoutRoomStartedEvtMsg, meetingId: "${intId}", within: 15s}
    golden: off
    expect:
      jsonpath: {$.core.body.breakout.sequence: "1"}
    capture: {roomId: $.core.body.breakout.breakoutId}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${roomId}", within: 5s}
    golden: off
    capture: {roomExtId: $.core.body.props.meetingProp.extId}
  - presence: {action: join, as: mod, args: {meetingID: "${roomExtId}", fullName: Mod, role: MODERATOR}}
    golden: off
    capture: {modId: $.userId, modToken: $.sessionToken}
  # bbb-web learns of the join from akka-apps a moment later.
  - call: getJoinUrl
    client: mod
    raw_query: 'sessionToken=${modToken}&userdata-bbb_record_video=false&userdata-lang=fr'
    eventually: {within: 10s, every: 200ms, until: {returncode: SUCCESS}}
    expect:
      format: json
      returncode: SUCCESS
      jsonpath:
        $.response.url: {regex: '^\Q${baseUrl}\E/bigbluebutton/api/join\?&?fullName=Mod&meetingID=${roomExtId}&role=MODERATOR&redirect=true&existingUserID=${modId}&userdata-lang=fr&checksum=[0-9a-f]{128}$'}
teardown:
  - graphql: {as: ann, query: "mutation EndBreakouts { breakoutRoomEndAll }"}
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
