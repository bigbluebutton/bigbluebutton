# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A call without a sessionToken is refused. It should always say why: "You
# must provide a session token", which is what a port should answer. bbb-web
# answers either that or "Invalid session token": UserSessionConstraint's
# @NotNull and UserSessionValidator both reject a missing token, only one
# message is kept, and how often each comes back changes from one bbb-web
# start to the next. A defect case asserting the right message would pass by
# chance on some starts, so this case accepts either until bbb-web always
# gives the first; the answer isn't recorded.
id: getJoinUrl.session.missing-token
title: getJoinUrl without a session token is refused
endpoint: getJoinUrl
class: contract
tags: [ci]
steps:
  - call: getJoinUrl
    golden: off
    expect:
      format: json
      returncode: FAILED
      message: {oneOf: [You must provide a session token, Invalid session token]}
