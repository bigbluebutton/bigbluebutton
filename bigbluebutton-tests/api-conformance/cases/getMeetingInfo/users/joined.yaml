# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Once users are in the meeting, getMeetingInfo shows it running, with
# hasUserJoined, the counters and an attendee per user: the first
# moderator to enter is the presenter, and the client type is HTML5.
# Voice and camera state needs real media, so it isn't checked here.
id: getMeetingInfo.users.joined
title: getMeetingInfo shows the users in the meeting
endpoint: getMeetingInfo
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Users}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator, userID: ann}}
    golden: off
    capture: {annId: $.userId}
  - presence: {action: join, as: vic, args: {meetingID: "${uid}", fullName: Vic, role: viewer, userID: vic}}
    golden: off
    capture: {vicId: $.userId}
  # bbb-web learns of the joins from akka-apps a moment later.
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    eventually: {within: 10s, every: 200ms, until: {xpath: {/response/participantCount: "2"}}}
    expect: {xpath: {/response/participantCount: "2"}}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    expect:
      xpath:
        /response/running: "true"
        /response/hasUserJoined: "true"
        /response/participantCount: "2"
        /response/moderatorCount: "1"
        "/response/attendees/attendee[userID='ann']/role": MODERATOR
        "/response/attendees/attendee[userID='ann']/isPresenter": "true"
        "/response/attendees/attendee[userID='vic']/role": VIEWER
        "/response/attendees/attendee[userID='vic']/isPresenter": "false"
        "/response/attendees/attendee[userID='vic']/clientType": HTML5
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
