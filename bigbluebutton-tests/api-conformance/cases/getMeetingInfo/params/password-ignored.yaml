# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# getMeetingInfo reads only meetingID. Integrations written for older servers
# still send the moderator password; a wrong one changes nothing. The answer
# is recorded by getMeetingInfo.fields.defaults, so not here.
id: getMeetingInfo.params.password-ignored
title: getMeetingInfo ignores a wrong password param
endpoint: getMeetingInfo
class: compat
tags: [ci]
requires: [akka]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Meeting info, moderatorPW: mp}
    golden: off
    expect: {returncode: SUCCESS}
  - call: getMeetingInfo
    params: {meetingID: "${uid}", password: wrong}
    golden: off
    expect:
      returncode: SUCCESS
      xpath: {/response/meetingID: "${uid}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
