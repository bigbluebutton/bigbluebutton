# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# join only registers the user: until the user's client joins the meeting,
# the user isn't an attendee, isn't counted, and the meeting isn't running.
# The check waits until akka-apps has registered the user.
id: getMeetingInfo.fields.registered
title: getMeetingInfo doesn't count a user who is only registered
endpoint: getMeetingInfo
class: contract
tags: [ci]
requires: [akka, bus]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Meeting info}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
  - bus: {name: UserRegisteredRespMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 100ms, until: {xpath: {/response/startTime: {regex: '^[1-9][0-9]*$'}}}}
    expect:
      returncode: SUCCESS
      xpath:
        /response/running: "false"
        /response/hasUserJoined: "false"
        /response/participantCount: "0"
        /response/moderatorCount: "0"
        /response/attendees/attendee: {count: 0}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
