# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# What create was given comes back from getMeetingInfo: the record flag, the
# duration and participant limit, the dial-in number, the passwords and the
# metadata, whose names are lower-cased.
id: getMeetingInfo.fields.from-create
title: getMeetingInfo returns what create was given
endpoint: getMeetingInfo
class: contract
tags: [ci]
requires: [akka]
steps:
  - call: create
    params:
      meetingID: "${uid}"
      name: Meeting info
      record: "true"
      duration: "30"
      maxParticipants: "10"
      dialNumber: 613-555-0100
      attendeePW: ap
      moderatorPW: mp
      meta_Color: blue
      meta_MixedCase: Value
    golden: off
    expect: {returncode: SUCCESS}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    eventually: {within: 5s, every: 100ms, until: {xpath: {/response/startTime: {regex: '^[1-9][0-9]*$'}}}}
    expect:
      returncode: SUCCESS
      xpath:
        /response/recording: "true"
        /response/duration: "30"
        /response/maxUsers: "10"
        /response/dialNumber: 613-555-0100
        /response/attendeePW: ap
        /response/moderatorPW: mp
        /response/metadata/color: blue
        /response/metadata/mixedcase: Value
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
