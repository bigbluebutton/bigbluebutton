# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# deleteRecordings deletes a published or unpublished recording, in every
# format: getRecordings no longer lists it unless asked for state deleted,
# and a second delete doesn't find it. On disk, each format's directory
# moves to deleted/, its metadata.xml giving the deleted state. One
# message announces the delete on from-bbb-web-redis-channel; the second
# delete sends none. Serial, with the recording put back before and after.
id: deleteRecordings.state.delete
title: deleteRecordings deletes ${case}
endpoint: deleteRecordings
class: contract
tags: [ci, serial]
defs:
  # metadata.xml as bbb-web rewrites it: only the state matters here, not
  # how bbb-web lays the file out.
  moved: &moved
    expect:
      contents: {regex: '<state>deleted</state>\s*<published>false</published>'}
    golden: off
variants:
  - {id: published, vars: {case: a published recording, rid: 4d64ff980226cdc0de5d24362bf27a829e1a8ab2-1700025200000, from: published}}
  - {id: unpublished, vars: {case: an unpublished recording, rid: db0c52cbb08b78549a52cb6f29e4d8dc236977bd-1700021600000, from: unpublished}}
steps:
  - restore: {recordings: ["${rid}"]}
  - call: deleteRecordings
    params: {recordID: "${rid}"}
    expect:
      returncode: SUCCESS
      xpath: {/response/deleted: "true"}
  - call: getRecordings
    params: {recordID: "${rid}"}
    expect: {returncode: SUCCESS, messageKey: noRecordings}
  - call: getRecordings
    params: {recordID: "${rid}", state: deleted}
    expect:
      returncode: SUCCESS
      xpath:
        /response/recordings/recording/state: deleted
        /response/recordings/recording/published: "false"
        /response/recordings/recording/playback/format: {count: 2}
  - call: deleteRecordings
    params: {recordID: "${rid}"}
    expect: {returncode: FAILED, messageKey: notFound}
  - <<: *moved
    fs: {path: "deleted/presentation/${rid}/metadata.xml"}
  - <<: *moved
    fs: {path: "deleted/video/${rid}/metadata.xml"}
  - fs: {path: "${from}/presentation/${rid}/metadata.xml"}
    expect: {exists: false}
  - fs: {path: "${from}/video/${rid}/metadata.xml"}
    expect: {exists: false}
  - bus: {name: DeletedRecordingSysMsg, meetingId: "${rid}", within: 3s}
    select: [$.core.header.name, $.core.body.recordId]
    expect: {count: 1}
teardown:
  - restore: {recordings: ["${rid}"]}
