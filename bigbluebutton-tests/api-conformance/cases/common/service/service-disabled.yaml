# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# serviceEnabled is read only by ApiController.beforeInterceptor, which the
# Grails 8 build never runs. This records what an API call does with the
# service turned off, until it is decided whether that is intended (triage).
id: getMeetings.service.disabled
title: An API call with serviceEnabled=false
endpoint: getMeetings
class: compat
tags: [disruptive, triage]
profile: service-disabled
steps:
  - call: getMeetings
    golden: document
