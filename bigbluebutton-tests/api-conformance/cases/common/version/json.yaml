# yaml-language-server: $schema=../../../runner/schema/case.schema.json
id: version.fields.json
title: Content-Type application/json gets a JSON version response; a charset does not
endpoint: version
class: contract
tags: [ci]
# bbb-web compares the Content-Type exactly, so a charset gets XML. That is a
# quirk, not documented behaviour (compat): bbb-api answers the same unless
# it is decided otherwise.
variants:
  - {id: json, vars: {ct: application/json, fmt: json}}
  - {id: charset, class: compat, vars: {ct: "application/json; charset=utf-8", fmt: xml}}
steps:
  - call: ""
    headers: {Content-Type: "${ct}"}
    expect:
      returncode: SUCCESS
      format: "${fmt}"
