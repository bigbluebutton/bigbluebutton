# The methods this route maps (UrlMappings.groovy). Every method sends the same request,
# chosen so that the endpoint's own handler answers with one deterministic error.
id: updateRecordings.method.allowed
title: updateRecordings answers ${method} with its own handler
endpoint: updateRecordings
class: contract
tags: [ci]
variants:
  - {id: get, vars: {method: GET}}
  - {id: post, vars: {method: POST}}
steps:
  - call: updateRecordings
    method: "${method}"
    params: {recordID: "${uid}"}
