# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The methods this route maps (UrlMappings.groovy). Each sends the same stateless,
# deterministic request, which gets the endpoint's own answer rather than the fallback
# an unmapped method gets: expect pins that answer, the recording the rest.
# A filter for an unknown meeting: without one the answer lists every recording.
id: getRecordings.method.allowed
title: getRecordings answers ${method} with its own handler
endpoint: getRecordings
class: contract
tags: [ci]
variants:
  - {id: get, vars: {method: GET}}
  - {id: post, vars: {method: POST}}
steps:
  - call: getRecordings
    method: "${method}"
    params: {meetingID: "${uid}"}
    expect: {returncode: SUCCESS, messageKey: noRecordings}
