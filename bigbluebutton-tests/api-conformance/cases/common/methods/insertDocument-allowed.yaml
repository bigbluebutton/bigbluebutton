# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The methods this route maps (UrlMappings.groovy). Every method sends the same request,
# chosen so that the endpoint's own handler answers with one deterministic error.
id: insertDocument.method.allowed
title: insertDocument answers ${method} with its own handler
endpoint: insertDocument
class: contract
tags: [ci]
variants:
  - {id: post, vars: {method: POST}}
steps:
  - call: insertDocument
    method: "${method}"
    params: {meetingID: "${uid}"}
