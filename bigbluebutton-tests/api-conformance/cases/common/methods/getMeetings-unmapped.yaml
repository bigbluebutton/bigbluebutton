# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Methods this route doesn't map (UrlMappings.groovy), sent with the same request as
# getMeetings-allowed.yaml. What bbb-web answers is recorded, not compared: the intended
# answer is still to be decided (the triage tag).
id: getMeetings.method.unmapped
title: getMeetings called with a method its route doesn't map (${method})
endpoint: getMeetings
class: compat
tags: [triage]
variants:
  - {id: put, vars: {method: PUT}}
  - {id: delete, vars: {method: DELETE}}
  - {id: head, vars: {method: HEAD}}
steps:
  - call: getMeetings
    method: "${method}"
    golden: document
