# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Methods this route doesn't map (UrlMappings.groovy), with the same request as
# insertDocument-allowed.yaml. What bbb-web answers is recorded, not compared: T04 decides
# the intended answer (PLAN.md §3, triage).
id: insertDocument.method.unmapped
title: insertDocument called with a method its route doesn't map (${method})
endpoint: insertDocument
class: compat
tags: [triage]
variants:
  - {id: get, vars: {method: GET}}
  - {id: put, vars: {method: PUT}}
  - {id: delete, vars: {method: DELETE}}
  - {id: head, vars: {method: HEAD}}
steps:
  - call: insertDocument
    method: "${method}"
    params: {meetingID: "${uid}"}
    golden: document
