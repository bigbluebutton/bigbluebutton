# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The methods this route maps (UrlMappings.groovy). Every method sends the same request,
# chosen so that the endpoint's own handler answers with one deterministic error.
id: isMeetingRunning.method.allowed
title: isMeetingRunning answers ${method} with its own handler
endpoint: isMeetingRunning
class: contract
tags: [ci]
variants:
  - {id: get, vars: {method: GET}}
  - {id: post, vars: {method: POST}}
steps:
  - call: isMeetingRunning
    method: "${method}"
    params: {meetingID: "${uid}"}
