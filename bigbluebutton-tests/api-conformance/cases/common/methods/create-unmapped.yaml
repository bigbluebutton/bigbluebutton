# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Methods this route doesn't map (UrlMappings.groovy), with the same request as
# create-allowed.yaml. What bbb-web answers is recorded, not compared: T04 decides
# the intended answer (PLAN.md §3, triage).
id: create.method.unmapped
title: create called with a method its route doesn't map (${method})
endpoint: create
class: compat
tags: [triage]
variants:
  - {id: put, vars: {method: PUT}}
  - {id: delete, vars: {method: DELETE}}
  - {id: head, vars: {method: HEAD}}
steps:
  - call: create
    method: "${method}"
    golden: document
