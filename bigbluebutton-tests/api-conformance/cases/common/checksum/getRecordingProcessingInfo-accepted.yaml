# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A valid checksum is accepted, with the shortest and the longest digest (sha256 signs
# every other case). Algorithms, upper-case hex and placement are covered on getRecordings,
# whose checksum code the recording calls share. The counts depend on what other cases
# left for record-and-playback, so they aren't recorded.
id: getRecordingProcessingInfo.checksum.accepted
title: getRecordingProcessingInfo accepts a valid ${alg} checksum
endpoint: getRecordingProcessingInfo
class: contract
tags: [ci]
variants:
  - {id: sha1, vars: {alg: sha1}}
  - {id: sha512, vars: {alg: sha512}}
steps:
  - call: getRecordingProcessingInfo
    sign: "${alg}"
    golden: off
    expect:
      returncode: SUCCESS
      xpath:
        /response/processing: {oneOf: ["true", "false"]}
