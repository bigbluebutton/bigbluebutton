# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The checksum is checked on this call too, over its own name: a wrong, a missing or
# another call's checksum is rejected. The full set of rejections is on getMeetings.
# A checksum error redirects, like join's other validation errors.
id: join.checksum.rejected
title: join rejects a wrong, missing or other call's checksum
endpoint: join
class: contract
tags: [ci]
defs:
  base: &base {mode: valid, signCall: null}
variants:
  - {id: wrong, vars: {<<: *base, mode: bad}}
  - {id: missing, vars: {<<: *base, mode: none}}
  - {id: other-call, vars: {<<: *base, signCall: getMeetings}}
steps:
  - call: join
    sign: {mode: "${mode}", call: "${signCall}"}
    expect: {status: 302, redirect: {query: {errors: {contains: checksumError}}}}
