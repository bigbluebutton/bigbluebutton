# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The checksum is checked on this call too, over its own name: a wrong, a missing or
# another call's checksum is rejected. More rejections are on getRecordings,
# whose checksum code the recording calls share.
id: getRecordingProcessingInfo.checksum.rejected
title: getRecordingProcessingInfo rejects a wrong, missing or other call's checksum
endpoint: getRecordingProcessingInfo
class: contract
tags: [ci]
defs:
  base: &base {mode: valid, signCall: null}
variants:
  - {id: wrong, vars: {<<: *base, mode: bad}}
  - {id: missing, vars: {<<: *base, mode: none}}
  - {id: other-call, vars: {<<: *base, signCall: getRecordings}}
steps:
  - call: getRecordingProcessingInfo
    sign: {mode: "${mode}", call: "${signCall}"}
    expect:
      returncode: FAILED
      messageKey: checksumError
      xpath:
        /response/processing: {absent: true}
