# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# The checksum is checked on this call too, over its own name: a wrong, a missing or
# another call's checksum is rejected. More rejections are on getMeetings.
id: sendChatMessage.checksum.rejected
title: sendChatMessage rejects a wrong, missing or other call's checksum
endpoint: sendChatMessage
class: contract
tags: [ci]
defs:
  base: &base {mode: valid, signCall: null, msg: '^Checksums do not match$'}
variants:
  - {id: wrong, vars: {<<: *base, mode: bad}}
  - {id: missing, vars: {<<: *base, mode: none, msg: '^(You must provide the checksum|Checksums do not match)$'}}
  - {id: other-call, vars: {<<: *base, signCall: getMeetings}}
steps:
  - call: sendChatMessage
    params: {meetingID: "${uid}", message: x}
    sign: {mode: "${mode}", call: "${signCall}"}
    expect: {returncode: FAILED, messageKey: checksumError, message: {regex: "${msg}"}}
