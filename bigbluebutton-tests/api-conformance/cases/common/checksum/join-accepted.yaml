# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A valid checksum is accepted, with the shortest and the longest digest (sha256 signs
# every other case).
# The meeting exists, so the answer doesn't depend on which of several meeting errors
# bbb-web reports first.
id: join.checksum.accepted
title: join accepts a valid ${alg} checksum
endpoint: join
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: sha1, vars: {alg: sha1}}
  - {id: sha512, vars: {alg: sha512}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: Checksum test}
    golden: off
    expect: {returncode: SUCCESS}
  - call: join
    params: {meetingID: "${uid}", fullName: Ann, role: viewer, redirect: "false"}
    sign: "${alg}"
    expect: {returncode: SUCCESS}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
