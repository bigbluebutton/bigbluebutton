# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# After the last user leaves, isMeetingRunning stays true, though
# getMeetingInfo counts nobody, until bbb-web forgets the users who left:
# usersTimeout (60 seconds as shipped) after akka-apps removed them, at its
# next cleanup (every 15 seconds). meetingExpireWhenLastUserLeftInMinutes
# keeps the empty meeting from ending first. Recorded, not compared: still
# to be decided (the triage tag).
id: isMeetingRunning.users.last-left
title: isMeetingRunning after the last user left, until bbb-web forgets them
endpoint: isMeetingRunning
class: compat
tags: [triage, slow, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Users, meetingExpireWhenLastUserLeftInMinutes: "10"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
    capture: {annId: $.userId}
  - presence: {action: leave, as: ann}
    golden: off
  # akka-apps removes Ann, and tells bbb-web she left.
  - bus: {name: UserLeftMeetingEvtMsg, meetingId: "${intId}", within: 25s}
    golden: off
    expect: {jsonpath: {$.core.body.intId: "${annId}"}}
  - call: getMeetingInfo
    params: {meetingID: "${uid}"}
    golden: off
    eventually: {within: 5s, every: 200ms, until: {xpath: {/response/participantCount: "0"}}}
  - call: isMeetingRunning
    params: {meetingID: "${uid}"}
    golden: document
  - call: isMeetingRunning
    params: {meetingID: "${uid}"}
    golden: document
    eventually: {within: 90s, every: 1s, until: {xpath: {/response/running: "false"}}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
