# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# isMeetingRunning answers true once a user is in the meeting. bbb-web
# learns of the user from akka-apps a moment after they enter.
id: isMeetingRunning.users.joined
title: isMeetingRunning is true once a user is in the meeting
endpoint: isMeetingRunning
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Users}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
  - call: isMeetingRunning
    params: {meetingID: "${uid}"}
    eventually: {within: 10s, every: 200ms, until: {xpath: {/response/running: "true"}}}
    expect: {returncode: SUCCESS, xpath: {/response/running: "true"}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
