# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A live session token alone isn't enough for checkAuthorization: the request
# must bring the HTTP session (JSESSIONID) that the user's join set up, and
# name the token in a param spelt exactly sessionToken. Otherwise it answers
# 401 "unauthorized" with no user headers. (A meeting created with
# allowRequestsWithoutSession lifts the first rule: connection.authz.without-session.)
id: connection.authz.session
title: checkAuthorization refuses a live token ${case}
endpoint: connection
class: contract
tags: [ci]
requires: [akka]
variants:
  # Sent without the join's cookies: not recorded.
  - {id: none, vars: {case: without the join's HTTP session, client: nobody, param: sessionToken, golden: "off"}}
  - {id: other-user, vars: {case: with another user's HTTP session, client: bob, param: sessionToken, golden: compare}}
  - {id: param-case, vars: {case: under another letter case of the param, client: ann, param: SessionToken, golden: compare}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: "Hook test"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {annToken: /response/session_token}
  - call: join
    client: bob
    params: {meetingID: "${uid}", fullName: Bob, role: viewer, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
  - route: connection-authz
    client: "${client}"
    headers: {X-Original-URI: "/bbb-webrtc-sfu?${param}=${annToken}"}
    golden: "${golden}"
    expect:
      status: 401
      body: unauthorized
      headers: {User-Id: {absent: true}, Meeting-Id: {absent: true}}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
