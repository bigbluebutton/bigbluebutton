# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# checkAuthorization finds the session token anywhere in X-Original-URI's
# query, among the other params the original request had.
id: connection.authz.token-position
title: checkAuthorization finds the session token ${case}
endpoint: connection
class: contract
tags: [ci]
requires: [akka]
variants:
  - {id: alone, vars: {case: as the only param, before: "", after: ""}}
  - {id: first, vars: {case: before other params, before: "", after: "&a=1&b=2"}}
  - {id: middle, vars: {case: between other params, before: "a=1&", after: "&b=2"}}
  - {id: last, vars: {case: after other params, before: "a=1&b=2&", after: ""}}
steps:
  - call: create
    params: {meetingID: "${uid}", name: "Hook test"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, role: moderator, redirect: "false"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {annToken: /response/session_token, annId: /response/user_id}
  - route: connection-authz
    client: ann
    headers: {X-Original-URI: "/bbb-webrtc-sfu?${before}sessionToken=${annToken}${after}"}
    expect:
      status: 200
      body: authorized
      headers: {User-Id: "${annId}"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
