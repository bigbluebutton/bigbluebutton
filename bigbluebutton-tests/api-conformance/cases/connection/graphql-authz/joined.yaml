# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# Once a user's client has entered the meeting, checkGraphqlAuthorization's
# flags follow their state there: online, their role, presenter (the first
# moderator to enter becomes it), and notes, which a viewer has too while the
# meeting doesn't lock notes, even though viewers join locked.
id: connection.graphql-authz.joined
title: checkGraphqlAuthorization reports the state of users in the meeting
endpoint: connection
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: "Hook test"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
    capture: {annToken: $.sessionToken, annId: $.userId}
  - presence: {action: join, as: bob, args: {meetingID: "${uid}", fullName: Bob, role: viewer}}
    golden: off
    capture: {bobToken: $.sessionToken, bobId: $.userId}
  # bbb-web learns of the users, and of Ann becoming presenter, from
  # akka-apps a moment later.
  - route: connection-graphql-authz
    client: ann
    headers: {x-session-token: "${annToken}"}
    eventually: {within: 10s, every: 200ms, until: {headers: {User-Currently-Online: "true", User-Is-Presenter: "true"}}}
    expect:
      status: 200
      headers:
        User-Id: "${annId}"
        User-Is-Moderator: "true"
        User-Is-Presenter: "true"
        User-Notes-Enabled: "true"
        User-Currently-Online: "true"
      jsonpath: {"$['X-Moderator']": "true", "$['X-Presenter']": "true", "$['X-Currently-Online']": "true"}
  - route: connection-graphql-authz
    client: bob
    headers: {x-session-token: "${bobToken}"}
    eventually: {within: 10s, every: 200ms, until: {headers: {User-Currently-Online: "true"}}}
    expect:
      status: 200
      headers:
        User-Id: "${bobId}"
        User-Is-Moderator: "false"
        User-Is-Presenter: "false"
        User-Notes-Enabled: "true"
        User-Currently-Online: "true"
      jsonpath: {"$['X-Moderator']": "false", "$['X-Presenter']": "false", "$['X-Currently-Online']": "true"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
