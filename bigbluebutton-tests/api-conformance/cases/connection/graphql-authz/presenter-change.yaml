# yaml-language-server: $schema=../../../runner/schema/case.schema.json
# A presenter change in the meeting shows in checkGraphqlAuthorization's
# answers: the new presenter's flag turns true, the old one's false.
id: connection.graphql-authz.presenter-change
title: checkGraphqlAuthorization follows a presenter change in the meeting
endpoint: connection
class: contract
tags: [ci, presence]
requires: [akka, presence]
steps:
  - call: create
    params: {meetingID: "${uid}", name: "Hook test"}
    golden: off
    expect: {returncode: SUCCESS}
    capture: {intId: /response/internalMeetingID}
  - bus: {name: MeetingCreatedEvtMsg, meetingId: "${intId}", within: 5s}
    golden: off
  - presence: {action: join, as: ann, args: {meetingID: "${uid}", fullName: Ann, role: moderator}}
    golden: off
    capture: {annToken: $.sessionToken}
  - presence: {action: join, as: bob, args: {meetingID: "${uid}", fullName: Bob, role: viewer}}
    golden: off
    capture: {bobToken: $.sessionToken, bobId: $.userId}
  - route: connection-graphql-authz
    client: ann
    headers: {x-session-token: "${annToken}"}
    golden: off
    eventually: {within: 10s, every: 200ms, until: {headers: {User-Is-Presenter: "true"}}}
    expect: {headers: {User-Is-Presenter: "true"}}
  - route: connection-graphql-authz
    client: bob
    headers: {x-session-token: "${bobToken}"}
    golden: off
    eventually: {within: 10s, every: 200ms, until: {headers: {User-Currently-Online: "true"}}}
    expect: {headers: {User-Is-Presenter: "false"}}
  - graphql:
      as: ann
      query: "mutation SetPresenter($id: String!) { userSetPresenter(userId: $id) }"
      variables: {id: "${bobId}"}
    golden: off
  - route: connection-graphql-authz
    client: bob
    headers: {x-session-token: "${bobToken}"}
    eventually: {within: 10s, every: 200ms, until: {headers: {User-Is-Presenter: "true"}}}
    expect:
      status: 200
      headers: {User-Is-Presenter: "true"}
      jsonpath: {"$['X-Presenter']": "true"}
  - route: connection-graphql-authz
    client: ann
    headers: {x-session-token: "${annToken}"}
    eventually: {within: 10s, every: 200ms, until: {headers: {User-Is-Presenter: "false"}}}
    expect:
      status: 200
      headers: {User-Is-Presenter: "false", User-Is-Moderator: "true"}
      jsonpath: {"$['X-Presenter']": "false"}
teardown:
  # Again until bbb-web no longer knows the meeting: an end that reaches
  # akka-apps before the create does is lost.
  - call: end
    params: {meetingID: "${uid}"}
    ignoreResult: true
    eventually: {within: 2s, every: 100ms, until: {messageKey: notFound}}
