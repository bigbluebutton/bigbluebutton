# Extra normalization rules for diff and record mode, on top of the
# built-in ones listed in the README under "Normalized responses". A rule here
# wins over a built-in one for the same field. Add a mask when a value that
# changes from run to run shows up as a difference.
#
#   masks:     [{field: name, as: time|date|internal-id|user-id|random|token}]
#              [{path: turnServers[]/username, as: regex, regex: '^\d+:', replace: '<expiry>:'}]
#   unordered: [{path: meetings/meeting, key: meetingID}]
#   scope:     [{path: meetings/meeting, key: meetingID}]
#   drop:      [{path: /response/messageKey, value: noMeetings}]
#   headers:   [User-Id, Meeting-Id]
masks:
  # With no checksum, bbb-web answers either message at random: two checks
  # put different messages under the same error key. A defect
  # (getMeetings.checksum.missing-message).
  - field: message
    as: regex
    regex: '^(You must provide the checksum|Checksums do not match)$'
    replace: '<missing-checksum message>'
  # join redirects with the same two messages in its errors query param.
  - field: errors
    as: regex
    regex: '"message":"(You must provide the checksum|Checksums do not match)"'
    replace: '"message":"<missing-checksum message>"'
  # Under allowRevealOfBBBVersion the version endpoint returns the installed
  # release, which changes per build; the empty default stays as it is.
  - path: /response/bbbVersion
    as: regex
    regex: '^[0-9][0-9A-Za-z.+-]*$'
    replace: '<version>'
  # The plugin SDK version the version endpoint returns changes with the
  # SDK (bigbluebutton.properties), in XML and JSON answers alike.
  - field: html5PluginSdkVersion
    as: regex
    regex: '^[0-9][0-9A-Za-z.+-]*$'
    replace: '<version>'
  # A logout URL's %%USERID%% placeholder becomes the user's internal ID,
  # which changes from run to run: a whole path segment or query value.
  - field: logoutUrl
    as: regex
    regex: '([=/])w_[a-z0-9]{12}(&|$)'
    replace: '${1}w_<id>${2}'
  # The auth hooks name the user and meeting in headers (cases/connection):
  # the internal user ID (also the external one when join had no userID),
  # and the meeting's create time and voice bridge, change from run to run.
  - field: User-Id
    as: user-id
  - field: User-External-Id
    as: user-id
  - field: Meeting-Create-Time
    as: time
  - field: Voice-Bridge
    as: random
  # ...and checkGraphqlAuthorization's JSON body has the user ID too.
  - field: X-UserId
    as: user-id
  # getRecordingTextTracks' track URLs carry a single-use token, new on
  # every call.
  - field: href
    as: regex
    regex: '/textTrack/[0-9a-f]{40}/'
    replace: '/textTrack/<token>/'
# getRecordings lists recordings, and each recording's playback
# formats, in the order the server's file system lists their directories.
unordered:
  - {path: recordings/recording, key: recordID}
  - {path: recordings/recording/playback/format, key: type}
scope: []
drop: []
# The auth hooks' answer headers, recorded where a response has them.
headers: [User-Id, Meeting-Id, Voice-Bridge, User-Name, Meeting-Name, Meeting-Create-Time,
  Meeting-External-Id, User-External-Id, User-Is-Moderator, User-Is-Presenter,
  User-Notes-Enabled, User-Currently-Online]
