# A check step compares what earlier steps captured, here a TURN credential
# from one stuns answer: the password is the Base64 HMAC-SHA1 of the
# username, keyed with the TURN server's secret (the target's turnSecret
# var, which gives it the turn capability), and the username starts with
# the expiry, now plus ttl.
id: stuns.response.turn-credentials
title: stuns hands out a TURN credential made with the server's secret
endpoint: stuns
class: contract
tags: [ci]
requires: [akka, turn]
steps:
  - call: create
    params: {meetingID: "${uid}", name: Turn}
  - call: join
    client: ann
    params: {meetingID: "${uid}", fullName: Ann, redirect: "false"}
    capture: {annId: /response/user_id, annToken: /response/session_token}
  - call: stuns
    client: ann
    params: {sessionToken: "${annToken}"}
    expect:
      format: json
      jsonpath:
        $.turnServers[0].username: {regex: '^[0-9]+:${annId}$'}
        $.turnServers[0].ttl: {between: [1, 604800]}
    capture: {user: "$.turnServers[0].username", password: "$.turnServers[0].password", ttl: "$.turnServers[0].ttl"}
  - check:
      - value: "${password}"
        expect: '${hmac("sha1", target.turnSecret, user)}'
      - value: '${match(user, "^([0-9]+):")}'
        expect: {between: ['${add(add(now(), ttl), -60)}', '${add(add(now(), ttl), 60)}']}
teardown:
  - {call: end, params: {meetingID: "${uid}"}}
