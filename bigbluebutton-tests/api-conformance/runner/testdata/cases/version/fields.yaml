id: version.index.fields
title: The version endpoint answers without a checksum
endpoint: version
class: contract
tags: [ci]
steps:
  - call: ""
    expect:
      returncode: SUCCESS
      headers:
        Content-Type: {contains: xml}
      xpath:
        /response/version: {exists: true}
        /response/bbbVersion: {count: 1}
    golden: compare
