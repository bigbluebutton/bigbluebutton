# bbb-api, the Go port, behind nginx at /meeting-api/ on the same server as
# bbb-web (bbb-api/bigbluebutton-api.nginx). BBB_URL gives the host and
# BBB_SECRET the salt; both servers share them.
name: bbb-api
apiPrefix: /meeting-api/
capabilities: [akka]
# No routes yet: bbb-api serves only API calls, so route cases are skipped
# as not-routed.
