notes: >-
  Each page's indirect /Resources dictionary has /Self pointing at its own object. Measured with
  poppler 24.02: pdfinfo, pdfseparate, pdftocairo and pdftoppm print no warning and render
  normally (every indirect reference starts a fresh recursion set in PDFDoc::markObject), so this
  guards against regressions rather than reproducing the 'Found recursive dicts' flood of #12839.
