notes: >-
  Port of deck-camera-exif6.pptx, with the picture centred instead of overflowing the right edge.
  python-pptx sizes the frame from the stored 480x320 pixels and ignores EXIF, and LibreOffice
  draws the stored pixels, so the slide shows the photo sideways: known to fail the marker check.
  Compare with PowerPoint before calling it a bug (#26001 analysis). LibreOffice 25.8: one 720x540
  page, photo turned 90 degrees counter-clockwise (red band on the left).
