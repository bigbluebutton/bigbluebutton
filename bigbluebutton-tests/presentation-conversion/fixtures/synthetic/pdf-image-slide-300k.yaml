id: pdf-image-slide-300k
title: "One slide holding an 800x600 photo-like JPEG of about 300 KB"
tier: synthetic
file: pdf-image-slide-300k.pdf
issues: []
catalog: ["Oversized single page", "Preupload via create API"]
upload:
  method: create
pages: 1
expect: converted
expectByProfile:
  tight-limits: measure
kind: vector
marker: false
aspect: auto
profiles: [defaults, tight-limits]
notes: >-
  Seeded gradients, blobs and grain so the JPEG stays between 250 and 350 KB. tight-limits is
  `measure`: the page exceeds maxBigPdfPageSize (50000), so bbb-web first downscales it, and its
  SVG may then exceed maxBigSvgSize (200000) and become blank.
