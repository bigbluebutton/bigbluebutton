pages: 8
expect: converted
kind: { defaults: vector, rasterize-all: raster }
marker: true
aspect: auto
profiles: [defaults, rasterize-all]
notes: >-
  Port of exif-orientation-1-to-8.pdf with 240x160 px pictures on 240x160 pt pages. The pixels are
  upright and the content stream does not compensate: PDF ignores EXIF, so every page must show
  the marker upright. pdftocairo copies the JPEG bytes, EXIF included, into the SVG and browsers
  then apply the orientation (#26001).
