- fixture: img-jpg-exif6-camera
  profiles: "*"
  checks: [thumb]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/13351
  since: 2026-10-09
  note: >-
    The slide is auto-oriented by ImageMagick, but ThumbnailCreatorImp runs `convert -thumbnail` without
    -auto-orient, so the thumbnail of a portrait phone photo is sideways. The golden is the correct thumbnail.

- fixture: pdf-rotate-cropbox-3p
  profiles: "*"
  pages: [3]
  checks: [thumb]
  issue: "not filed yet: thumbnails ignore the PDF CropBox"
  since: 2026-10-09
  note: >-
    ThumbnailCreatorImp runs pdftoppm without -cropbox, so the thumbnail of a cropped page shows the whole
    MediaBox (content outside the crop, 3:2 instead of 16:9) while the slide itself is cropped. The golden is the
    thumbnail with -cropbox.

- fixture: off-pptx-phone-photo-exif6
  profiles: "*"
  checks: [marker]
  issue: "not filed yet: LibreOffice ignores the EXIF orientation of pictures in PowerPoint decks"
  since: 2026-10-09
  note: >-
    The deck holds a portrait phone photo stored sideways with EXIF Orientation 6; LibreOffice draws the stored
    pixels, so the slide, its thumbnail and the recording show it rotated. Compare with PowerPoint before filing.
