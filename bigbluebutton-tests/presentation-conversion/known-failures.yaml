# Presentations where bbb-web's defaults do not give the correct result today.
# A listed check that fails is reported as "known" and does not fail the run; a listed check that passes is
# reported as "fixed" so the entry can be removed. Fields: fixture, profiles (list or "*"), pages (list or "*"),
# checks (outcome, pages, kind, aspect, exif, text, marker, pixels, thumb, served), issue, since, note.

- fixture: rt-pdf-oversized-31mb-insert
  profiles: "*"
  checks: [outcome]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26508
  since: 2026-10-09
  note: >-
    bbb-web rejects the download and sends FILE_TOO_LARGE, but akka-apps only updates an existing pres_presentation
    row (PresPresentationDAO.updateErrors) and an insertDocument upload that fails before conversion has none, so
    the error never reaches the database or the presenter.

- fixture: pdf-exif-1-to-8
  profiles: [defaults]
  pages: [2, 3, 4, 5, 6, 7, 8]
  checks: [exif]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26001
  since: 2026-10-09
  note: pdftocairo copies the JPEG into the slide SVG with its EXIF block; browsers then rotate or mirror it.

- fixture: pdf-exif6-plus-control
  profiles: [defaults]
  checks: [exif]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26001
  since: 2026-10-09

- fixture: pdf-img2pdf-rotate90-exif6
  profiles: [defaults]
  checks: [exif]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26001
  since: 2026-10-09

- fixture: img-jpg-exif6-camera
  profiles: "*"
  checks: [thumb]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/13351
  since: 2026-10-09
  note: >-
    The slide is auto-oriented by ImageMagick, but ThumbnailCreatorImp runs `convert -thumbnail` without
    -auto-orient, so the thumbnail of a portrait phone photo is sideways. The golden is the correct thumbnail.

- fixture: pdf-rotate-cropbox-3p
  profiles: "*"
  pages: [3]
  checks: [thumb]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26506
  since: 2026-10-09
  note: >-
    ThumbnailCreatorImp runs pdftoppm without -cropbox, so the thumbnail of a cropped page shows the whole
    MediaBox (content outside the crop, 3:2 instead of 16:9) while the slide itself is cropped. The golden is the
    thumbnail with -cropbox.

- fixture: off-pptx-phone-photo-exif6
  profiles: "*"
  checks: [marker]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26510
  since: 2026-10-09
  note: >-
    The deck holds a portrait phone photo stored sideways with EXIF Orientation 6; LibreOffice draws the stored
    pixels, so the slide, its thumbnail and the recording show it rotated. PowerPoint's rendering of such a deck is
    unverified; the issue says so.

- fixture: rt-pdf-padded-500k-insert
  profiles: [tight-limits]
  checks: [outcome]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26508
  since: 2026-10-09
  note: Same cause as rt-pdf-oversized-31mb-insert, here for a base64 document over maxFileSizeUpload=400000.

- fixture: pdf-rotate-cropbox-3p
  profiles: [rasterize-all]
  pages: [3]
  checks: [aspect, pixels]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/26507
  since: 2026-10-09
  note: >-
    SvgImageCreatorImp.createRasterizationProcess runs pdftoppm without -cropbox, so a rasterized cropped page
    shows the whole MediaBox (content outside the crop, 3:2 instead of 16:9). The vector path is correct.

- fixture: repo-hello-txt
  profiles: [office-precheck]
  checks: [outcome, pages]
  issue: https://github.com/bigbluebutton/bigbluebutton/issues/25432
  since: 2026-10-09
  note: >-
    With skipOfficePrecheck=false, OfficeToPdfConversionService rejects every file the pre-check finds valid (the
    condition lost its negation in 4f453c4026, 2020), before LibreOffice runs. The message then says
    OFFICE_DOC_CONVERSION_FAILED, not INVALID, because OfficeToPdfConversionSuccessFilter hardcodes that key.

