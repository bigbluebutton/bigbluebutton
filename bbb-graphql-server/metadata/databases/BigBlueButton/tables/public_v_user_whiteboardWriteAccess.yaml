table:
  name: v_user_whiteboardWriteAccess
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: user_whiteboardWriteAccess
  custom_root_fields: {}
select_permissions:
  - role: bbb_client
    permission:
      columns:
        - isModerator
        - name
        - presenter
        - userId
      filter:
        _and:
          - meetingId:
              _eq: X-Hasura-MeetingId
          - _or:
              - isModerator:
                  _eq: true
              - meetingId:
                  _eq: X-Hasura-NotLockedInMeeting
              - _exists:
                  _table:
                    name: v_meeting_lockSettings
                    schema: public
                  _where:
                    _and:
                      - meetingId:
                          _eq: X-Hasura-MeetingId
                      - hideViewersAnnotation:
                          _eq: false
              - userId:
                  _eq: X-Hasura-LockedUserId
    comment: ""
