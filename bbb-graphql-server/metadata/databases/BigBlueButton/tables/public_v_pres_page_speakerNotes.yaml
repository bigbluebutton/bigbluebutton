table:
  name: v_pres_page_speakerNotes
  schema: public
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: pres_page_speakerNotes
  custom_root_fields: {}
select_permissions:
  - role: bbb_client
    permission:
      columns:
        - isCurrentPage
        - num
        - pageId
        - presentationId
        - speakerNotes
      filter:
        _or:
          - meetingId:
              _eq: X-Hasura-PresenterInMeeting
          - meetingId:
              _eq: X-Hasura-ModeratorInMeeting
